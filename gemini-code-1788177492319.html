<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>クロックメーカー</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #1a1a24;
      color: #fff;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* ナビゲーションバー */
    .navbar {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 10px 20px;
      border-radius: 30px;
      z-index: 100;
      align-items: center;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .nav-btn.active, .nav-btn:hover {
      background: #ff4757;
      border-color: #ff4757;
    }

    .custom-trigger-btn {
      background: #2ed573;
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }

    /* ステージ領域 */
    #stage {
      width: 100vw;
      height: 100vh;
      position: relative;
      background-color: #1a1a24;
      background-size: cover;
      background-position: center;
    }

    .draggable {
      position: absolute;
      display: inline-block;
      overflow: visible;
      min-width: 50px;
      min-height: 50px;
    }

    .page-content {
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 5rem;
      font-weight: bold;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
      background: rgba(0, 0, 0, 0.4);
      padding: 20px 40px;
      border-radius: 20px;
      border: 2px dashed rgba(255, 255, 255, 0.2);
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .hidden {
      display: none !important;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      justify-content: center;
      align-items: center;
      font-size: 1rem;
    }

    .controls button, .controls input, .controls select {
      font-size: 1rem;
      padding: 8px 16px;
      border-radius: 5px;
      border: none;
      cursor: pointer;
    }

    .controls input[type="number"], .controls input[type="time"] {
      background: #fff;
      color: #000;
    }

    /* 四隅リサイズ用スタイル */
    .draggable-wrapper {
      position: absolute;
      display: inline-block;
      min-width: 50px;
      min-height: 50px;
    }
    
    .draggable-wrapper:hover, .draggable:hover {
      outline: 2px dashed rgba(255, 255, 255, 0.5);
    }

    .resize-handle {
      position: absolute;
      width: 14px;
      height: 14px;
      background: white;
      border: 2px solid #2ed573;
      border-radius: 50%;
      z-index: 100;
      display: none;
    }

    .draggable-wrapper:hover .resize-handle, 
    .draggable:hover .resize-handle {
      display: block;
    }

    .resize-nw { top: -7px; left: -7px; cursor: nwse-resize; }
    .resize-ne { top: -7px; right: -7px; cursor: nesw-resize; }
    .resize-sw { bottom: -7px; left: -7px; cursor: nesw-resize; }
    .resize-se { bottom: -7px; right: -7px; cursor: nwse-resize; }

    .content-inner {
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .content-inner img, .content-inner svg {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .sticker-item {
      font-size: 4rem;
      line-height: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
    }

    /* モーダル */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: #2f3542;
      width: 700px;
      height: 520px;
      border-radius: 15px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      position: relative;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e272e;
      padding: 0 10px;
    }

    .modal-header-left {
      display: flex;
      overflow-x: auto;
    }

    .modal-header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .modal-tab {
      padding: 15px 15px;
      background: transparent;
      border: none;
      color: #888;
      font-size: 0.95rem;
      cursor: pointer;
      font-weight: bold;
      white-space: nowrap;
    }

    .modal-tab.active {
      color: #fff;
      background: #2f3542;
    }

    .btn-download {
      background: #1e90ff;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .btn-download:hover {
      background: #3742fa;
    }

    .btn-close {
      background: transparent;
      border: none;
      color: #aaa;
      font-size: 1.8rem;
      padding: 0 10px;
      cursor: pointer;
      line-height: 1;
    }

    .modal-body {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .sticker-grid, .material-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      text-align: center;
    }

    /* 素材の被り防止CSS */
    .sticker-option, .material-option {
      font-size: 2rem;
      padding: 5px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 60px;
      overflow: hidden;
      position: relative;
      box-sizing: border-box;
    }
    
    .material-option svg {
      max-width: 100%;
      max-height: 100%;
      display: block;
    }

    .sticker-option:hover, .material-option:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .file-upload-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100%;
      border: 2px dashed #57606f;
      border-radius: 10px;
      gap: 15px;
      padding: 20px;
      overflow-y: auto;
    }

    .file-upload-wrapper input[type="file"] {
      display: none;
    }
    
    .file-upload-wrapper input[type="color"] {
      cursor: pointer;
      border: none;
      padding: 0;
      background: none;
    }

    .upload-btn {
      padding: 10px 20px;
      background: #ff4757;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 20px;
    }

    #image-history {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      width: 100%;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .history-thumb {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 5px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border 0.2s;
    }

    .history-thumb:hover {
      border: 2px solid #ff4757;
    }
    
    .sound-select-wrapper {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 80%;
      margin: 0 auto;
    }
    
    .sound-select-wrapper select {
      padding: 10px;
      font-size: 1.1rem;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <div class="navbar">
    <button class="nav-btn active" onclick="switchPage(this, 'page1')">1. 現在時刻</button>
    <button class="nav-btn" onclick="switchPage(this, 'page2')">2. タイマー</button>
    <button class="nav-btn" onclick="switchPage(this, 'page3')">3. アラーム</button>
    <button class="custom-trigger-btn" onclick="toggleCustomModal()">カスタム [C]</button>
  </div>

  <div id="stage">
    <div id="page1" class="draggable page-content">
      <div id="clock-display">00:00:00</div>
    </div>

    <div id="page2" class="draggable page-content hidden">
      <div id="timer-display">05:00</div>
      <div class="controls">
        <input type="number" id="timer-min-input" min="0" max="99" value="5" style="width: 60px; text-align: center;" onchange="setTimerFromInput()"> 分
        <input type="number" id="timer-sec-input" min="0" max="59" value="0" style="width: 60px; text-align: center;" onchange="setTimerFromInput()"> 秒
        <button onclick="setTimerFromInput()">設定</button>
      </div>
      <div class="controls">
        <button onclick="startTimer()">スタート</button>
        <button onclick="stopTimer()">ストップ</button>
        <button onclick="resetTimer()">リセット</button>
      </div>
    </div>

    <div id="page3" class="draggable page-content hidden">
      <div id="alarm-display">OFF</div>
      <div class="controls">
        <input type="time" id="alarm-time">
        <button onclick="setAlarm()">設定</button>
        <button onclick="clearAlarm()">解除</button>
      </div>
    </div>
  </div>

  <!-- カスタム画面 (モーダル) -->
  <div id="custom-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-header-left">
          <button class="modal-tab active" onclick="switchTab(this, 'image-tab')">画像</button>
          <button class="modal-tab" onclick="switchTab(this, 'sticker-tab')">ステッカー</button>
          <button class="modal-tab" onclick="switchTab(this, 'material-tab')">素材</button>
          <button class="modal-tab" onclick="switchTab(this, 'bg-tab')">背景</button>
          <button class="modal-tab" onclick="switchTab(this, 'sound-tab')">サウンド</button>
        </div>
        <div class="modal-header-right">
          <button class="btn-download" onclick="downloadHTML()">📥 保存(HTML)</button>
          <button class="btn-close" onclick="toggleCustomModal()">&times;</button>
        </div>
      </div>

      <div class="modal-body">
        <div id="image-tab" class="tab-content">
          <div class="file-upload-wrapper">
            <p>自分の画像を選択して時計をデコレーション</p>
            <p style="font-size: 0.8rem; color: #ccc;">※四隅をドラッグでサイズ調整できます。ダブルクリックで削除。</p>
            <label class="upload-btn">
              画像ファイルを選択
              <input type="file" accept="image/*" onchange="uploadImage(event)">
            </label>
            <div id="image-history"></div>
          </div>
        </div>

        <div id="sticker-tab" class="tab-content hidden">
          <p style="text-align:center; font-size: 0.8rem; color: #ccc; margin-bottom: 10px;">※四隅をドラッグでサイズ調整できます。ダブルクリックで削除。</p>
          <div class="sticker-grid" id="sticker-grid"></div>
        </div>
        
        <div id="material-tab" class="tab-content hidden">
          <p style="text-align:center; font-size: 0.8rem; color: #ccc; margin-bottom: 10px;">※四隅をドラッグでサイズ調整できます。ダブルクリックで削除。</p>
          <div class="material-grid" id="material-grid"></div>
        </div>

        <div id="bg-tab" class="tab-content hidden">
          <div class="file-upload-wrapper">
            <p>現在のページの背景色を選択</p>
            <input type="color" id="bg-color-picker" onchange="changeBgColor(event)" style="width: 60px; height: 60px;">
            
            <p style="margin-top:20px;">背景画像をファイルから選択</p>
            <label class="upload-btn">
              画像ファイルを選択
              <input type="file" accept="image/*" onchange="uploadBgImage(event)">
            </label>
          </div>
        </div>
        
        <div id="sound-tab" class="tab-content hidden">
          <div class="file-upload-wrapper">
            <p>アラーム・タイマーの音を選択</p>
            <div class="sound-select-wrapper">
              <select id="sound-select" onchange="changeSoundType(event)">
                <option value="default">デフォルト (和音)</option>
                <option value="electronic">電子音 (ピピピ)</option>
                <option value="bell">ベル音 (チリーン)</option>
                <option value="custom">カスタム (ファイルを選択)</option>
              </select>
              
              <div id="custom-sound-upload" class="hidden" style="text-align: center; margin-top: 15px;">
                <label class="upload-btn">
                  音声ファイルを選択
                  <input type="file" accept="audio/*" onchange="uploadCustomSound(event)">
                </label>
                <p id="custom-sound-name" style="margin-top: 10px; font-size: 0.8rem; color: #ccc;"></p>
              </div>
              
              <button onclick="playAlarmSound()" style="margin-top: 20px; padding: 10px; background: #2ed573; border: none; color: white; border-radius: 5px; cursor: pointer;">🔈 音をテスト再生</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- ページごとの状態管理 ---
    let currentActivePage = 'page1';
    const pageStates = {
      page1: { bgColor: '#1a1a24', bgImg: 'none' },
      page2: { bgColor: '#1a1a24', bgImg: 'none' },
      page3: { bgColor: '#1a1a24', bgImg: 'none' }
    };

    // --- 非表示時のフォントサイズ0pxバグを修正したResizeObserver ---
    const scaleObserver = new ResizeObserver(entries => {
      for (let entry of entries) {
        const el = entry.target;
        const newHeight = entry.contentRect.height;
        const newWidth = entry.contentRect.width;

        // 非表示（サイズ0）のときはフォントサイズの再設定をスキップ
        if (newHeight <= 0 || newWidth <= 0) continue;

        const targetInner = el.querySelector('.sticker-item') || el;
        
        if (targetInner.classList.contains('sticker-item') || el.classList.contains('page-content')) {
          const minSize = Math.min(newHeight, newWidth);
          targetInner.style.fontSize = (minSize * 0.45) + 'px';
        }
      }
    });

    // 初期表示設定
    document.querySelectorAll('.page-content').forEach(el => {
      el.style.resize = 'none';
      addResizeHandlesToElement(el);
      scaleObserver.observe(el);
    });

    // --- ページ切り替え（表示時のサイズ復元処理を追加） ---
    function switchPage(btnElement, pageId) {
      currentActivePage = pageId;
      
      document.querySelectorAll('.page-content').forEach(el => el.classList.add('hidden'));
      const activeEl = document.getElementById(pageId);
      if (activeEl) {
        activeEl.classList.remove('hidden');
        
        // 切り替え時にフォントサイズを再計算して確実に表示させる
        const rect = activeEl.getBoundingClientRect();
        if (rect.width > 0 && rect.height > 0) {
          const minSize = Math.min(rect.width, rect.height);
          activeEl.style.fontSize = (minSize * 0.45) + 'px';
        }
      }
      
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');
      
      const stage = document.getElementById('stage');
      if (stage && pageStates[pageId]) {
        stage.style.backgroundColor = pageStates[pageId].bgColor;
        stage.style.backgroundImage = pageStates[pageId].bgImg;
      }
      
      document.querySelectorAll('.draggable-wrapper').forEach(el => {
        if (el.getAttribute('data-page') === pageId) {
          el.style.display = 'inline-block';
        } else {
          el.style.display = 'none';
        }
      });
    }

    // --- サウンド設定と再生処理 ---
    let audioCtx;
    let selectedSoundType = 'default';
    let customAudioElement = null;

    function changeSoundType(e) {
      selectedSoundType = e.target.value;
      const customUpload = document.getElementById('custom-sound-upload');
      if (customUpload) {
        if (selectedSoundType === 'custom') {
          customUpload.classList.remove('hidden');
        } else {
          customUpload.classList.add('hidden');
        }
      }
    }

    function uploadCustomSound(e) {
      const file = e.target.files[0];
      if (file) {
        customAudioElement = new Audio(URL.createObjectURL(file));
        const nameEl = document.getElementById('custom-sound-name');
        if (nameEl) nameEl.textContent = `選択中: ${file.name}`;
      }
    }

    function playTone(freq, duration, startTimeOffset) {
      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime + startTimeOffset);
      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + startTimeOffset);
      osc.stop(audioCtx.currentTime + startTimeOffset + duration);
    }

    function playAlarmSound() {
      if (selectedSoundType === 'custom' && customAudioElement) {
        customAudioElement.currentTime = 0;
        customAudioElement.play();
        return;
      }

      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } else if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      if (selectedSoundType === 'electronic') {
        for(let i=0; i<4; i++) playTone(1200, 0.1, i*0.15);
      } else if (selectedSoundType === 'bell') {
        playTone(2000, 0.5, 0);
        playTone(2500, 0.4, 0.1);
      } else {
        playTone(880, 0.2, 0);
        playTone(1046.50, 0.6, 0.2);
      }
    }

    // --- 時計 & アラーム判定 ---
    let alarmTimeStr = null;
    let alarmTriggered = false;

    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const clockEl = document.getElementById('clock-display');
      if (clockEl) clockEl.textContent = `${hours}:${minutes}:${seconds}`;

      const currentTimeStr = `${hours}:${minutes}`;
      if (alarmTimeStr && currentTimeStr === alarmTimeStr && !alarmTriggered) {
        alarmTriggered = true;
        playAlarmSound();
        setTimeout(() => alert('⏰ アラームの時間です！'), 100);
      } else if (alarmTimeStr && currentTimeStr !== alarmTimeStr) {
        alarmTriggered = false;
      }
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- タイマー機能 ---
    let timerInterval = null;
    let timerSeconds = 300;
    let initialTimerSeconds = 300;

    function renderTimer() {
      const m = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
      const s = String(timerSeconds % 60).padStart(2, '0');
      const timerEl = document.getElementById('timer-display');
      if (timerEl) timerEl.textContent = `${m}:${s}`;
    }

    function setTimerFromInput() {
      stopTimer();
      const minEl = document.getElementById('timer-min-input');
      const secEl = document.getElementById('timer-sec-input');
      const mins = parseInt(minEl ? minEl.value : 0) || 0;
      const secs = parseInt(secEl ? secEl.value : 0) || 0;
      timerSeconds = mins * 60 + secs;
      initialTimerSeconds = timerSeconds;
      renderTimer();
    }

    function startTimer() {
      if (timerInterval || timerSeconds <= 0) return;
      timerInterval = setInterval(() => {
        if (timerSeconds > 0) {
          timerSeconds--;
          renderTimer();
        } else {
          stopTimer();
          playAlarmSound();
          setTimeout(() => alert('⏱️ タイマーが終了しました！'), 100);
        }
      }, 1000);
    }

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function resetTimer() {
      stopTimer();
      timerSeconds = initialTimerSeconds;
      renderTimer();
    }

    // --- アラーム機能 ---
    function setAlarm() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const alarmInput = document.getElementById('alarm-time');
      const val = alarmInput ? alarmInput.value : null;
      if (val) {
        alarmTimeStr = val;
        alarmTriggered = false;
        const displayEl = document.getElementById('alarm-display');
        if (displayEl) displayEl.textContent = val;
        alert(`アラームを ${val} に設定しました`);
      }
    }

    function clearAlarm() {
      alarmTimeStr = null;
      alarmTriggered = false;
      const displayEl = document.getElementById('alarm-display');
      if (displayEl) displayEl.textContent = 'OFF';
    }

    // --- ドラッグ＆リサイズ移動 ---
    let isDragging = false;
    let isResizing = false;
    let activeElement = null;
    let currentResizeHandle = '';
    let startX, startY, startWidth, startHeight, startLeft, startTop;

    document.addEventListener('mousedown', (e) => {
      if (['BUTTON', 'INPUT', 'LABEL', 'SELECT', 'OPTION'].includes(e.target.tagName)) return;

      if (e.target.classList.contains('resize-handle')) {
        isResizing = true;
        activeElement = e.target.parentElement;
        currentResizeHandle = e.target.className;
        
        startWidth = activeElement.offsetWidth;
        startHeight = activeElement.offsetHeight;
        
        if(activeElement.classList.contains('page-content')) {
          const rect = activeElement.getBoundingClientRect();
          startLeft = rect.left;
          startTop = rect.top;
          activeElement.style.transform = 'none';
          activeElement.style.left = startLeft + 'px';
          activeElement.style.top = startTop + 'px';
        } else {
          startLeft = activeElement.offsetLeft;
          startTop = activeElement.offsetTop;
        }

        startX = e.clientX;
        startY = e.clientY;
        e.preventDefault();
        return;
      }

      const target = e.target.closest('.draggable-wrapper') || e.target.closest('.draggable');
      if (!target) return;

      isDragging = true;
      activeElement = target;

      if(activeElement.classList.contains('page-content') && activeElement.style.transform !== 'none') {
          const rect = activeElement.getBoundingClientRect();
          activeElement.style.transform = 'none';
          activeElement.style.left = rect.left + 'px';
          activeElement.style.top = rect.top + 'px';
      }

      startX = e.clientX - activeElement.offsetLeft;
      startY = e.clientY - activeElement.offsetTop;
    });

    document.addEventListener('mousemove', (e) => {
      if (isResizing && activeElement) {
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        let newW = startWidth;
        let newH = startHeight;
        let newL = startLeft;
        let newT = startTop;

        if (currentResizeHandle.includes('se')) {
          newW = startWidth + dx;
          newH = startHeight + dy;
        } else if (currentResizeHandle.includes('sw')) {
          newW = startWidth - dx;
          newH = startHeight + dy;
          newL = startLeft + dx;
        } else if (currentResizeHandle.includes('ne')) {
          newW = startWidth + dx;
          newH = startHeight - dy;
          newT = startTop + dy;
        } else if (currentResizeHandle.includes('nw')) {
          newW = startWidth - dx;
          newH = startHeight - dy;
          newL = startLeft + dx;
          newT = startTop + dy;
        }

        if (newW > 30) {
          activeElement.style.width = newW + 'px';
          activeElement.style.left = newL + 'px';
        }
        if (newH > 30) {
          activeElement.style.height = newH + 'px';
          activeElement.style.top = newT + 'px';
        }
      } else if (isDragging && activeElement) {
        activeElement.style.left = (e.clientX - startX) + 'px';
        activeElement.style.top = (e.clientY - startY) + 'px';
      }
    });

    document.addEventListener('mouseup', () => {
      isDragging = false;
      isResizing = false;
      activeElement = null;
    });

    function makeDeletable(el) {
      el.addEventListener('dblclick', () => {
        scaleObserver.unobserve(el);
        el.remove();
      });
      el.title = "ダブルクリックで削除";
    }

    function addResizeHandlesToElement(el) {
      const handles = ['nw', 'ne', 'sw', 'se'];
      handles.forEach(dir => {
        const handle = document.createElement('div');
        handle.className = `resize-handle resize-${dir}`;
        el.appendChild(handle);
      });
    }

    function createCustomItemWrapper(contentElement) {
      const wrapper = document.createElement('div');
      wrapper.className = 'draggable-wrapper';
      wrapper.setAttribute('data-page', currentActivePage);
      wrapper.style.left = '150px';
      wrapper.style.top = '150px';
      wrapper.style.width = '120px';
      wrapper.style.height = '120px';

      const inner = document.createElement('div');
      inner.className = 'content-inner';
      inner.appendChild(contentElement);

      wrapper.appendChild(inner);
      addResizeHandlesToElement(wrapper);
      makeDeletable(wrapper);

      const stage = document.getElementById('stage');
      if (stage) stage.appendChild(wrapper);
      scaleObserver.observe(wrapper);
      
      return wrapper;
    }

    function toggleCustomModal() {
      const modal = document.getElementById('custom-modal');
      if (modal) modal.classList.toggle('hidden');
    }

    window.addEventListener('keydown', (e) => {
      if ((e.key === 'c' || e.key === 'C') && e.target.tagName !== 'INPUT') {
        toggleCustomModal();
      }
    });

    function switchTab(tabBtn, tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      const targetTab = document.getElementById(tabId);
      if (targetTab) targetTab.classList.remove('hidden');
      document.querySelectorAll('.modal-tab').forEach(btn => btn.classList.remove('active'));
      if (tabBtn) tabBtn.classList.add('active');
    }

    function changeBgColor(e) {
      const color = e.target.value;
      if (pageStates[currentActivePage]) {
        pageStates[currentActivePage].bgColor = color;
        pageStates[currentActivePage].bgImg = 'none';
      }
      
      const stage = document.getElementById('stage');
      if (stage) {
        stage.style.backgroundColor = color;
        stage.style.backgroundImage = 'none'; 
      }
    }

    function uploadBgImage(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        const bgUrl = `url(${event.target.result})`;
        if (pageStates[currentActivePage]) {
          pageStates[currentActivePage].bgImg = bgUrl;
        }
        
        const stage = document.getElementById('stage');
        if (stage) stage.style.backgroundImage = bgUrl;
      };
      reader.readAsDataURL(file);
    }

    function uploadImage(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        const imgSrc = event.target.result;
        addImageToStage(imgSrc);

        const historyContainer = document.getElementById('image-history');
        if (historyContainer) {
          const thumb = document.createElement('img');
          thumb.src = imgSrc;
          thumb.className = 'history-thumb';
          thumb.title = 'クリックで追加';
          thumb.onclick = () => {
            addImageToStage(imgSrc);
            toggleCustomModal();
          };
          historyContainer.appendChild(thumb);
        }
        toggleCustomModal();
      };
      reader.readAsDataURL(file);
      e.target.value = ''; 
    }

    function addImageToStage(src) {
      const img = document.createElement('img');
      img.src = src;
      createCustomItemWrapper(img);
    }

    // ステッカーリスト
    const stickerList = [
      '😀','😃','😄','😁','😆','😅','😂','🤣','🥲','☺️','😊','😇','🙂','🙃','😉','😌','😍','🥰','😘','😗','😙','😚','😋','😛','😝','😜','🤪','🤨','🧐','🤓','😎','🥸','🤩','🥳','😏','😒','😞','😔','😟','😕','🙁','☹️','😣','😖','😫','😩','🥺','😢','😭','😤','😠','😡','🤬','🤯','😳','🥵','🥶','😱','😨','😰','😥','😓','🤗','🤔','🤭','🤫','🤥','😶','😐','😑','😬','🙄','😯','😦','😧','😮','😲','🥱','😴','🤤','😪','😵','🤐','🥴','🤢','🤮','🤧','😷','🤒','🤕','🤑','🤠','😈','👿','👹','👺','🤡','💩','👻','💀','☠️','👽','👾','🤖','🎃','😺','😸','😹','😻','😼','😽','🙀','😿','😾',
      '🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐻‍❄️','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🐔','🐧','🐦','🐤','🐣','🐥','🦆','🦅','🦉','🦇','🐺','🐗','🐴','🦄','🐝','🪱','🐛','🦋','🐌','🐞','🐜','🪰','🪲','🪳','🦟','🦗','🕷️','🦂','🐢','🐍','🦎','🦖','🦕','🐙','🦑','🦐','🦞','🦀','🐡','🐠','🐟','🐬','🐳','🐋','🦈','🦭','🐊','🐅','豹','zebra','🦍','🦧','🦣','🐘','🦛','🦏','🐪','🐫','🦒','🦘','🦬','🐃','🐂','🐄','🐎','🐖','🐏','羊','🦙','🐐','鹿','🐕','🐩','🦮','🐕‍🦺','🐈','🐈‍⬛','🪶','🐓','🦃','🦤','🦚','🦜','🦢','🦩','🕊️','🐇','🦝','🦨','🦡','🦫','🦦','🦥','🐁','🐀','🐿️','🦔','🐾','🐉','🐲',
      '⏰','⏱️','⏲️','⌛','⏳','⌚','🕰️','💡','📌','🔔','🚩','🔒','🔑','🎁','✉️','✏️','🔍','❤️','🧡','💛','💚','💙','💜','🖤','🤍','🤎','💔','❤️‍🔥','❤️‍🩹','💕','💞','💓','💗','💖','💘','💝','💟'
    ];

    const stickerGrid = document.getElementById('sticker-grid');
    if (stickerGrid) {
      stickerList.forEach(emoji => {
        const item = document.createElement('div');
        item.className = 'sticker-option';
        item.textContent = emoji;
        item.onclick = () => {
          const sticker = document.createElement('div');
          sticker.className = 'sticker-item';
          sticker.textContent = emoji;
          createCustomItemWrapper(sticker);
          toggleCustomModal();
        };
        stickerGrid.appendChild(item);
      });
    }

    // 1000種類の素材を生成（被り防止対応）
    window.addEventListener('DOMContentLoaded', () => {
      const materialGrid = document.getElementById('material-grid');
      if (!materialGrid) return;

      const colors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#ff6348', '#a4b0be', '#eccc68', '#7bed9f', '#ff7f50', '#ff6b81'];
      const shapes = [
        (c) => `<circle cx="50" cy="50" r="40" fill="${c}" />`,
        (c) => `<rect x="15" y="15" width="70" height="70" rx="15" fill="${c}" />`,
        (c) => `<polygon points="50,15 85,85 15,85" fill="${c}" />`,
        (c) => `<polygon points="50,10 61,35 90,35 68,52 77,80 50,65 23,80 32,52 10,35 39,35" fill="${c}" />`,
        (c) => `<path d="M50 85 C 25 85, 15 50, 50 15 C 85 50, 75 85, 50 85 Z" fill="${c}" />`,
        (c) => `<circle cx="35" cy="35" r="18" fill="${c}"/><circle cx="65" cy="35" r="18" fill="${c}"/><circle cx="35" cy="65" r="18" fill="${c}"/><circle cx="65" cy="65" r="18" fill="${c}"/>`,
        (c) => `<rect x="40" y="15" width="20" height="70" fill="${c}"/><rect x="15" y="40" width="70" height="20" fill="${c}"/>`
      ];

      for (let i = 0; i < 1000; i++) {
        const shapeFn = shapes[i % shapes.length];
        const color = colors[(Math.floor(i / shapes.length) + i) % colors.length];
        const rotation = (i * 15) % 360;
        
        const svgString = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="transform: rotate(${rotation}deg); fill-rule: evenodd;"><g transform-origin="50 50">${shapeFn(color)}</g></svg>`;
        
        const item = document.createElement('div');
        item.className = 'material-option';
        item.innerHTML = svgString;
        item.onclick = () => {
          const content = document.createElement('div');
          content.style.width = '100%';
          content.style.height = '100%';
          content.innerHTML = svgString;
          createCustomItemWrapper(content);
          toggleCustomModal();
        };
        materialGrid.appendChild(item);
      }
    });

    // 保存機能
    function downloadHTML() {
      const clone = document.documentElement.cloneNode(true);
      
      const customModal = clone.querySelector('#custom-modal');
      if (customModal) customModal.remove();

      const customBtn = clone.querySelector('.custom-trigger-btn');
      if (customBtn) customBtn.remove();
      
      const draggables = clone.querySelectorAll('.draggable, .draggable-wrapper, .page-content');
      draggables.forEach(el => {
        el.style.position = 'absolute';
        
        const handles = el.querySelectorAll('.resize-handle');
        handles.forEach(h => h.remove());

        el.classList.remove('draggable', 'draggable-wrapper');
        el.style.resize = 'none';
        el.style.cursor = 'default';
        el.style.outline = 'none';
      });

      const htmlContent = "<!DOCTYPE html>\n" + clone.outerHTML;
      const blob = new Blob([htmlContent], { type: 'text/html' });
      const link = document.createElement('a');
      link.download = `custom_clock_${Date.now()}.html`;
      link.href = URL.createObjectURL(blob);
      link.click();
    }
  </script>
