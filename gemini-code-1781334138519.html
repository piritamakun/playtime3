<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Countryballs: Survive!</title>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        body {
            margin: 0; padding: 0; background-color: #0b0b1e; color: white;
            font-family: 'Arial', sans-serif; display: flex; flex-direction: column;
            align-items: center; justify-content: center; min-height: 100vh;
            overflow: hidden; touch-action: none; user-select: none;
        }
        #gameContainer {
            position: relative; width: 100%; max-width: 400px; aspect-ratio: 2 / 3;
            border: 4px solid #333; border-radius: 10px; overflow: hidden;
            background: linear-gradient(to bottom, #000011, #050522);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        canvas { width: 100%; height: 100%; display: block; }
        .ui-layer {
            position: absolute; top: 12px; left: 12px; right: 12px;
            display: flex; flex-direction: column; gap: 5px; pointer-events: none;
            font-size: 16px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); z-index: 5;
        }
        .ui-top {
            display: flex; justify-content: space-between; color: #ffdda1; font-size: 18px;
        }
        .player-status-container {
            display: flex; flex-direction: column; gap: 2px; font-size: 13px;
        }
        
        .menu-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            background: rgba(5, 5, 15, 0.95); z-index: 10; padding: 15px; box-sizing: border-box;
            overflow-y: auto;
        }
        
        h1 { font-size: 24px; text-align: center; margin: 10px 0 5px; color: #ff4757; }
        .sub-text { text-align: center; margin-bottom: 15px; font-size: 14px; color: #ced6e0; line-height: 1.4; white-space: pre-wrap; font-weight: bold; }
        
        .section-title { font-size: 12px; color: #aaa; margin-top: 5px; margin-bottom: 5px; text-transform: uppercase; font-weight: bold; }
        
        .collapsible-header {
            background: #1e272e; border: 2px solid #576574; border-radius: 6px;
            padding: 6px 15px; width: 100%; max-width: 280px; text-align: center;
            font-size: 13px; font-weight: bold; cursor: pointer; margin-bottom: 5px;
            display: flex; justify-content: space-between; align-items: center;
            box-sizing: border-box; transition: 0.2s;
        }
        .collapsible-header:hover { background: #2f3640; border-color: #ff4757; }
        .hidden-panel { display: none !important; }
        
        .lang-panel {
            display: flex; flex-wrap: wrap; gap: 4px; justify-content: center;
            background: #111; padding: 6px; border-radius: 6px; border: 1px solid #444;
            max-height: 120px; overflow-y: auto; width: 100%; max-width: 280px; margin-bottom: 10px;
            box-sizing: border-box;
        }
        .lang-btn {
            background: #222; border: 1px solid #444; color: #ccc; padding: 4px 6px;
            font-size: 11px; border-radius: 4px; cursor: pointer; transition: 0.1s;
        }
        .lang-btn.active { background: #ff4757; color: white; border-color: #ff4757; font-weight: bold; }

        .grid-select {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
            width: 100%; max-width: 280px; margin-bottom: 5px;
        }
        .grid-4col {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px;
            margin-bottom: 15px; width: 100%; max-width: 280px;
        }
        .grid-wrap {
            display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; width: 100%; max-width: 280px; margin-bottom: 10px;
        }
        .option-box {
            background: #1e272e; border: 2px solid #576574; border-radius: 6px;
            padding: 5px 2px; text-align: center; cursor: pointer;
            font-weight: bold; font-size: 11px; transition: 0.1s;
        }
        .option-box.selected { border-color: #ff4757; background: #2f3640; box-shadow: 0 0 5px rgba(255, 71, 87, 0.4); }

        .menu-btn {
            padding: 10px 40px; font-size: 18px; font-weight: bold;
            color: white; border: none; border-radius: 25px;
            cursor: pointer; margin-bottom: 10px; width: 200px; text-align: center;
        }
        .start-btn { background-color: #ff4757; box-shadow: 0 5px #cf212f; }
        .start-btn:active { transform: translateY(5px); box-shadow: none; }
        
        .config-btn { background-color: #54a0ff; box-shadow: 0 5px #2e86de; font-size: 14px; padding: 8px 20px; }
        .config-btn:active { transform: translateY(5px); box-shadow: none; }

        .back-btn { background-color: #576574; box-shadow: 0 5px #222f3e; font-size: 14px; padding: 8px 20px; margin-top: 15px; }
        .back-btn:active { transform: translateY(5px); box-shadow: none; }

        .hidden { display: none !important; }

        .p-setting-block {
            background: rgba(255,255,255,0.05); border: 1px solid #444; border-radius: 8px;
            padding: 8px; width: 100%; max-width: 290px; margin-bottom: 10px; box-sizing: border-box;
        }
        .p-title { font-size: 13px; font-weight: bold; margin-bottom: 5px; border-left: 3px solid #ff4757; padding-left: 5px; }

        .pin-container { display: flex; flex-direction: column; align-items: center; gap: 10px; margin: 15px 0; width: 100%; max-width: 280px; }
        .pin-input { font-size: 24px; text-align: center; width: 160px; padding: 8px; letter-spacing: 4px; border-radius: 6px; border: 2px solid #54a0ff; background: #111; color: #fff; font-weight: bold; }
        .online-status { font-size: 12px; color: #feca57; text-align: center; min-height: 18px; margin-bottom: 15px; font-weight: bold; padding: 0 10px; line-height: 1.4; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #ff4757; border-radius: 3px; }
        
        .new-record { color: #ffd700; text-shadow: 0 0 10px #ffa500; font-size: 18px; animation: flash 1s infinite alternate; margin-bottom: 5px;}
        @keyframes flash { from { opacity: 0.8; } to { opacity: 1; transform: scale(1.05); } }
    </style>
</head>
<body>

<div id="gameContainer">
    <div class="ui-layer">
        <div class="ui-top">
            <div id="timerDisplay">0.0s</div>
            <div id="modeDisplay">1P MODE</div>
        </div>
        <div class="player-status-container" id="playerStatus"></div>
    </div>

    <div class="menu-screen" id="mainScreen">
        <h1 id="screenTitle">Survive!</h1>
        <div class="sub-text" id="screenSub">ライヒから逃げて生き残れ！</div>
        
        <div class="collapsible-header" id="langToggle">
            <span>🌍 <span id="lblLangToggle">Language</span></span>
            <span id="langArrow">▼</span>
        </div>
        <div class="lang-panel hidden-panel" id="langPanel"></div>

        <div class="section-title" id="lblPlayers">Players</div>
        <div class="grid-4col" id="playerSelect">
            <div class="option-box selected" data-players="1">1P</div>
            <div class="option-box" data-players="2">2P</div>
            <div class="option-box" data-players="3">3P</div>
            <div class="option-box" data-players="4">4P</div>
        </div>

        <button class="menu-btn start-btn" id="startBtn">START</button>
        <button class="menu-btn" style="background-color: #1dd1a1; box-shadow: 0 5px #10ac84;" id="toOnlineBtn">🌐 ONLINE</button>
        <button class="menu-btn config-btn" id="toConfigBtn">🔧 SETTINGS</button>
    </div>

    <div class="menu-screen hidden" id="configScreen">
        <h1 id="configTitle" style="color:#54a0ff; font-size:20px;">CUSTOM SETTINGS</h1>
        <div style="font-size:11px; color:#aaa; margin-bottom:10px;" id="configSub">各プレイヤーのキャラクターと操作を設定してください</div>
        <div id="playersConfigContainer" style="width:100%; display:flex; flex-direction:column; align-items:center;"></div>
        <button class="menu-btn back-btn" id="backToMenuBtn">↩️ BACK</button>
    </div>

    <div class="menu-screen hidden" id="onlineScreen">
        <h1 style="color:#1dd1a1; font-size:20px;">ONLINE PLAY</h1>
        <div class="sub-text" style="font-size:12px; color:#aaa; margin-bottom:5px;">4桁のパスワードを入力してください</div>
        <div class="pin-container">
            <input type="text" id="roomPin" class="pin-input" maxlength="4" placeholder="0000" oninput="value = value.replace(/[^0-9]/g, '');">
        </div>
        <div class="online-status" id="onlineStatus"></div>
        <button class="menu-btn start-btn" style="background-color:#ff4757; box-shadow:0 5px #cf212f;" id="btnCreateRoom">🏠 部屋を作成</button>
        <button class="menu-btn start-btn" style="background-color:#2e86de; box-shadow:0 5px #1b4f8f;" id="btnJoinRoom">🚀 部屋に入る</button>
        <button class="menu-btn back-btn" id="backFromOnlineBtn">↩️ BACK</button>
    </div>

    <canvas id="gameCanvas"></canvas>
</div>

<script>
    const i18n = {
        "ja": { t: "Survive!", sub: "ライヒから逃げて生き残れ！", st: "スタート", tm: "タイム", bs: "最高記録", nr: "✨最高記録更新！✨", ov: "全滅した！", rt: "リretry", la: "言語", plrs: "プレイ人数", cfg: "🔧 カスタム設定", cft: "CUSTOM SETTINGS", cfsub: "各プレイヤーのキャラクターと操作を設定してください", bk: "↩️ 戻る", pl: "ポーランド", jp: "日本", lg: "言語の国" },
        "en": { t: "Survive!", sub: "Dodge Reichtangle and survive!", st: "START", tm: "Time", bs: "Best", nr: "✨NEW RECORD!✨", ov: "Game Over!", rt: "RETRY", la: "Language", plrs: "Players", cfg: "🔧 SETTINGS", cft: "CUSTOM SETTINGS", cfsub: "Configure each player's character and controls", bk: "↩️ BACK", pl: "Poland", jp: "Japan", lg: "Lang Country" },
        "pl": { t: "Przetrwaj!", sub: "Unikaj Reichtangle i przeżyj!", st: "START", tm: "Czas", bs: "Rekord", nr: "✨NOWY REKORD!✨", ov: "Koniec Gry!", rt: "PONÓW", la: "Język", plrs: "Gracze", cfg: "🔧 USTAWIENIA", cft: "USTAWIENIA", cfsub: "Skonfiguruj postać i sterowanie każdego gracza", bk: "↩️ POWRÓT", pl: "Polska", jp: "Japonia", lg: "Kraj Języka" },
        "de": { t: "Überlebe!", sub: "Weiche Reichtangle aus!", st: "START", tm: "Zeit", bs: "Beste", nr: "✨NEUER REKORD!✨", ov: "Spiel vorbei!", rt: "NOCHMAL", la: "Sprache", plrs: "Spieler", cfg: "🔧 EINSTELL.", cft: "EINSTELLUNGEN", cfsub: "Charakter und Steuerung für jeden Spieler anpassen", bk: "ZURÜCK", pl: "Polen", jp: "Japan", lg: "Sprachland" },
        "fr": { t: "Survis !", sub: "Évite Reichtangle et survis !", st: "JOUER", tm: "Temps", bs: "Record", nr: "✨NOUVEAU RECORD!✨", ov: "Fin de partie!", rt: "RÉESSAYER", la: "Langue", plrs: "Joueurs", cfg: "🔧 CONFIG", cft: "PARAMÈTRES", cfsub: "Configurer le personnage et les contrôles de chaque joueur", bk: "↩️ RETOUR", pl: "Pologne", jp: "Japon", lg: "Pays Langue" },
        "es": { t: "¡Sobrevive!", sub: "¡Esquiva a Reichtangle!", st: "INICIAR", tm: "Tiempo", bs: "Mejor", nr: "✨¡NUEVO RÉCORD!✨", ov: "¡Juego terminado!", rt: "REINTENTAR", la: "Idioma", plrs: "Jugadores", cfg: "🔧 AJUSTES", cft: "AJUSTES", cfsub: "Configura el personagem y controles de cada jugador", bk: "↩️ VOLVER", pl: "Polonia", jp: "Japón", lg: "País Idioma" },
        "it": { t: "Sopravvivi!", sub: "Evita Reichtangle!", st: "INIZIA", tm: "Tempo", bs: "Record", nr: "✨NUOVO RECORD!✨", ov: "Game Over!", rt: "RIPROVA", la: "Lingua", plrs: "Giocatori", cfg: "🔧 OPZIONI", cft: "IMPOSTAZIONI", cfsub: "Configura personaggio e controlli per ogni giocatore", bk: "↩️ INDIETRO", pl: "Polonia", jp: "Giappone", lg: "Lingua" },
        "ko": { t: "살아남아라!", sub: "라이히탄글을 피해 생존하세요!", st: "시작", tm: "時間", bs: "최고기록", nr: "✨신기록!✨", ov: "전멸했다!", rt: "재시도", la: "언어", plrs: "플레이어 수", cfg: "🔧 커스텀 설정", cft: "상세 설정", cfsub: "각 플레이어의 캐릭터와 조작을設定하세요", bk: "↩️ 뒤로가기", pl: "폴란드", jp: "일본", lg: "언어 국가" },
        "zh": { t: "活下去！", sub: "躲避德意志帝国生存！", st: "开始", tm: "时间", bs: "最高记录", nr: "✨新纪录！✨", ov: "全军覆没！", rt: "重试", la: "语言", plrs: "玩家人数", cfg: "🔧 自定义设置", cft: "自定义设置", cfsub: "设置每位玩家的角色与操作方式", bk: "↩️ 返回", pl: "波兰", jp: "日本", lg: "语言国家" },
        "ru": { t: "Выживи!", sub: "Уклоняйся от Рейхтангола!", st: "СТАРТ", tm: "Время", bs: "Рекорд", nr: "✨НОВЫЙ РЕКОРД!✨", ov: "Игра окончена!", rt: "ЗАНОВО", la: "Язык", plrs: "Игроки", cfg: "🔧 НАСТРОЙКИ", cft: "НАСТРОЙКИ", cfsub: "Настройте персонажа и управление для каждого игрока", bk: "↩️ НАЗАД", pl: "Польша", jp: "Япония", lg: "Язык" }
    };
    const flagData = {
        ja: {t:'c', bg:'#fff', fg:'#bc002d'}, pl: {t:'h', c:['#ff4757', '#fff']}, en: {t:'cross', bg:'#fff', c1:'#012169', c2:'#C8102E'},
        de: {t:'h', c:['#000', '#d00', '#fc0']}, fr: {t:'v', c:['#002395', '#fff', '#ed2939']}, es: {t:'h', c:['#aa151b', '#f1bf00', '#aa151b']},
        it: {t:'v', c:['#009246', '#fff', '#ce2b37']}, ru: {t:'h', c:['#fff', '#1c3578', '#e4181c']},
        zh: {t:'c', bg:'#ee1c25', fg:'#ff0'}, ko: {t:'c', bg:'#fff', fg:'#c60c30'}
    };

    let currentLang = 'ja'; let pCount = 1;
    let playerDataConfigs = [
        { id: 1, char: 'poland', input: 'mouse', color: '#ff4757' },
        { id: 2, char: 'japan', input: 'tfgh', color: '#54a0ff' },
        { id: 3, char: 'lang', input: 'ijkl', color: '#1dd1a1' },
        { id: 4, char: 'poland', input: 'vbnm', color: '#feca57' }
    ];

    const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d');
    const mainScreen = document.getElementById('mainScreen'); const configScreen = document.getElementById('configScreen');
    const onlineScreen = document.getElementById('onlineScreen');
    canvas.width = 400; canvas.height = 600;

    let gameActive = false, spawnTimer = 0;
    let players = [], enemies = [], beams = [], keys = {}, targetX = 200;
    let shakeTimer = 0, startTime = 0, survivalTime = 0.0, nextBeamTime = 10;
    let isOnline = false, isHost = false, peer = null, conn = null;

    document.getElementById('langToggle').addEventListener('click', () => {
        const panel = document.getElementById('langPanel'); const arrow = document.getElementById('langArrow');
        const isHidden = panel.classList.toggle('hidden-panel'); arrow.textContent = isHidden ? '▼' : '▲';
    });

    const langPanel = document.getElementById('langPanel');
    Object.keys(i18n).forEach(code => {
        const btn = document.createElement('div'); btn.className = `lang-btn ${code === currentLang ? 'active' : ''}`;
        btn.textContent = code.toUpperCase(); btn.onclick = (e) => setLanguage(code, e.target);
        langPanel.appendChild(btn);
    });

    function setLanguage(code, targetBtn) {
        currentLang = code; document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
        if(targetBtn) targetBtn.add; const t = i18n[code];
        document.getElementById('screenTitle').textContent = t.t;
        if(!document.getElementById('screenSub').innerHTML.includes('s<br>')) document.getElementById('screenSub').textContent = t.sub;
        document.getElementById('startBtn').textContent = t.st; document.getElementById('lblLangToggle').textContent = t.la;
        document.getElementById('lblPlayers').textContent = t.plrs; document.getElementById('toConfigBtn').textContent = t.cfg;
        document.getElementById('configTitle').textContent = t.cft; document.getElementById('configSub').textContent = t.cfsub;
        document.getElementById('backToMenuBtn').textContent = t.bk; buildConfigUI();
    }

    document.getElementById('toConfigBtn').addEventListener('click', () => { mainScreen.classList.add('hidden'); configScreen.classList.remove('hidden'); buildConfigUI(); });
    document.getElementById('backToMenuBtn').addEventListener('click', () => { configScreen.classList.add('hidden'); mainScreen.classList.remove('hidden'); });
    document.getElementById('toOnlineBtn').addEventListener('click', () => { mainScreen.classList.add('hidden'); onlineScreen.classList.remove('hidden'); document.getElementById('onlineStatus').textContent = ''; });
    document.getElementById('backFromOnlineBtn').addEventListener('click', () => { onlineScreen.classList.add('hidden'); mainScreen.classList.remove('hidden'); closeNetwork(); });

    document.querySelectorAll('#playerSelect .option-box').forEach(opt => {
        opt.addEventListener('click', () => {
            document.querySelectorAll('#playerSelect .option-box').forEach(o => o.classList.remove('selected'));
            opt.classList.add('selected'); pCount = parseInt(opt.getAttribute('data-players'));
            document.getElementById('modeDisplay').textContent = `${pCount}P MODE`;
        });
    });

    function buildConfigUI() {
        const container = document.getElementById('playersConfigContainer'); container.innerHTML = ''; const t = i18n[currentLang];
        for (let i = 0; i < pCount; i++) {
            const conf = playerDataConfigs[i]; const block = document.createElement('div'); block.className = 'p-setting-block'; block.style.borderLeft = `4px solid ${conf.color}`;
            block.innerHTML = `<div class="p-title" style="border-left-color:${conf.color}">${i+1}P Setup</div>
                <div class="section-title">Character</div>
                <div class="grid-select char-pick-row" data-pid="${conf.id}">
                    <div class="option-box ${conf.char==='poland'?'selected':''}" data-val="poland">🇵🇱 ${t.pl}</div>
                    <div class="option-box ${conf.char==='japan'?'selected':''}" data-val="japan">🇯🇵 ${t.jp}</div>
                    <div class="option-box ${conf.char==='lang'?'selected':''}" data-val="lang">🌐 ${t.lg}</div>
                </div>
                <div class="section-title">Controls</div>
                <div class="grid-wrap input-pick-row" data-pid="${conf.id}">
                    <div class="option-box ${conf.input==='mouse'?'selected':''}" data-val="mouse">🖱️ Mouse</div>
                    <div class="option-box ${conf.input==='wasd'?'selected':''}" data-val="wasd">⌨️ WASD</div>
                    <div class="option-box ${conf.input==='arrows'?'selected':''}" data-val="arrows">⌨️ Arrow</div>
                    <div class="option-box ${conf.input==='tfgh'?'selected':''}" data-val="tfgh">⌨️ TFGH</div>
                    <div class="option-box ${conf.input==='ijkl'?'selected':''}" data-val="ijkl">⌨️ IJKL</div>
                    <div class="option-box ${conf.input==='vbnm'?'selected':''}" data-val="vbnm">⌨️ VBNM</div>
                    <div class="option-box ${conf.input==='controller'?'selected':''}" data-val="controller">🎮 Pad</div>
                </div>`;
            container.appendChild(block);
        }
        document.querySelectorAll('.char-pick-row').forEach(row => {
            const pid = parseInt(row.getAttribute('data-pid'));
            row.querySelectorAll('.option-box').forEach(box => {
                box.onclick = () => { row.querySelectorAll('.option-box').forEach(b => b.classList.remove('selected')); box.classList.add('selected'); playerDataConfigs[pid-1].char = box.getAttribute('data-val'); };
            });
        });
        document.querySelectorAll('.input-pick-row').forEach(row => {
            const pid = parseInt(row.getAttribute('data-pid'));
            row.querySelectorAll('.option-box').forEach(box => {
                box.onclick = () => { row.querySelectorAll('.option-box').forEach(b => b.classList.remove('selected')); box.classList.add('selected'); playerDataConfigs[pid-1].input = box.getAttribute('data-val'); };
            });
        });
    }

    function closeNetwork() { isOnline = false; isHost = false; if(conn) { conn.close(); conn = null; } if(peer) { peer.destroy(); peer = null; } }

    document.getElementById('btnCreateRoom').addEventListener('click', () => {
        const pin = document.getElementById('roomPin').value; if(pin.length !== 4) return alert("4桁の数字を入力してください！");
        const status = document.getElementById('onlineStatus'); status.textContent = "部屋を開設中..."; closeNetwork();
        peer = new Peer('cballs-surv-' + pin);
        peer.on('open', () => { status.textContent = `部屋 [ ${pin} ] を作成しました！\n相手がこの番号で入るのを待っています...`; isOnline = true; isHost = true; });
        peer.on('connection', (c) => {
            conn = c; status.textContent = "通信相手が接続しました！開始します..."; setupConnection();
            setTimeout(() => { conn.send({ type: 'SYNC_SETUP', pCount: pCount, playerDataConfigs: playerDataConfigs }); conn.send({ type: 'START_GAME' }); onlineScreen.classList.add('hidden'); initGame(); gameActive = true; animate(); }, 1500);
        });
    });

    document.getElementById('btnJoinRoom').addEventListener('click', () => {
        const pin = document.getElementById('roomPin').value; if(pin.length !== 4) return alert("4桁の数字を入力してください！");
        const status = document.getElementById('onlineStatus'); status.textContent = "部屋を探しています..."; closeNetwork();
        peer = new Peer();
        peer.on('open', () => { conn = peer.connect('cballs-surv-' + pin); conn.on('open', () => { status.textContent = "部屋に接続完了！ホストが開始するのを待っています..."; isOnline = true; isHost = false; setupConnection(); }); });
    });

    function setupConnection() {
        conn.on('data', (data) => {
            if(data.type === 'SYNC_SETUP') { pCount = data.pCount; playerDataConfigs = data.playerDataConfigs; document.getElementById('modeDisplay').textContent = `${pCount}P MODE`; }
            else if(data.type === 'START_GAME') { onlineScreen.classList.add('hidden'); mainScreen.classList.add('hidden'); configScreen.classList.add('hidden'); initGame(); gameActive = true; animate(); }
            else if(data.type === 'GAME_STATE') {
                survivalTime = data.survivalTime; document.getElementById('timerDisplay').textContent = `${survivalTime}s`;

            else if(data.type === 'GAME_OVER') { gameActive = false; gameOver(); }

    }

    function initGame() {
        enemies = []; beams = []; keys = {}; targetX = 200; shakeTimer = 0;

        for (let i = 0; i < pCount; i++) {
            const conf = playerDataConfigs[i];
            players.push({ id: conf.id, x: spacing * (i + 1), y: 520, radius: pCount === 1 ? 24 : 20, lives: 3, hitTimer: 0, color: conf.color, charType: conf.char, input: conf.input, active: true });

    function updateStatusUI() {
        const container = document.getElementById('playerStatus'); container.innerHTML = '';
        players.forEach(p => { const row = document.createElement('div'); row.style.color = p.color; row.textContent = `${p.id}P: ` + (p.active ? '❤️'.repeat(p.lives) : '💀 OUT'); container.appendChild(row); });
    }

    function drawPlayer(p) {
        if (!p.active) return;
        ctx.save();
        if (p.hitTimer > 0) { ctx.shadowBlur = 15; ctx.shadowColor = "#ff4757"; if (Math.floor(p.hitTimer / 2) % 2 === 0) ctx.filter = "brightness(1.5) sepia(1) hue-rotate(-50deg)"; }
        ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.clip();
        let drawCode = p.charType === 'lang' ? currentLang : (p.charType === 'poland' ? 'pl' : (p.charType === 'japan' ? 'ja' : p.charType));
        let f = flagData[drawCode] || flagData['pl'];
        if (f.t === 'h') { let h = (p.radius*2) / f.c.length; f.c.forEach((col, i) => { ctx.fillStyle = col; ctx.fillRect(p.x - p.radius, p.y - p.radius + i * h, p.radius * 2, h); }); }
        else if (f.t === 'c') { ctx.fillStyle = f.bg; ctx.fillRect(p.x-p.radius, p.y-p.radius, p.radius*2, p.radius*2); ctx.fillStyle = f.fg; ctx.beginPath(); ctx.arc(p.x, p.y, p.radius*0.45, 0, Math.PI*2); ctx.fill(); }
        ctx.restore();
        ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.lineWidth = 3; ctx.strokeStyle = p.color; ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.ellipse(p.x - 6, p.y - 3, 4, 6, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(p.x + 6, p.y - 3, 4, 6, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }

    function drawReichtangle(x, y, w, h) {
        ctx.save();
        ctx.fillStyle = '#000'; ctx.fillRect(x - w/2, y - h/2, w, h/3); ctx.fillStyle = '#fff'; ctx.fillRect(x - w/2, y - h/2 + h/3, w, h/3); ctx.fillStyle = '#f00'; ctx.fillRect(x - w/2, y - h/2 + (h/3)*2, w, h/3);
        ctx.lineWidth = 3; ctx.strokeStyle = '#000'; ctx.strokeRect(x - w/2, y - h/2, w, h);
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x - 6, y - 8, 2, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(x + 6, y - 8, 2, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    }

    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true); window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
    const handleMouse = (clientX) => { const rect = canvas.getBoundingClientRect(); targetX = (clientX - rect.left) * (canvas.width / rect.width); };

    function animate() {
        if (!gameActive) return;
        ctx.save();
        if (shakeTimer > 0) { ctx.translate((Math.random() - 0.5) * shakeTimer * 2, (Math.random() - 0.5) * shakeTimer * 2); shakeTimer--; }
        ctx.clearRect(-20, -20, canvas.width+40, canvas.height+40);

        if(!isOnline || isHost) survivalTime = ((Date.now() - startTime) / 1000).toFixed(1);
        document.getElementById('timerDisplay').textContent = `${survivalTime}s`;
        const activeGamepads = navigator.getGamepads ? Array.from(navigator.getGamepads()).filter(gp => gp !== null) : []; let padAssignIndex = 0;

        players.forEach(p => {
            if (!p.active) return;
            let canControl = true;
            if (isOnline) { if (isHost && (p.id === 2 || p.id === 4)) canControl = false; if (!isHost && (p.id === 1 || p.id === 3)) canControl = false; }
            
            if (canControl) {
                if (p.input === 'mouse') p.x += (targetX - p.x) * 0.25;
                else if (p.input === 'wasd') { if (keys['a']) p.x -= 5; if (keys['d']) p.x += 5; }
                else if (p.input === 'arrows') { if (keys['arrowleft']) p.x -= 5; if (keys['arrowright']) p.x += 5; }
                else if (p.input === 'tfgh') { if (keys['f']) p.x -= 5; if (keys['h']) p.x += 5; }
                else if (p.input === 'ijkl') { if (keys['j']) p.x -= 5; if (keys['l']) p.x += 5; }
                else if (p.input === 'vbnm') { if (keys['b']) p.x -= 5; if (keys['m']) p.x += 5; }
            }
            if (p.x < p.radius) p.x = p.radius; if (p.x > canvas.width - p.radius) p.x = canvas.width - p.radius;
            if (p.hitTimer > 0) p.hitTimer--; drawPlayer(p);
        });

        if (isOnline && !isHost && conn && conn.open) conn.send({ type: 'PLAYER_MOVE', players: players.filter(p => p.id === 2 || p.id === 4).map(p => ({ id: p.id, x: p.x, y: p.y })) });

        let diff = parseFloat(survivalTime);
        if (!isOnline || isHost) {
            if (diff >= nextBeamTime) { beams.push({ x: Math.random() * (canvas.width - 60) + 30, w: 70, warnTimer: 75, activeTimer: 20 }); nextBeamTime += 10; }
            for (let i = beams.length - 1; i >= 0; i--) {
                let b = beams[i];
                if (b.warnTimer > 0) b.warnTimer--;
                else if (b.activeTimer > 0) {
                    b.activeTimer--;
                    players.forEach(p => { if (p.active && p.hitTimer <= 0 && Math.abs(p.x - b.x) < p.radius + b.w/2 - 5) { p.lives--; p.hitTimer = 30; shakeTimer = 15; updateStatusUI(); if (p.lives <= 0) p.active = false; } });
                } else beams.splice(i, 1);
            }
            spawnTimer++;
            if (spawnTimer > Math.max(6, 35 - diff * 1.2 - pCount * 2)) { spawnTimer = 0; enemies.push({ x: Math.random() * (canvas.width - 40) + 20, y: -30, speed: Math.random() * 3 + 4 + (diff * 0.15), w: 36, h: 48 }); }
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i]; e.y += e.speed;
                players.forEach(p => {
                    if (!p.active) return;
                    if (p.hitTimer <= 0 && Math.abs(p.x - e.x) < p.radius + e.w/2 - 4 && Math.abs(p.y - e.y) < p.radius + e.h/2 - 4) {
                        p.lives--; p.hitTimer = 30; shakeTimer = 10; updateStatusUI(); if (p.lives <= 0) p.active = false;
                    }
                });
                if (e.y > canvas.height + 40) enemies.splice(i, 1);
            }
            if (isOnline && isHost && conn && conn.open) { conn.send({ type: 'GAME_STATE', survivalTime: survivalTime, enemies: enemies, beams: beams, players: players.map(p => ({ id: p.id, x: p.x, y: p.y, lives: p.lives, active: p.active, hitTimer: p.hitTimer })) }); }
        }

        beams.forEach(b => {
            if (b.warnTimer > 0) { ctx.fillStyle = (Math.floor(b.warnTimer / 5) % 2 === 0) ? 'rgba(255, 50, 50, 0.4)' : 'rgba(255, 200, 50, 0.1)'; ctx.fillRect(b.x - b.w/2, 0, b.w, canvas.height); }
            else if (b.activeTimer > 0) { ctx.fillStyle = '#ff0044'; ctx.fillRect(b.x - b.w/2, 0, b.w, canvas.height); ctx.fillStyle = '#ffffff'; ctx.fillRect(b.x - b.w/4, 0, b.w/2, canvas.height); }
        });
        enemies.forEach(e => drawReichtangle(e.x, e.y, e.w, e.h));
        
        if (players.every(p => !p.active)) { if (isOnline && isHost && conn && conn.open) conn.send({ type: 'GAME_OVER' }); gameOver(); ctx.restore(); return; }
        ctx.restore(); requestAnimationFrame(animate);
    }

    function gameOver() {
        gameActive = false; const t = i18n[currentLang]; let finalTime = parseFloat(survivalTime); const recordKey = `cb_best_time_${pCount}p`; let bestTime = parseFloat(localStorage.getItem(recordKey)) || 0.0; let isNewRecord = false;
        if (finalTime > bestTime) { bestTime = finalTime; localStorage.setItem(recordKey, bestTime.toFixed(1)); isNewRecord = true; }
        document.getElementById('screenTitle').textContent = t.ov; let res = `[${pCount}P MODE]<br>${t.tm}: ${finalTime.toFixed(1)}s<br>${t.bs}: ${bestTime.toFixed(1)}s`;
        if (isNewRecord) res = `<div class="new-record">${t.nr}</div>` + res; document.getElementById('screenSub').innerHTML = res; document.getElementById('startBtn').textContent = t.rt; mainScreen.classList.remove('hidden');
    }
    setLanguage('ja', document.querySelector('.lang-btn'));
</script>

                ctx.fillStyle = f.fg; ctx.beginPath(); ctx.arc(0, 0, p.radius*0.45, 0, Math.PI*2); ctx.fill();

                ctx.fillStyle = f.bg; ctx.fillRect(-p.radius, -p.radius, p.radius*2, p.radius*2);

            ctx.fillStyle = '#fff';
            let eyeLook = dx * 0.2;
            if (eyeLook > 4) eyeLook = 4; if (eyeLook < -4) eyeLook = -4;

            // 1Pと複数人プレイでの目のサイズ調整分岐
            if (pCount === 1) {
                ctx.beginPath(); ctx.ellipse(-8 + eyeLook, -4, 5, 7, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.ellipse(8 + eyeLook, -4, 5, 7, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            } else {
                ctx.beginPath(); ctx.ellipse(-6 + eyeLook, -3, 4, 6, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.ellipse(6 + eyeLook, -3, 4, 6, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            }
            ctx.restore();
        };

        // --- 7. 劇的ゲームオーバー演出強化パッチ上書き ---
        gameOver = function() {
            let duration = 85; 
            let currentFrame = 0;
            let particles = [];
            
            // 全死亡プレイヤーの場所から紙吹雪風の爆発パーティクルを生成
            players.forEach(p => {
                for(let i=0; i<35; i++) {
                    particles.push({
                        x: p.x, y: p.y,
                        vx: (Math.random() - 0.5) * 9,
                        vy: (Math.random() - 0.5) * 9 - 2,
                        radius: Math.random() * 5 + 2,
                        color: p.color,
                        alpha: 1
                    });
                }
            });

            function playGameOverAnimation() {
                if (currentFrame < duration) {
                    currentFrame++;
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    
                    // 1. 静止したゲームオブジェクト背景を描画
                    beams.forEach(b => {
                        if (b.warnTimer > 0) { ctx.fillStyle = 'rgba(255, 50, 50, 0.2)'; ctx.fillRect(b.x - b.w/2, 0, b.w, canvas.height); }
                        else if (b.activeTimer > 0) { ctx.fillStyle = '#ff0044'; ctx.fillRect(b.x - b.w/2, 0, b.w, canvas.height); }
                    });
                    enemies.forEach(e => drawReichtangle(e.x, e.y, e.w, e.h));
                    
                    // 2. ディストピア風赤色全画面フェード効果
                    ctx.fillStyle = `rgba(255, 0, 0, ${Math.min(0.4, currentFrame * 0.008)})`;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    // 3. 大爆発パーティクルの物理計算描画
                    particles.forEach(p => {
                        p.x += p.vx; p.y += p.vy;
                        p.vy += 0.22; // 重力
                        p.alpha -= 0.014;
                        if (p.alpha > 0) {
                            ctx.save(); ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color;
                            ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2); ctx.fill(); ctx.restore();
                        }
                    });

                    // 4. GAME OVER ロゴの劇的落下と画面震動
                    ctx.save();
                    ctx.textAlign = "center"; ctx.textBaseline = "middle";
                    let tScale = Math.max(1, 6 - currentFrame * 0.18);
                    let shake = currentFrame < 25 ? (Math.random() - 0.5) * 10 : 0;
                    
                    ctx.translate(canvas.width / 2 + shake, canvas.height / 2 + shake);
                    ctx.scale(tScale, tScale);
                    ctx.font = "bold 44px 'Arial'";
                    ctx.lineWidth = 6; ctx.strokeStyle = "#000"; ctx.strokeText("GAME OVER", 0, 0);
                    ctx.fillStyle = "#ff4757"; ctx.fillText("GAME OVER", 0, 0);
                    ctx.restore();

                    nativeRAF(playGameOverAnimation);
                } else {
                    // 全てのドラマチックな演出が終わったら、元のリザルト画面処理へ遷移
                    originalGameOverAll();
                }
            }
            playGameOverAnimation();
        };

        // --- 8. メインループ割り込み（チート＆ゴールデン・ライヒタングルシステム処理） ---
        window.requestAnimationFrame = function(callback) {
            return nativeRAF(function(time) {
                callback(time);
                
                if (gameActive) {
                    // 8-1. 既存の管理者チートシステムバックグラウンド処理
                    if (isAdmin) {
                        if (adminStopTime) {
                            enemies.forEach(e => { e.y -= e.speed; });
                            beams.forEach(b => {
                                if (b.warnTimer > 0 && b.warnTimer < 75) b.warnTimer++;
                                if (b.activeTimer > 0 && b.activeTimer < 20) b.activeTimer++;
                            });
                            if (spawnTimer > 0) spawnTimer--;
                        }
                        if (adminInvinc) {
                            let myId = (isOnline && !isHost) ? 2 : 1;
                            let me = players.find(p => p.id === myId);
                            if (me && me.active) {
                                let uiNeedsUpdate = false;
                                if (me.lives < 3) { me.lives = 3; uiNeedsUpdate = true; }
                                me.hitTimer = 0;
                                for (let i = enemies.length - 1; i >= 0; i--) {
                                    let e = enemies[i];
                                    if (Math.abs(me.x - e.x) < me.radius + e.w/2 && Math.abs(me.y - e.y) < me.radius + e.h/2) {
                                        enemies.splice(i, 1); shakeTimer = 6; uiNeedsUpdate = true;
                                    }
                                }
                                if (uiNeedsUpdate) updateStatusUI();
                            }
                        }
                    }

                    // 8-2. P2P環境下での他プレイヤーからの召喚イベント受信待機設定
                    if (typeof isOnline !== 'undefined' && isOnline && conn && conn.open && !networkListenerAttached) {
                        conn.on('data', (data) => {
                            if (data && data.type === 'SPAWN_GOLDEN_REICH') {
                                goldenEnemies.push(data.enemy);
                            }
                        });
                        networkListenerAttached = true;
                    }
                    if (typeof isOnline !== 'undefined' && !isOnline) networkListenerAttached = false;

                    // 8-3. +10秒ボーナスなどのテキストポップアップ演出処理
                    for (let i = bonusIndicators.length - 1; i >= 0; i--) {
                        let ind = bonusIndicators[i];
                        ind.y -= ind.vy;
                        ind.alpha -= 0.025;
                        if (ind.alpha <= 0) { bonusIndicators.splice(i, 1); continue; }
                        
                        ctx.save();
                        ctx.globalAlpha = ind.alpha;
                        ctx.fillStyle = ind.color;
                        ctx.font = 'bold 16px Arial';
                        ctx.textAlign = 'center';
                        ctx.shadowBlur = 4; ctx.shadowColor = '#000';
                        ctx.fillText(ind.text, ind.x, ind.y);
                        ctx.restore();
                    }

                    // 8-4. ゴールデン・ライヒタングルの駆動・描画・衝突判定ループ
                    for (let i = goldenEnemies.length - 1; i >= 0; i--) {
                        let g = goldenEnemies[i];
                        
                        // 時が止まっていなければ下降
                        if (!adminStopTime) {
                            g.y += g.speed;
                            g.pulse += 0.12;
                        }

                        // ゴールドスキン＋オーラの美麗描画
                        ctx.save();
                        ctx.translate(g.x, g.y);
                        
                        let glowGlow = 12 + Math.sin(g.pulse) * 10;
                        ctx.shadowBlur = glowGlow;
                        ctx.shadowColor = '#f1c40f';
                        
                        let goldGrad = ctx.createLinearGradient(0, -g.h/2, 0, g.h/2);
                        goldGrad.addColorStop(0, '#ffeaa7');
                        goldGrad.addColorStop(0.3, '#f1c40f');
                        goldGrad.addColorStop(1, '#e67e22');
                        ctx.fillStyle = goldGrad;
                        ctx.fillRect(-g.w/2, -g.h/2, g.w, g.h);
                        
                        ctx.lineWidth = 3; ctx.strokeStyle = '#fff';
                        ctx.strokeRect(-g.w/2, -g.h/2, g.w, g.h);
                        
                        // にっこり顔
                        ctx.fillStyle = '#fff';
                        ctx.beginPath(); ctx.arc(-9, -12, 3.5, 0, Math.PI*2); ctx.fill();
                        ctx.beginPath(); ctx.arc(9, -12, 3.5, 0, Math.PI*2); ctx.fill();
                        ctx.beginPath(); ctx.arc(0, -2, 7, 0, Math.PI, false);
                        ctx.lineWidth = 2.5; ctx.strokeStyle = '#fff'; ctx.stroke();
                        
                        // 中央のプラス記号
                        ctx.fillStyle = '#fff';
                        ctx.font = 'bold 22px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                        ctx.fillText('+', 0, 14);
                        ctx.restore();

                        // プレイヤーとの当たり判定（誰か1人でもキャッチすれば有効）
                        let isCollected = false;
                        if (typeof players !== 'undefined') {
                            players.forEach(p => {
                                if (!p.active) return;
                                if (Math.abs(p.x - g.x) < p.radius + g.w/2 && Math.abs(p.y - g.y) < p.radius + g.h/2) {
                                    isCollected = true;
                                }
                            });
                        }

                        if (isCollected) {
                            // タイマーを10秒巻き戻し（生存可能時間を延長）
                            if (typeof startTime !== 'undefined') {
                                if (typeof isOnline === 'undefined' || !isOnline || isHost) {
                                    startTime -= 10000; 
                                }
                            }
                            
                            if (typeof shakeTimer !== 'undefined') shakeTimer = 10;
                            bonusIndicators.push({ x: g.x, y: g.y - 10, vy: 1.8, alpha: 1.2, text: '+10秒ボーナス!!', color: '#f1c40f' });
                            
                            goldenEnemies.splice(i, 1);
                        } 
                        // 画面外落下消去
                        else if (g.y > canvas.height + 80) {
                            goldenEnemies.splice(i, 1);
                        }
                    }
                }
            });
        };
    })();
</script>

<script>
(function() {
    // 既存関数の安全な退避
    const _origDrawPlayer = typeof drawPlayer === 'function' ? drawPlayer : null;
    const _origSetupConn = typeof setupConnection === 'function' ? setupConnection : null;
    
    // =================================================================
    // 🚫 1. 絶対逃がさない！時間指定の永続BANシステム
    // =================================================================
    function checkAndEnforceBan() {
        const banUntil = localStorage.getItem('cballs_ultimate_ban_time');
        if (banUntil && Number(banUntil) > Date.now()) {
            // ゲームのUIを完全に消し去ってBAN画面だけを表示する
            document.body.innerHTML = '';
            document.body.style.cssText = `
                margin: 0; padding: 0; width: 100vw; height: 100vh;
                background: repeating-linear-gradient(45deg, #1a0000, #1a0000 20px, #2a0000 20px, #2a0000 40px);
                color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center;
                font-family: 'Arial Black', sans-serif; text-align: center; padding: 20px; box-sizing: border-box;
            `;

            let banScreen = document.createElement('div');
            document.body.appendChild(banScreen);

            function updateBanTimer() {
                const left = Number(banUntil) - Date.now();
                if (left <= 0) {
                    localStorage.removeItem('cballs_ultimate_ban_time');
                    location.reload(); // 解除されたら自動リロードして復帰
                    return;
                }
                const m = Math.floor(left / 60000);
                const s = Math.floor((left % 60000) / 1000);
                
                banScreen.innerHTML = `
                    <div style="font-size: 80px; color: #ff3f34; text-shadow: 0 0 30px #ff3f34; margin-bottom: 20px;">🔨 BANNED</div>
                    <div style="font-size: 18px; color: #dcdde1; max-width: 600px; line-height: 1.6;">
                        管理者により、この端末からのゲームアクセスが遮断されました。<br>
                        不正行為、または管理者の指示に従わなかった可能性があります。
                    </div>
                    <div style="margin-top: 40px; background: rgba(0,0,0,0.8); padding: 20px 50px; border: 3px solid #ff3f34; border-radius: 15px; box-shadow: 0 0 20px rgba(255,63,52,0.5);">
                        <div style="font-size: 14px; color: #ff3f34; margin-bottom: 10px;">BAN解除まで残り時間</div>
                        <div style="font-size: 45px; color: #fed330;">${m}分 ${s.toString().padStart(2, '0')}秒</div>
                    </div>
                `;
                setTimeout(updateBanTimer, 1000);
            }
            updateBanTimer();
            return true;
        } else if (banUntil && Number(banUntil) <= Date.now()) {
            localStorage.removeItem('cballs_ultimate_ban_time'); // 期限切れで解除
        }
        return false;
    }

    // 起動時にBANチェックを即座に実行
    if (checkAndEnforceBan()) return;

    // =================================================================
    // 🛡️ 2. 超巨大＆超高機能な管理者パネル（ゲーム画面外で常時表示）
    // =================================================================
    function upgradeAdminPanel() {
        // 既存の古いパネルを非表示にする
        const oldPanels = document.querySelectorAll('#adminPanel, #adminPanelBody');
        oldPanels.forEach(p => p.style.display = 'none');

        let megaPanel = document.getElementById('ultimateMegaAdminPanel');
        if (!megaPanel) {
            megaPanel = document.createElement('div');
            megaPanel.id = 'ultimateMegaAdminPanel';
            // ★超重要: 確実にゲーム画面の外（bodyの直下）に配置して、ゲーム中以外でも常時表示させる
            document.body.appendChild(megaPanel);
        }

        // サイバーパンクな巨大パネルに構築
        megaPanel.style.cssText = `
            display: none; position: fixed; top: 15px; right: 15px;
            background: linear-gradient(135deg, #1a0b2e 0%, #05020a 100%);
            border: 3px solid #00d2d3; border-radius: 12px; padding: 20px;
            z-index: 999999; box-shadow: 0 10px 40px rgba(0, 210, 211, 0.5);
            color: #fff; font-family: 'Arial', sans-serif; width: 350px;
            flex-direction: column; gap: 15px; box-sizing: border-box;
        `;
        
        megaPanel.innerHTML = `
            <div style="font-size:18px; font-weight:900; color:#00d2d3; text-align:center; border-bottom:2px solid #00d2d3; padding-bottom:10px; letter-spacing:1px; text-shadow:0 0 10px #00d2d3;">
                👑 SUPREME ADMIN
            </div>
            
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <button id="superBtnTime" style="padding:12px; font-size:13px; font-weight:bold; background:#222f3e; color:#fff; border:2px solid #576574; border-radius:6px; cursor:pointer;">⏳ 時止め</button>
                <button id="superBtnInvinc" style="padding:12px; font-size:13px; font-weight:bold; background:#222f3e; color:#fff; border:2px solid #576574; border-radius:6px; cursor:pointer;">💥 無敵粉砕</button>
            </div>

            <div style="background:rgba(0,0,0,0.6); padding:15px; border-radius:8px; border:1px solid #48dbfb;">
                <div style="font-size:12px; color:#48dbfb; font-weight:bold; margin-bottom:8px;">📢 全画面アナウンス (ゲーム外の全員へ)</div>
                <input type="text" id="megaAdminMsg" placeholder="メッセージを入力..." style="width:100%; box-sizing:border-box; padding:10px; font-size:14px; background:#111; color:#fff; border:1px solid #444; border-radius:4px; margin-bottom:10px; outline:none;">
                <button id="megaSendMsgBtn" style="width:100%; padding:12px; font-weight:bold; font-size:14px; background:#0abde3; color:#000; border:none; border-radius:4px; cursor:pointer; box-shadow: 0 4px 10px rgba(10, 189, 227, 0.4);">送信する</button>
            </div>

            <div style="background:rgba(0,0,0,0.6); padding:15px; border-radius:8px; border:1px solid #ff6b6b;">
                <div style="font-size:12px; color:#ff6b6b; font-weight:bold; margin-bottom:8px;">🔨 ターゲットBAN執行</div>
                <select id="banTargetList" style="width:100%; padding:10px; font-size:13px; background:#111; color:#fff; border:1px solid #444; border-radius:4px; margin-bottom:10px; outline:none;">
                    <option value="">-- BAN対象をスキャン中... --</option>
                </select>
                <div style="display:flex; gap:10px; align-items:center;">
                    <span style="font-size:13px;">期間(分):</span>
                    <input type="number" id="banMinutes" value="15" min="1" style="width:70px; padding:10px; text-align:center; background:#111; color:#fff; border:1px solid #444; border-radius:4px;">
                    <button id="megaBanBtn" style="flex:1; padding:12px; font-weight:bold; font-size:14px; background:#ee5253; color:#fff; border:none; border-radius:4px; cursor:pointer; box-shadow: 0 4px 10px rgba(238, 82, 83, 0.4);">BAN執行</button>
                </div>
            </div>
        `;

        // 既存チート機能とのリンク（非表示の元ボタンを代理クリック）
        document.getElementById('superBtnTime').onclick = function() {
            if(document.getElementById('toggleTimeBtn')) document.getElementById('toggleTimeBtn').click();
            let isActive = typeof adminStopTime !== 'undefined' && adminStopTime;
            this.style.background = isActive ? '#feca57' : '#222f3e';
            this.style.color = isActive ? '#000' : '#fff';
            this.style.borderColor = isActive ? '#ff9f43' : '#576574';
        };
        
        document.getElementById('superBtnInvinc').onclick = function() {
            if(document.getElementById('toggleInvincBtn')) document.getElementById('toggleInvincBtn').click();
            let isActive = typeof adminInvinc !== 'undefined' && adminInvinc;
            this.style.background = isActive ? '#ff6b6b' : '#222f3e';
            this.style.color = isActive ? '#000' : '#fff';
            this.style.borderColor = isActive ? '#ee5253' : '#576574';
        };

        // メッセージ送信イベント
        document.getElementById('megaSendMsgBtn').onclick = () => {
            const text = document.getElementById('megaAdminMsg').value;
            if(!text) return;
            fireUltimateBroadcast(text);
            document.getElementById('megaAdminMsg').value = '';
        };

        // BAN執行イベント
        document.getElementById('megaBanBtn').onclick = () => {
            const target = document.getElementById('banTargetList').value;
            const mins = parseInt(document.getElementById('banMinutes').value) || 15;
            if(!target) return alert("BANするプレイヤーを選択してください！");
            
            if(confirm(`⚠️ 本当に選択したプレイヤーを ${mins}分間 BANしますか？`)) {
                executeBanOnTarget(target, mins);
            }
        };

        // プレイヤーリストの自動更新（毎秒）
        setInterval(updateBanTargetList, 1000);
    }

    // BAN用プレイヤーリストの動的生成
    function updateBanTargetList() {
        const sel = document.getElementById('banTargetList');
        if(!sel) return;
        const currentSelection = sel.value;
        sel.innerHTML = '<option value="">-- BANするプレイヤーを選択 --</option>';
        
        // ローカルプレイヤー
        if(typeof players !== 'undefined') {
            players.forEach(p => {
                sel.innerHTML += `<option value="local_${p.id}">ローカル ${p.id}P (生存: ${p.active})</option>`;
            });
        }
        // オンライン接続中の相手
        if(typeof isOnline !== 'undefined' && isOnline && typeof conn !== 'undefined' && conn && conn.open) {
            sel.innerHTML += `<option value="remote_peer">🌐 オンライン相手 (ID: ${conn.peer})</option>`;
        }
        sel.value = currentSelection;
    }

    // BAN執行の実処理
    function executeBanOnTarget(target, mins) {
        const unbanTime = Date.now() + (mins * 60 * 1000);
        if (target === 'remote_peer') {
            if (typeof conn !== 'undefined' && conn && conn.open) {
                // 通信相手に完璧にBAN命令を送信
                conn.send({ type: 'MEGA_ADMIN_BAN', unbanTime: unbanTime });
                alert("🌐 相手にBANパケットを送信し、強制切断させました。");
            }
        } else if (target.startsWith('local_')) {
            // 自分自身（ローカル）をBAN
            localStorage.setItem('cballs_ultimate_ban_time', unbanTime);
            alert(`🚨 端末を ${mins}分間 BANしました。`);
            location.reload();
        }
    }

    // 全体メッセージのアニメーション演出
    function fireUltimateBroadcast(msg) {
        let box = document.getElementById('ultimateBcastOverlay');
        if(box) box.remove(); // 古いものを消す
        
        box = document.createElement('div');
        box.id = 'ultimateBcastOverlay';
        box.style.cssText = `
            position: fixed; top: 0; left: 50%;
            background: linear-gradient(90deg, rgba(235, 59, 90, 0.95), rgba(252, 92, 101, 0.95));
            border: 4px solid #fed330; border-radius: 12px;
            color: #fff; padding: 25px 50px; font-weight: 900; font-size: 24px;
            text-align: center; text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 0 15px 40px rgba(235, 59, 90, 0.6); z-index: 9999999;
            pointer-events: none; text-shadow: 2px 2px 0px #000;
            animation: ultiAlertSlide 7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        `;
        box.innerHTML = `
            <div style="font-size:16px; color:#fed330; margin-bottom:8px; text-shadow:none;">⚠️ SYSTEM BROADCAST</div>
            <div>${msg}</div>
        `;
        document.body.appendChild(box);
        
        // P2Pオンライン相手にも送信して完璧に同期
        if (typeof isOnline !== 'undefined' && isOnline && typeof conn !== 'undefined' && conn && conn.open) {
            conn.send({ type: 'MEGA_ADMIN_MSG', text: msg });
        }
    }


    // =================================================================
    // 🌐 3. P2Pオンラインのネットワーク同期フック（BAN＆メッセージ）
    // =================================================================
    if (_origSetupConn) {
        setupConnection = function() {
            _origSetupConn(); // 元の通信設定を完了させる
            
            // 接続確立後、新しいリスナーを追加して古いデータを上書きせず補完する
            setTimeout(() => {
                if (typeof conn !== 'undefined' && conn) {
                    conn.on('data', (data) => {
                        if (!data) return;
                        
                        // 相手からの全体メッセージを受信
                        if (data.type === 'MEGA_ADMIN_MSG' || data.type === 'ADMIN_BCAST') {
                            fireUltimateBroadcast(data.text || data.msg);
                        }
                        // 相手からの時間指定BANを受信
                        if (data.type === 'MEGA_ADMIN_BAN' || data.type === 'ADMIN_BAN') {
                            let banEnd = data.unbanTime || (Date.now() + (15*60000));
                            localStorage.setItem('cballs_ultimate_ban_time', banEnd);
                            enforceBanScreen(banEnd); // 即座にBAN画面へ移行
                        }
                    });
                }
            }, 600);
        };
    }


    // =================================================================
    // 🎨 4. 極限アニメーション ＆ 完璧な「国境線（太い黒枠）」の描画
    // =================================================================
    let dustParticles = [];
    
    // Emoji取得ヘルパー
    function getEmoji(code) { return code.toUpperCase().replace(/./g, char => String.fromCodePoint(char.charCodeAt(0) + 127397)); }

    if (_origDrawPlayer) {
        const extAnims = {};
        
        drawPlayer = function(p) {
            if (!p.active) return;
            
            // アニメーションステータスの初期化
            if (!extAnims[p.id]) {
                extAnims[p.id] = { prevX: p.x, prevY: p.y, angle: 0, bounce: 0, targetAngle: 0, breath: Math.random() * Math.PI };
            }
            let anim = extAnims[p.id];
            let dx = p.x - anim.prevX;
            anim.prevX = p.x; anim.prevY = p.y;
            
            // 呼吸（常に生きているようにゆっくり伸縮）
            anim.breath += 0.08;
            let breathY = 1 + Math.sin(anim.breath) * 0.02;
            let breathX = 1 - Math.sin(anim.breath) * 0.01;

            // 移動時の傾きと跳ね（スカッシュ＆ストレッチ）
            if (Math.abs(dx) > 0.1) {
                anim.targetAngle = dx * 0.05; 
                anim.bounce = Math.abs(Math.sin(Date.now() * 0.018)) * 10; 
                
                // 走る土煙パーティクル生成
                if (Math.random() < 0.4) {
                    dustParticles.push({
                        x: p.x - (dx > 0 ? p.radius*0.6 : -p.radius*0.6), y: p.y + p.radius,
                        vx: -dx * 0.2 + (Math.random()-0.5), vy: (Math.random()-0.5) - 0.5,
                        size: Math.random() * 4 + 2, life: 1, color: p.color
                    });
                }
            } else {
                anim.targetAngle = 0;
                anim.bounce += (0 - anim.bounce) * 0.3; // ピタッと着地
            }
            anim.angle += (anim.targetAngle - anim.angle) * 0.25;

            // 激しいダメージ震動
            let shakeX = 0, shakeY = 0;
            if (p.hitTimer > 0) {
                shakeX = (Math.random() - 0.5) * 6;
                shakeY = (Math.random() - 0.5) * 6;
            }

            // 土煙の描画
            for (let i = dustParticles.length - 1; i >= 0; i--) {
                let dp = dustParticles[i];
                dp.x += dp.vx; dp.y += dp.vy; dp.life -= 0.04;
                if (dp.life <= 0) { dustParticles.splice(i, 1); } else {
                    ctx.save(); ctx.globalAlpha = dp.life * 0.5; ctx.fillStyle = dp.color;
                    ctx.beginPath(); ctx.arc(dp.x, dp.y, dp.size, 0, Math.PI*2); ctx.fill(); ctx.restore();
                }
            }

            ctx.save();
            
            // リアルな接地影（ジャンプすると縮む）
            let shadowScale = Math.max(0.2, 1 - (anim.bounce / 15));
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.beginPath();
            ctx.ellipse(p.x, p.y + p.radius - 2, p.radius * 0.8 * shadowScale, p.radius * 0.25 * shadowScale, 0, 0, Math.PI * 2);
            ctx.fill();

            // 中心座標・回転・伸縮・震動の適用
            ctx.translate(p.x + shakeX, p.y - anim.bounce + shakeY);
            ctx.rotate(anim.angle);
            
            let stretchY = 1 + (anim.bounce * 0.02); 
            let stretchX = 1 / stretchY;             
            ctx.scale(stretchX * breathX, stretchY * breathY);

            if (p.hitTimer > 0) {
                ctx.shadowBlur = 20; ctx.shadowColor = "#ff4757";
                if (Math.floor(p.hitTimer / 2) % 2 === 0) ctx.filter = "brightness(2) hue-rotate(-50deg)";
            }

            // 【超重要】クリップによるスキンの描画
            ctx.save();
            ctx.beginPath(); ctx.arc(0, 0, p.radius, 0, Math.PI * 2); ctx.clip();
            
            // 絵文字スキンか既存フラグかの判定
            let isEmoji = (p.charType && p.charType.length === 2 && typeof flagData !== 'undefined' && !flagData[p.charType] && p.charType !== 'pl' && p.charType !== 'ja');
            
            if (isEmoji) {
                // Emojiスキンの描画
                ctx.fillStyle = '#f5f6fa'; ctx.fillRect(-p.radius, -p.radius, p.radius*2, p.radius*2);
                ctx.font = (p.radius * 1.5) + "px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle="#000";
                ctx.fillText(getEmoji(p.charType), 0, 2);
            } else if (typeof flagData !== 'undefined') {
                // 既存の美麗国旗テクスチャ描画
                let drawCode = p.charType === 'lang' ? (typeof currentLang !== 'undefined' ? currentLang : 'ja') : (p.charType === 'poland' ? 'pl' : (p.charType === 'japan' ? 'ja' : p.charType));
                let f = flagData[drawCode] || flagData['pl'];
                if (f && f.t === 'h') {
                    let h = (p.radius*2) / f.c.length;
                    f.c.forEach((col, i) => { ctx.fillStyle = col; ctx.fillRect(-p.radius, -p.radius + i * h, p.radius * 2, h); });
                } else if (f && f.t === 'v') {
                    let w = (p.radius*2) / f.c.length;
                    f.c.forEach((col, i) => { ctx.fillStyle = col; ctx.fillRect(-p.radius + i * w, -p.radius, w, p.radius * 2); });
                } else if (f && f.t === 'c') {
                    ctx.fillStyle = f.bg; ctx.fillRect(-p.radius, -p.radius, p.radius*2, p.radius*2);
                    ctx.fillStyle = f.fg; ctx.beginPath(); ctx.arc(0, 0, p.radius*0.45, 0, Math.PI*2); ctx.fill();
                } else if (f && f.t === 'cross') {
                    ctx.fillStyle = f.bg; ctx.fillRect(-p.radius, -p.radius, p.radius*2, p.radius*2);
                    ctx.fillStyle = f.c1; ctx.fillRect(-p.radius, -p.radius/4, p.radius*2, p.radius/2);
                    ctx.fillStyle = f.c1; ctx.fillRect(-p.radius/4, -p.radius, p.radius/2, p.radius*2);
                }
            }
            ctx.restore(); // クリップ解除

            // 【完全な国境線】クリップ解除後に、カントリーボール特有の「太い黒枠」を最前面に描画！
            ctx.beginPath(); 
            ctx.arc(0, 0, p.radius, 0, Math.PI * 2); 
            ctx.lineWidth = 4; // 太い国境線
            ctx.strokeStyle = '#000000'; // 完全な黒
            ctx.stroke();
            
            // チームカラーの内側ハイライト
            ctx.beginPath(); 
            ctx.arc(0, 0, p.radius - 2, 0, Math.PI * 2); 
            ctx.lineWidth = 2; 
            ctx.strokeStyle = p.color; 
            ctx.stroke();
            
            // 目の描画（進行方向を向く）
            ctx.fillStyle = '#fff';
            let eyeLook = dx * 0.25;
            if (eyeLook > 4) eyeLook = 4; if (eyeLook < -4) eyeLook = -4;

            // 大きく可愛い目（白目＋黒いフチ）
            ctx.beginPath(); ctx.ellipse(-6 + eyeLook, -3, 5, 8, 0, 0, Math.PI * 2); ctx.fill(); 
            ctx.lineWidth=2; ctx.strokeStyle="#000"; ctx.stroke(); 
            
            ctx.beginPath(); ctx.ellipse(6 + eyeLook, -3, 5, 8, 0, 0, Math.PI * 2); ctx.fill();
            ctx.lineWidth=2; ctx.strokeStyle="#000"; ctx.stroke(); 
            
            ctx.restore();
        };
    }

    // =================================================================
    // ⚙️ 5. 初期化とUIアップグレードの実行センチネル
    // =================================================================
    setInterval(() => {
        // パスワード入力の監視
        const codeInput = document.getElementById('adminCodeInput');
        const authBtn = document.getElementById('btnSubmitAdmin');
        
        if(codeInput && authBtn && !authBtn.dataset.megaHooked) {
            authBtn.addEventListener('click', () => {
                if(codeInput.value === '140923') {
                    if(typeof isAdmin !== 'undefined') isAdmin = true;
                    let megaPanel = document.getElementById('ultimateMegaAdminPanel');
                    if (megaPanel) megaPanel.style.display = 'flex';
                }
            });
            authBtn.dataset.megaHooked = "true";
        }

        // 管理者パネルの生成と監視
        let megaPanel = document.getElementById('ultimateMegaAdminPanel');
        if (!megaPanel) {
            upgradeAdminPanel();
            megaPanel = document.getElementById('ultimateMegaAdminPanel');
        }
        
        // 管理者ログイン状態なら常に表示（画面外/body直下）
        if (typeof isAdmin !== 'undefined' && isAdmin && megaPanel) {
            megaPanel.style.display = 'flex';
        }
    }, 500);

    console.log("🚀 完全版アルティメット進化パッチ（BAN機能完全復元・画面外管理者パネル・データ損失ゼロ）起動完了！");

})();
</script>
