/* --------- 性能カスタマイズ画面 --------- */
function renderCustomizer(){
 const host=customOverlay.querySelector('.cyber-v2-content');
 const rows=Object.values(TOWER_TYPES).map(t=>{
  const s=customStats[t.id]||defaultStats[t.id]||{dmg:t.dmg,range:t.range,rateSeconds:t.rate/60};
  return `<tr data-type="${t.id}"><td><span style="color:${t.color};margin-right:7px"><i class="fa-solid ${t.icon}"></i></span>${t.name}</td><td><input class="cx-dmg" type="number" min="1" max="1000000" step="1" value="${s.dmg}" aria-label="${t.name} 攻撃力"></td><td><input class="cx-range" type="number" min="0.2" max="30" step="0.1" value="${s.range}" aria-label="${t.name} 射程"></td><td><input class="cx-rate" type="number" min="0.03" max="30" step="0.01" value="${s.rateSeconds}" aria-label="${t.name} 連射間隔（秒）"></td></tr>`;
 }).join('');
 host.innerHTML=`<div style="overflow:auto;max-height:60vh"><table id="cyber-custom-table"><thead><tr><th>マシーン</th><th>攻撃力</th><th>射程（マス）</th><th>連射間隔（秒）</th></tr></thead><tbody>${rows}</tbody></table></div><div class="cyber-v2-footnote">数値を大きくすると強くなります。連射間隔は短いほど速く攻撃します。変更は「設定を保存して適用」を押すまで反映されません。</div><div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap"><button id="cyber-custom-apply" class="cyber-v2-btn gold"><i class="fa-solid fa-check"></i> 設定を保存して適用</button><button id="cyber-custom-reset" class="cyber-v2-btn"><i class="fa-solid fa-rotate-left"></i> 標準値に戻す</button></div>`;
 $('cyber-custom-apply').onclick=saveCustomizer;
 $('cyber-custom-reset').onclick=()=>{customStats=JSON.parse(JSON.stringify(defaultStats));renderCustomizer();toast('全マシーンの設定値を標準値へ戻しました');};
}
function saveCustomizer(){
 const updated={};
 for(const tr of $('cyber-custom-table').querySelectorAll('tbody tr')){
  const id=tr.dataset.type;const dmg=Number(tr.querySelector('.cx-dmg').value),range=Number(tr.querySelector('.cx-range').value),rateSeconds=Number(tr.querySelector('.cx-rate').value);
  if(!Number.isFinite(dmg)||!Number.isFinite(range)||!Number.isFinite(rateSeconds)||dmg<1||dmg>1000000||range<.2||range>30||rateSeconds<.03||rateSeconds>30){toast(`${machineName(id)}の数値が範囲外です`, 'warn');return;}
  updated[id]={dmg,range,rateSeconds};
 }
 customStats=updated;applyCurrentStats();renderFooter();window.saveGame();customOverlay.hidden=true;toast('マシーン性能を保存して適用しました','info');
}

/* --------- インベントリ。設置時のレベルを保持して出し入れします。 --------- */
function openInventory(){renderInventory();inventoryOverlay.hidden=false;}
function renderInventory(){
 const host=inventoryOverlay.querySelector('.cyber-v2-content');
 let html='<div class="cyber-v2-section"><i class="fa-solid fa-box-open"></i>保管中のマシーン</div><div id="cyber-inventory-grid">';
 if(!inventory.length)html+='<div class="cyber-v2-empty" style="grid-column:1/-1">保管中のマシーンはありません。設置済みマシーンを削除すると、ここに収納されます。</div>';
 inventory.forEach(m=>{const t=TOWER_TYPES[m.type];html+=`<div class="cyber-v2-machine"><div class="machine-icon" style="color:${t.color}"><i class="fa-solid ${t.icon}"></i></div><div class="machine-info"><b>${t.name}</b><small>Lv.${m.level}　攻撃力 ${fmt(m.dmg)}　射程 ${Number(m.range).toFixed(1)}</small></div><button class="cyber-v2-btn" data-deploy="${m.id}">選択</button></div>`;});
 html+='</div><div class="cyber-v2-section"><i class="fa-solid fa-tower-broadcast"></i>設置済みマシーン</div><div id="cyber-placed-grid">';
 if(!builtTowers.length)html+='<div class="cyber-v2-empty">まだマシーンを設置していません。</div>';
 builtTowers.forEach(m=>{const t=TOWER_TYPES[m.type];if(!t)return;html+=`<div class="cyber-v2-machine"><div class="machine-icon" style="color:${t.color}"><i class="fa-solid ${t.icon}"></i></div><div class="machine-info"><b>${t.name}</b><small>Lv.${m.level}　配置：${m.x+1}列 / ${m.y+1}行<br>攻撃力 ${fmt(m.dmg)}　射程 ${Number(m.range).toFixed(1)}</small></div><button class="cyber-v2-btn pink" data-store="${m.id}">削除して収納</button></div>`;});
 html+='</div><div class="cyber-v2-footnote">削除・収納ではマシーンのレベルと種類を保持します。再設置も無料です。収納したマシーンを設置するには、選択ボタンを押してからグリッドの空きマスをクリックしてください。</div>';
 host.innerHTML=html;
 host.querySelectorAll('[data-deploy]').forEach(b=>b.onclick=()=>{const m=inventory.find(v=>v.id===b.dataset.deploy);if(!m)return;selectedTowerType=m.type;selectedFromInventory=m.type;renderFooter();inventoryOverlay.hidden=true;toast(`${machineName(m.type)} を選択しました。空きマスをクリックして無料設置！`,'info');});
 host.querySelectorAll('[data-store]').forEach(b=>b.onclick=()=>storeMachine(b.dataset.store));
}
function storeMachine(id){
 const index=builtTowers.findIndex(m=>m.id===id);if(index<0)return;
 const tower=builtTowers.splice(index,1)[0];
 const cell=gridEl.querySelectorAll('.grid-cell')[tower.y*GRID_W+tower.x];
 if(cell){cell.innerHTML='';cell._tower=null;}
 tower.x=null;tower.y=null;tower.cooldown=0;inventory.push(tower);
 window.updateUI();renderFooter();renderInventory();window.saveGame();
 toast(`${machineName(tower.type)} をインベントリに収納しました`,'info');
}
const previousHandleCellClick=window.handleCellClick;
window.handleCellClick=function(x,y,cell){
 const existing=builtTowers.find(t=>t.x===x&&t.y===y);
 if(existing)return previousHandleCellClick(x,y,cell); // 既存の強化処理は維持
 if(builtTowers.some(t=>t.type===selectedTowerType)){toast(`${machineName(selectedTowerType)} はすでに設置されています。削除して収納すると再設置できます。`,'warn');return;}
 const idx=inventory.findIndex(m=>m.type===selectedTowerType);
 if(idx<0){toast(`${machineName(selectedTowerType)} はインベントリにありません。インベントリを開いて確認してください。`,'warn');return;}
 const tower=inventory.splice(idx,1)[0];tower.x=x;tower.y=y;tower.cooldown=0;syncMachineStats(tower);builtTowers.push(tower);
 window.renderTowerDOM(cell,tower);window.updateUI();renderFooter();window.saveGame();
 try{spawnParticle(x,y,'build');}catch(e){}
 toast(`${machineName(tower.type)} を無料設置しました！`,'info');
};
gridEl.addEventListener('contextmenu',e=>{const cell=e.target.closest('.grid-cell');if(!cell||!cell._tower)return;e.preventDefault();storeMachine(cell._tower.id);});
window.renderFooter=function(){
 const footer=$('tower-footer');if(!footer)return;footer.innerHTML='';
 const visible=Object.values(TOWER_TYPES).filter(t=>{
  if(standardIds.has(t.id))return true;
  if(t.id==='bossGatling')return !!bossGatlingUnlocked||machineExists(t.id);
  const spec=bossSpecsForInventory().find(s=>s.machine===t.id);return !!spec&&(!!bossRewardsClaimed[spec.id]||machineExists(t.id));
 });
 visible.forEach(t=>{
  const stored=inventory.some(m=>m.type===t.id),placed=hasPlaced(t.id),selected=selectedTowerType===t.id;
  const card=document.createElement('div');card.className=`tower-card min-w-[95px] h-20 flex flex-col items-center justify-center gap-1 ${selected?'selected':''} ${!stored?'ext-unavailable':''}`;
  card.style.borderColor=selected?t.color:'rgba(100,116,139,.3)';if(selected)card.style.boxShadow=`0 0 16px ${t.color}55`;
  const status=stored?'無料設置':placed?'設置済み':'所持なし';
  card.innerHTML=`<i class="fa-solid ${t.icon} text-2xl" style="color:${t.color}"></i><div class="text-[10px] font-bold text-white tracking-wider">${t.name}</div><div class="text-[10px]" style="color:${stored?'#ffde00':placed?'#66e6ff':'#94a3b8'}">${status}</div>`;
  card.title=stored?'クリックして設置マシーンを選択':placed?'設置済みです。インベントリから削除できます':'インベントリにありません';
  card.onclick=()=>{if(!stored){toast(placed?`${t.name} はすでに設置済みです`:`${t.name} は所持していません`,'warn');return;}selectedTowerType=t.id;selectedFromInventory=t.id;renderFooter();};
  footer.appendChild(card);
 });
};

/* --------- 敵をマシーン構成・レベルに連動して大幅強化 --------- */
function threatProfile(){
 let levels=0,damage=0,threat=0;
 for(const m of builtTowers){const t=TOWER_TYPES[m.type];if(!t)continue;const lv=Math.max(1,Number(m.level)||1),d=Math.max(1,Number(m.dmg)||t.dmg);levels+=lv;damage+=d;threat+=lv*(1.0+Math.sqrt(d)/16+Math.max(0,t.range||1)*.035);}
 return {levels,damage,threat};
}
const previousSpawnEnemy=window.spawnEnemy;
window.spawnEnemy=function(){
 const p=threatProfile();
 const count=clamp(1+Math.floor(p.threat/7.5),1,10);
 const hpMultiplier=2.35+p.threat*.19+p.damage*.0035+p.levels*.075;
 const speedMultiplier=1+Math.min(.85,p.levels*.014+p.threat*.008);
 for(let i=0;i<count;i++){
  const before=enemies.length;previousSpawnEnemy();
  for(let j=before;j<enemies.length;j++){
   const e=enemies[j];e.hp*=hpMultiplier;e.maxHp=e.hp;e.speed*=speedMultiplier;e.level=Math.max(1,Math.floor(p.levels*.25+p.threat/2)+1);e.elite=(count>=4&&i%3===0)||e.level>=5;
   if(i>0)e.progress=Math.min(i*.035,.28);
  }
 }
};
const previousDrawGame=window.drawGame;
window.drawGame=function(){
 previousDrawGame();
 ctx.save();
 for(const e of enemies){
  const idx=Math.floor(e.progress);if(idx<0||idx>=pathCoords.length)continue;
  const a=pathCoords[idx],b=pathCoords[Math.min(idx+1,pathCoords.length-1)],f=e.progress-idx;
  const gx=a.x+(b.x-a.x)*f,gy=a.y+(b.y-a.y)*f,pos=getPixelPos(gx,gy);const r=e.elite?9:7;
  ctx.globalAlpha=.7;ctx.strokeStyle=e.elite?'#ffde00':e.level>=3?'#b026ff':'#ff5a84';ctx.lineWidth=e.elite?2:1.2;
  ctx.beginPath();ctx.arc(pos.x,pos.y,r+3+Math.sin(performance.now()/140+e.progress)*1.5,0,Math.PI*2);ctx.stroke();
  if(e.elite){ctx.globalAlpha=1;ctx.fillStyle='#fff0a8';ctx.font='900 8px Orbitron, sans-serif';ctx.textAlign='center';ctx.fillText('ELITE',pos.x,pos.y-14);}
  if(e.level>=4){ctx.globalAlpha=.95;ctx.fillStyle='#e9d5ff';ctx.font='900 8px Orbitron, sans-serif';ctx.textAlign='center';ctx.fillText('Lv'+e.level,pos.x,pos.y+18);}
 }
 ctx.restore();
};

/* --------- 1分ごとのボス検知カウントダウン --------- */
const timerEl=$('boss-timer');let lastShownSec=-1;
window.checkBossEvent=function(){
 const now=Date.now(),remain=Math.max(0,nextBossAt-now),sec=Math.ceil(remain/1000),mm=String(Math.floor(sec/60)).padStart(2,'0'),ss=String(sec%60).padStart(2,'0');
 if(timerEl&&sec!==lastShownSec){lastShownSec=sec;timerEl.innerHTML=`<i class="fa-solid fa-skull"></i> 次のボスまで <span class="bb-cd">${mm}:${ss}</span>`;timerEl.classList.toggle('bb-urgent',sec<=10);}
 const game=$('view-game'),battle=$('view-boss-battle'),select=$('view-boss-select');
 const canLaunch=game&&!game.classList.contains('hidden')&&battle?.classList.contains('hidden')&&select?.classList.contains('hidden')&&bossPicker.hidden&&inventoryOverlay.hidden&&dlcOverlay.hidden&&customOverlay.hidden;
 if(now>=nextBossAt&&canLaunch){nextBossAt=now+60000;lastShownSec=-1;window.showBossSelection();}
};

/* --------- 4種（DLC中は6種）のボス選択。強い順に表示 --------- */
function availableBosses(){return bossSpecs.filter(b=>!b.dlc||dlcs.bossExpansion).sort((a,b)=>b.rank-a.rank);}
function renderBossPicker(){
 const host=bossPicker.querySelector('.cyber-v2-content');
 host.innerHTML=`<div id="cyber-boss-list">${availableBosses().map(b=>`<button class="cyber-boss-card" style="--boss-color:${b.color}" data-boss="${b.id}"><span class="rank">${b.rank}</span><div class="boss-art"><i class="fa-solid ${b.icon}"></i></div><h3>${b.name}</h3><div class="strength">THREAT RANK ${String(b.rank).padStart(2,'0')}</div><p>${b.desc}</p><div class="hp"><i class="fa-solid fa-heart-crack" style="color:${b.color}"></i> 基本HP ${fmt(b.baseHp)}　/　攻撃係数 ×${b.attack.toFixed(2)}</div></button>`).join('')}</div><div class="cyber-v2-footnote">表示は強い順です。ボスの実際のHPは参加マシーンの火力に合わせて調整されます。BOSS追加パックを有効にすると最上位2体が追加され、いつでも挑戦できます。</div>`;
 host.querySelectorAll('[data-boss]').forEach(b=>b.onclick=()=>chooseBoss(b.dataset.boss));
}
function chooseBoss(id){
 pickedBoss=bossSpecs.find(b=>b.id===id)||bossSpecs[1];bossPicker.hidden=true;
 if(typeof originalShowBossSelection==='function')originalShowBossSelection();
 const modal=$('view-boss-select');const panel=modal.querySelector('.cyber-modal');
 let summary=$('cyber-selected-boss');if(!summary){summary=document.createElement('div');summary.id='cyber-selected-boss';const p=panel.querySelector('p');panel.insertBefore(summary,p||panel.firstChild);}
 summary.innerHTML=`<b style="color:${pickedBoss.color}"><i class="fa-solid ${pickedBoss.icon}"></i> ${pickedBoss.name}</b>　<span style="color:#94a3b8">脅威ランク ${pickedBoss.rank} / 基本HP ${fmt(pickedBoss.baseHp)}</span><br>${pickedBoss.desc}`;
 const p=panel.querySelector('p');if(p)p.textContent=`${pickedBoss.name} に挑むマシーンを選択してください。設置済みから最大3台を選べます。`;
 const h=panel.querySelector('h2');if(h)h.textContent='BOSS迎撃準備';
 const cancel=$('btn-cancel-boss');if(cancel)cancel.onclick=()=>{modal.classList.add('hidden');toast('ボス戦を見送りました。次のボスは1分後です');};
}
const originalShowBossSelection=window.showBossSelection;
window.showBossSelection=function(){
 if(isSpawning){try{window.toggleSpawning();}catch(e){}}
 renderBossPicker();bossPicker.hidden=false;
};

/* --------- ボスごとにHP・攻撃傾向・色を変更。戦闘アニメーションは既存の高品質演出を使用 --------- */
const originalStartBossBattle=window.startBossBattle;
window.startBossBattle=function(){
 if(!pickedBoss)pickedBoss=bossSpecs[1];
 const spec=pickedBoss;
 const partyDps=(selectedBossWeapons||[]).reduce((s,u)=>s+Math.max(1,Number(u.dmg)||1)*60/Math.max(1,Number(u.rate)||30),0);
 (selectedBossWeapons||[]).forEach(u=>{
  u.rate=TOWER_TYPES[u.type]?.rate||u.rate;u.period=u.rate/60;
  u.dmg=Math.max(1,Math.round(u.dmg*spec.machineDmg));
  u.maxHp=Math.max(90,Math.round(u.maxHp/spec.attack));u.hp=u.maxHp;
 });
 activeBattleBoss=spec;pendingBossReward=true;
 originalStartBossBattle();
 const hpScale=clamp(partyDps/120,.72,2.25);bossData.maxHp=Math.round(spec.baseHp*hpScale);bossData.hp=bossData.maxHp;
 updateBossHPUI();
 const fill=$('boss-hp-fill');if(fill)fill.style.background=`linear-gradient(90deg,${spec.color},#ffffff)`;
 const h=$('view-boss-battle').querySelector('h3');if(h){h.textContent=spec.name;h.style.color=spec.color;h.style.textShadow=`0 0 16px ${spec.color}`;}
 const entity=$('boss-entity');if(entity)entity.style.filter=`hue-rotate(${spec.hue}deg) saturate(1.45)`;
 ['bb-fx','bb-bg'].forEach(id=>{const c=$(id);if(c)c.style.filter=`hue-rotate(${spec.hue}deg) saturate(1.2)`;});
 const view=$('view-boss-battle');if(view)view.style.setProperty('--active-boss-color',spec.color);
 const gh=$('bb-hp-ghost');if(gh)gh.style.width='100%';
};
function applyBossReward(){
 if(!pendingBossReward||!activeBattleBoss)return;
 const result=$('bb-result');if(!result||result.classList.contains('bb-hide')||!result.querySelector('.bb-result-card.win'))return;
 pendingBossReward=false;
 const rewardType=activeBattleBoss.machine;
 if(!bossRewardsClaimed[activeBattleBoss.id]){
  bossRewardsClaimed[activeBattleBoss.id]=true;
  if(!machineExists(rewardType))inventory.push(makeMachine(rewardType,1));
  toast(`限定マシーン獲得！ ${machineName(rewardType)}`,'info');
 }
 if(bossGatlingUnlocked&&!machineExists('bossGatling'))inventory.push(makeMachine('bossGatling',1));
 renderFooter();window.saveGame();
}
const rewardObserver=new MutationObserver(()=>applyBossReward());
rewardObserver.observe(document.body,{childList:true,subtree:true});

/* --------- DLC有効状態・ゲーム起動後の再描画 --------- */
const previousStartGame=window.startGame;
window.startGame=function(){
 previousStartGame();
 nextBossAt=Date.now()+60000;lastShownSec=-1;
 applyCurrentStats();renderFooter();updateBossAnytimeButton();
};
window.addEventListener('load',()=>{updateBossAnytimeButton();renderFooter();});
renderDlc();
applyCurrentStats();
renderFooter();
updateBossAnytimeButton();
})();
</script>

<script id="country-defense-preclean">
/* 新しい国家防衛モード用の互換セーブ整理。既存のゲーム本体のコードは変更しません。 */
(function(){
  try {
    var banned = new Set(['bossGatling','hunterDrone','omegaBreaker','voidLancer','disasterCannon','stellarForge','singularity']);
    var gameKey = 'cyberTD2088Save';
    var extraKey = 'cyberTD2088ExtraV2';
    var shopKey = 'cyberTD2088PurchasedMachinesV3';
    var game = JSON.parse(localStorage.getItem(gameKey) || 'null');
    if (game && typeof game === 'object') {
      if (Array.isArray(game.builtTowers)) game.builtTowers = game.builtTowers.filter(function(m){ return m && !banned.has(m.type); });
      game.bossGatlingUnlocked = false;
      localStorage.setItem(gameKey, JSON.stringify(game));
    }
    var extra = JSON.parse(localStorage.getItem(extraKey) || 'null');
    if (extra && typeof extra === 'object') {
      if (Array.isArray(extra.inventory)) extra.inventory = extra.inventory.filter(function(m){ return m && !banned.has(m.type); });
      extra.dlcs = {machineTuning:false, bossExpansion:false};
      extra.bossRewardsClaimed = {};
      localStorage.setItem(extraKey, JSON.stringify(extra));
    }
    var shop = JSON.parse(localStorage.getItem(shopKey) || '[]');
    if (Array.isArray(shop)) localStorage.setItem(shopKey, JSON.stringify(shop.filter(function(m){ return m && !banned.has(m.type); })));
  } catch (e) { /* 壊れた旧セーブでもゲーム起動を妨げません */ }
})();
</script>

<script id="td3-script">
(function(){
'use strict';
const $=id=>document.getElementById(id);
const EXTRA_KEY='cyberTD2088ExtraV2';
const BASE_KEY='cyberTD2088Save';
const SHOP_KEY='cyberTD2088PurchasedMachinesV3';
const STARTER_KEY='cyberTD2088StarterKitV3';
const starterWasFreshAtLoad=!safeGet(BASE_KEY)&&!safeGet(EXTRA_KEY);
let starterGrantPending=starterWasFreshAtLoad;
let resetPending=false;
let shopStock=readShopStock();
let selectedShopUnitId=null;
let nextShopId=1;
const fireFxUntil=new Map();
const reduceMotion=()=>window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function safeGet(key){try{return localStorage.getItem(key);}catch(e){return null;}}
function safeSet(key,value){try{localStorage.setItem(key,value);return true;}catch(e){return false;}}
function getExtraData(){try{const v=JSON.parse(safeGet(EXTRA_KEY)||'null');return v&&typeof v==='object'?v:{};}catch(e){return {};}}
function readShopStock(){try{const v=JSON.parse(safeGet(SHOP_KEY)||'[]');if(!Array.isArray(v))return [];return v.filter(m=>m&&typeof m.type==='string'&&typeof TOWER_TYPES!=='undefined'&&TOWER_TYPES[m.type]).map(m=>({id:m.id||'shop-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7),type:m.type,level:Math.max(1,Number(m.level)||1),dmg:Number(m.dmg)||TOWER_TYPES[m.type].dmg,range:Number(m.range)||TOWER_TYPES[m.type].range,cooldown:0,x:null,y:null}));}catch(e){return [];}}
function persistShopStock(){safeSet(SHOP_KEY,JSON.stringify(shopStock));updateShopButton();updateActiveShopHud();}
function starterInventory(){
 const types=['machineGun','machineGun','laser','plasma','missile','emp','sniper','poison'];
 return types.map((type,i)=>{const t=TOWER_TYPES[type];return {id:'starter-'+Date.now().toString(36)+'-'+i+'-'+Math.random().toString(36).slice(2,6),type,x:null,y:null,level:1,dmg:t.dmg,range:t.range,cooldown:0};});
}
function ensureStarterKit(){
 if(!starterGrantPending&&!resetPending)return;
 if(safeGet(STARTER_KEY)) {starterGrantPending=false;resetPending=false;return;}
 const current=getExtraData();
 if(!Array.isArray(current.inventory)||current.inventory.length===0)current.inventory=starterInventory();
 if(!current.dlcs||typeof current.dlcs!=='object')current.dlcs={machineTuning:false,bossExpansion:false};
 if(!current.bossRewardsClaimed||typeof current.bossRewardsClaimed!=='object')current.bossRewardsClaimed={};
 if(!current.customStats)current.customStats={};
 if(safeSet(EXTRA_KEY,JSON.stringify(current)))safeSet(STARTER_KEY,'1');
 starterGrantPending=false;resetPending=false;
}
function storedCount(type){const data=getExtraData();return Array.isArray(data.inventory)?data.inventory.filter(m=>m&&m.type===type).length:0;}
function hasClaimedMachine(type){const claimed=getExtraData().bossRewardsClaimed||{};const map={hunterDrone:'hunter',omegaBreaker:'omega',voidLancer:'leviathan',disasterCannon:'disaster',stellarForge:'stellar',singularity:'singularity'};return !!claimed[map[type]];}
function bossDlcEnabled(){return getExtraData().dlcs?.bossExpansion===true;}
function notify(message,warn){
 let stack=$('td3-notice-stack');if(!stack){stack=document.createElement('div');stack.id='td3-notice-stack';document.body.appendChild(stack);}
 const item=document.createElement('div');item.className='td3-notice'+(warn?' warn':'');item.textContent=message;stack.appendChild(item);
 while(stack.children.length>3)stack.firstElementChild.remove();setTimeout(()=>item.classList.add('out'),2600);setTimeout(()=>item.remove(),3000);
}
/* v2の一部ハンドラーから参照される通知関数を互換用に公開 */
if(typeof window.toast!=='function')window.toast=function(message,kind){notify(String(message),kind==='warn'||kind==='warning');};
/* 新規開始時だけ、既存の初期所持ロジックを壊さずにMGを1台追加します。 */
const previousStartGame=window.startGame;
if(typeof previousStartGame==='function')window.startGame=function(){ensureStarterKit();return previousStartGame.apply(this,arguments);};

/* SVGの経路を有効な座標で描画し直し、既存ロジックはそのまま残す */
window.drawContinuousPathLine=function(container){
 const svg=$('path-svg');if(!svg||!Array.isArray(pathCoords))return;
 svg.innerHTML='';svg.setAttribute('viewBox','0 0 100 100');svg.setAttribute('preserveAspectRatio','none');
 const d=pathCoords.map((p,i)=>`${i?'L':'M'} ${(p.x+.5)*(100/GRID_W)} ${(p.y+.5)*(100/GRID_H)}`).join(' ');
 const node=document.createElementNS('http://www.w3.org/2000/svg','path');node.setAttribute('d',d);node.setAttribute('stroke','rgba(0,240,255,.42)');node.setAttribute('stroke-width','1.05');node.setAttribute('stroke-linecap','round');node.setAttribute('stroke-linejoin','round');node.setAttribute('fill','none');node.setAttribute('stroke-dasharray','1.4 2.1');node.style.filter='drop-shadow(0 0 1.3px rgba(0,240,255,.95))';
 const anim=document.createElementNS('http://www.w3.org/2000/svg','animate');anim.setAttribute('attributeName','stroke-dashoffset');anim.setAttribute('values','8;0');anim.setAttribute('dur','1.6s');anim.setAttribute('repeatCount','indefinite');node.appendChild(anim);svg.appendChild(node);
};

/* 購入マシーン用の独立した保管庫。従来のインベントリ保存とは別に保持します。 */
const previousSaveGame=window.saveGame;
if(typeof previousSaveGame==='function')window.saveGame=function(){const r=previousSaveGame.apply(this,arguments);persistShopStock();return r;};
const previousClearSave=window.clearSave;
if(typeof previousClearSave==='function')window.clearSave=function(){
 try{localStorage.removeItem(SHOP_KEY);localStorage.removeItem(STARTER_KEY);}catch(e){}
 shopStock=[];selectedShopUnitId=null;starterGrantPending=true;resetPending=true;
 const r=previousClearSave.apply(this,arguments);updateShopButton();updateActiveShopHud();return r;
};

/* マシーンのデザインを、光学コア・装甲・回転リング・砲身を持つモデルに変更 */
const previousRenderTowerDOM=window.renderTowerDOM;
if(typeof previousRenderTowerDOM==='function')window.renderTowerDOM=function(cell,tower){
 const r=previousRenderTowerDOM.apply(this,arguments);
 const base=TOWER_TYPES[tower.type];const el=cell&&cell.querySelector('.tower');
 if(!base||!el)return r;
 el.classList.add('td3-tower');el.dataset.type=tower.type;el.style.color=base.color;
 el.innerHTML=`<span class="td3-orbit"></span><span class="td3-orbit td3-orbit-b"></span><span class="td3-chassis"><span class="td3-core"></span><span class="td3-barrel a"></span><span class="td3-barrel b"></span><i class="fa-solid ${base.icon} td3-machine-icon"></i><span class="td3-lv">Lv${tower.level}</span><span class="td3-muzzle"></span></span>`;
 return r;
};

/* マシーンショップのUI */
const baseOfferIds=['machineGun','laser','plasma','missile','emp','sniper','poison'];
function availableOfferIds(){
 const ids=baseOfferIds.slice();
 if(typeof bossGatlingUnlocked!=='undefined'&&bossGatlingUnlocked || storedCount('bossGatling')>0 || builtTowers.some(m=>m.type==='bossGatling') || shopStock.some(m=>m.type==='bossGatling'))ids.push('bossGatling');
 ['hunterDrone','omegaBreaker','voidLancer','disasterCannon','stellarForge','singularity'].forEach(id=>{
  if(storedCount(id)>0||builtTowers.some(m=>m.type===id)||shopStock.some(m=>m.type===id)||hasClaimedMachine(id))ids.push(id);
 });
 return ids.filter((id,i,a)=>a.indexOf(id)===i&&TOWER_TYPES[id]);
}
function shopPrice(type){return Math.max(50,Math.round((Number(TOWER_TYPES[type]?.cost)||50)*2));}
const shopOverlay=document.createElement('div');shopOverlay.id='td3-shop-overlay';shopOverlay.hidden=true;
shopOverlay.innerHTML=`<section class="td3-shop-panel"><div class="td3-shop-head"><div><div class="td3-shop-title"><i class="fa-solid fa-industry"></i> MACHINE MARKET</div></div><button type="button" class="td3-shop-close" aria-label="閉じる">×</button></div><div class="td3-shop-sub">コインで追加マシーンを購入できます。購入後は空きマスをクリックして配置してください。同じ種類のマシーンも複数台そろえられます。</div><div class="td3-shop-section"><i class="fa-solid fa-coins" style="color:#ffde00"></i>購入できるマシーン</div><div id="td3-shop-offers"></div><div class="td3-shop-section"><i class="fa-solid fa-box-open" style="color:#00f0ff"></i>購入済み・配置待ち</div><div id="td3-shop-stock"></div><div class="td3-shop-sub" style="margin-top:14px;margin-bottom:0">購入したマシーンはこのブラウザに保存されます。既存のセーブデータやボス報酬には影響しません。</div></section>`;
document.body.appendChild(shopOverlay);
shopOverlay.querySelector('.td3-shop-close').onclick=()=>shopOverlay.hidden=true;
shopOverlay.addEventListener('click',e=>{if(e.target===shopOverlay)shopOverlay.hidden=true;});
function makeBoughtMachine(type){const t=TOWER_TYPES[type];return {id:'buy-'+Date.now().toString(36)+'-'+(nextShopId++)+'-'+Math.random().toString(36).slice(2,6),type,level:1,dmg:Number(t.dmg)||1,range:Number(t.range)||1,cooldown:0,x:null,y:null};}
function renderShop(){
 const offers=$('td3-shop-offers'),stock=$('td3-shop-stock');if(!offers||!stock)return;
 offers.innerHTML=availableOfferIds().map(id=>{const t=TOWER_TYPES[id],price=shopPrice(id),owned=storedCount(id)+builtTowers.filter(m=>m.type===id).length+shopStock.filter(m=>m.type===id).length;return `<article class="td3-shop-card" style="--mc:${t.color}"><div class="td3-shop-icon"><i class="fa-solid ${t.icon}"></i></div><h3>${t.name}</h3><div class="td3-shop-stats">攻撃力 ${Math.floor(t.dmg).toLocaleString('ja-JP')}　/　射程 ${Number(t.range).toFixed(1)}<br>所持・配置・保管 合計 ${owned} 台</div><div class="td3-shop-price">¥${price.toLocaleString('ja-JP')}</div><button class="td3-shop-action" data-buy-machine="${id}" style="--mc:${t.color}">購入する</button></article>`;}).join('');
 if(!shopStock.length)stock.innerHTML='<div class="td3-shop-empty">購入待ちのマシーンはありません。購入するとここからも配置できます。</div>';
 else stock.innerHTML=shopStock.map(m=>{const t=TOWER_TYPES[m.type];if(!t)return '';const selected=m.id===selectedShopUnitId;return `<article class="td3-shop-card" style="--mc:${t.color}"><div class="td3-shop-icon"><i class="fa-solid ${t.icon}"></i></div><h3>${t.name}</h3><div class="td3-shop-stats">Lv.${m.level}　攻撃力 ${Math.floor(m.dmg).toLocaleString('ja-JP')}<br>${selected?'配置対象に選択中':'配置待ち'}</div><button class="td3-shop-action" data-select-machine="${m.id}" style="--mc:${t.color}">${selected?'選択中':'このマシーンを配置'}</button></article>`;}).join('');
 offers.querySelectorAll('[data-buy-machine]').forEach(btn=>btn.onclick=()=>buyMachine(btn.dataset.buyMachine));
 stock.querySelectorAll('[data-select-machine]').forEach(btn=>btn.onclick=()=>selectBoughtMachine(btn.dataset.selectMachine));
}
function openShop(){renderShop();shopOverlay.hidden=false;}
function buyMachine(type){
 const t=TOWER_TYPES[type];if(!t)return;
 const price=shopPrice(type);if(gold<price){notify(`コインが足りません。必要：¥${price.toLocaleString('ja-JP')} / 所持：¥${Math.floor(gold).toLocaleString('ja-JP')}`,true);return;}
 gold-=price;const machine=makeBoughtMachine(type);shopStock.push(machine);selectedShopUnitId=machine.id;
 if(typeof window.updateUI==='function')window.updateUI();persistShopStock();if(typeof window.saveGame==='function')window.saveGame();renderShop();shopOverlay.hidden=true;updateActiveShopHud();notify(`${t.name} を購入しました。空きマスをクリックして配置してください。`);
}
function selectBoughtMachine(id){if(!shopStock.some(m=>m.id===id))return;selectedShopUnitId=id;shopOverlay.hidden=true;updateActiveShopHud();const m=shopStock.find(v=>v.id===id);notify(`${TOWER_TYPES[m.type].name} を配置対象にしました。空きマスをクリック！`);renderShop();}
function updateShopButton(){const b=$('td3-shop-btn');if(b)b.innerHTML=`<i class="fa-solid fa-industry"></i> マシーンショップ${shopStock.length?` (${shopStock.length})`:''}`;}
function updateActiveShopHud(){
 let hud=$('td3-active-shop-unit');if(!hud){hud=document.createElement('div');hud.id='td3-active-shop-unit';const game=$('view-game');if(game)game.appendChild(hud);}
 const m=shopStock.find(v=>v.id===selectedShopUnitId);
 if(!hud)return;
 if(!m){hud.classList.remove('show');hud.innerHTML='';return;}
 const t=TOWER_TYPES[m.type];hud.innerHTML=`<div style="color:${t.color};font-size:20px"><i class="fa-solid ${t.icon}"></i></div><div class="td3-hud-main"><b>${t.name}｜配置待ち</b>空きマスをクリックして設置（購入済み）</div><button type="button" class="td3-hud-cancel">解除</button>`;
 hud.querySelector('.td3-hud-cancel').onclick=()=>{selectedShopUnitId=null;updateActiveShopHud();};hud.classList.add('show');
}
const headerRight=document.querySelector('#view-game header>div:last-child');
if(headerRight&&!$('td3-shop-btn')){const b=document.createElement('button');b.id='td3-shop-btn';b.className='cyber-v2-btn td3-tower-shop-btn';b.onclick=openShop;headerRight.insertBefore(b,$('cyber-inventory-btn')||headerRight.firstChild);updateShopButton();}

/* 既存の配置ロジックを活かし、所持数が複数ある種類のみ重ねて配置可能にする */
function placeBoughtMachine(x,y,cell){
 const index=shopStock.findIndex(m=>m.id===selectedShopUnitId);if(index<0){selectedShopUnitId=null;updateActiveShopHud();return false;}
 const machine=shopStock.splice(index,1)[0];machine.x=x;machine.y=y;machine.cooldown=0;builtTowers.push(machine);
 if(typeof window.renderTowerDOM==='function')window.renderTowerDOM(cell,machine);
 if(typeof window.updateUI==='function')window.updateUI();
 try{if(typeof window.saveGame==='function')window.saveGame();}catch(e){}
 try{if(typeof window.renderFooter==='function')window.renderFooter();}catch(e){}
 try{if(typeof window.spawnParticle==='function')window.spawnParticle(x,y,'build');}catch(e){}
 cell.classList.remove('td3-built-flash');void cell.offsetWidth;cell.classList.add('td3-built-flash');setTimeout(()=>cell.classList.remove('td3-built-flash'),500);
 selectedShopUnitId=null;persistShopStock();updateActiveShopHud();if(!shopOverlay.hidden)renderShop();notify(`${TOWER_TYPES[machine.type].name} を配置しました！`);
 return true;
}
const previousHandleCellClick=window.handleCellClick;
if(typeof previousHandleCellClick==='function')window.handleCellClick=function(x,y,cell){
 const existing=builtTowers.find(t=>t.x===x&&t.y===y);if(existing)return previousHandleCellClick.apply(this,arguments);
 if(selectedShopUnitId&&shopStock.some(m=>m.id===selectedShopUnitId))return placeBoughtMachine(x,y,cell);
 const type=selectedTowerType;
 const alreadyPlaced=builtTowers.filter(t=>t.type===type);
 const stored=storedCount(type);
 if(alreadyPlaced.length>0&&stored>0){
  const removed=builtTowers.map((t,i)=>({t,i})).filter(v=>v.t.type===type);
  for(let i=removed.length-1;i>=0;i--)builtTowers.splice(removed[i].i,1);
  let result;try{result=previousHandleCellClick.apply(this,arguments);}catch(e){for(const v of removed)builtTowers.splice(Math.min(v.i,builtTowers.length),0,v.t);throw e;}
  const placedNow=builtTowers.some(t=>t.x===x&&t.y===y&&t.type===type);
  for(const v of removed)builtTowers.splice(Math.min(v.i,builtTowers.length),0,v.t);
  if(placedNow){if(typeof window.updateUI==='function')window.updateUI();if(typeof window.renderFooter==='function')window.renderFooter();if(typeof window.saveGame==='function')window.saveGame();cell.classList.remove('td3-built-flash');void cell.offsetWidth;cell.classList.add('td3-built-flash');setTimeout(()=>cell.classList.remove('td3-built-flash'),500);}
  return result;
 }
 const before=builtTowers.length;const r=previousHandleCellClick.apply(this,arguments);
 if(builtTowers.length>before&&builtTowers.some(t=>t.x===x&&t.y===y)){cell.classList.remove('td3-built-flash');void cell.offsetWidth;cell.classList.add('td3-built-flash');setTimeout(()=>cell.classList.remove('td3-built-flash'),500);}
 return r;
};

/* 発射時の反動演出・射撃ビーム・敵の輪郭エフェクト */
const previousUpdateGame=window.updateGame;
if(typeof previousUpdateGame==='function')window.updateGame=function(dt){
 const before=new Map(builtTowers.map(t=>[t.id,Number(t.cooldown)||0]));const r=previousUpdateGame.apply(this,arguments);const now=performance.now();
 builtTowers.forEach(t=>{const was=before.get(t.id)||0;if((Number(t.cooldown)||0)>was+2)fireFxUntil.set(t.id,now+250);});return r;
};
const previousDrawGame=window.drawGame;
if(typeof previousDrawGame==='function')window.drawGame=function(){
 const r=previousDrawGame.apply(this,arguments);const now=performance.now();
 try{
  builtTowers.forEach(t=>{const cells=gridEl.querySelectorAll('.grid-cell');const cell=cells[t.y*GRID_W+t.x];const el=cell&&cell.querySelector('.tower');if(el)el.classList.toggle('td3-firing',(fireFxUntil.get(t.id)||0)>now);});
  ctx.save();ctx.globalCompositeOperation='lighter';
  builtTowers.forEach(t=>{if((fireFxUntil.get(t.id)||0)<=now)return;const p=getPixelPos(t.x,t.y),base=TOWER_TYPES[t.type],radius=Math.min(canvas.width/GRID_W,canvas.height/GRID_H)*(.25+.2*Math.max(0,Math.sin(now/42)));ctx.globalAlpha=.75;ctx.strokeStyle=base.color;ctx.shadowColor=base.color;ctx.shadowBlur=13;ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,radius,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=.8;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x,p.y-radius*1.5);ctx.stroke();});
  particles.forEach(p=>{if(p.type==='laser'){ctx.globalAlpha=Math.min(1,p.life*1.8);ctx.strokeStyle=p.color||'#00f0ff';ctx.shadowColor=p.color||'#00f0ff';ctx.shadowBlur=15;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.tx,p.ty);ctx.stroke();ctx.shadowBlur=0;ctx.globalAlpha=Math.min(.95,p.life*1.7);ctx.lineWidth=1;ctx.strokeStyle='#ffffff';ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.tx,p.ty);ctx.stroke();}else if(p.type==='explosion'||p.type==='build'||p.type==='upgrade'){const q=1-p.life;ctx.globalAlpha=Math.max(0,p.life)*.55;ctx.strokeStyle=p.type==='upgrade'?'#00f0ff':p.type==='build'?'#fff':'#ffde00';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(p.x,p.y,2+q*15,0,Math.PI*2);ctx.stroke();for(let i=0;i<4;i++){const a=i*Math.PI/2+now/120;ctx.beginPath();ctx.moveTo(p.x+Math.cos(a)*(3+q*3),p.y+Math.sin(a)*(3+q*3));ctx.lineTo(p.x+Math.cos(a)*(7+q*10),p.y+Math.sin(a)*(7+q*10));ctx.stroke();}}});
  ctx.restore();
 }catch(e){try{ctx.restore();}catch(_){} }
 return r;
};

/* BOSSDLCコード。入力すると既存のBOSS追加パックを有効にし、カウントダウンを隠します。 */
function installCodePanel(){
 const host=document.querySelector('#cyber-dlc-overlay .cyber-v2-content');if(!host||host.querySelector('.td3-code-panel'))return;
 const panel=document.createElement('section');panel.className='td3-code-panel';panel.innerHTML=`<div class="td3-code-title"><i class="fa-solid fa-terminal" style="color:#ff007f;margin-right:7px"></i>DLC SYSTEM CODE</div><div class="td3-code-row"><input class="td3-code-input" id="td3-dlc-code" maxlength="32" autocomplete="off" spellcheck="false" placeholder="コードを入力（例：BOSSDLC）"><button type="button" class="td3-code-submit" id="td3-dlc-code-submit">コードを適用</button></div><div class="td3-code-note">BOSSDLC：BOSS追加パックを有効化し、BOSSまでのカウントダウンを非表示にします。BOSS戦はより高品質なシネマティック演出になります。</div>`;
 host.appendChild(panel);
 const input=panel.querySelector('#td3-dlc-code'),button=panel.querySelector('#td3-dlc-code-submit');
 const apply=()=>{const code=input.value.trim().toUpperCase();if(code!=='BOSSDLC'){notify('コードが正しくありません。BOSSDLCを入力してください。',true);return;}if(!bossDlcEnabled()){const toggle=$('cyber-toggle-bossdlc');if(toggle)toggle.click();else{notify('DLC画面を開き直して、もう一度お試しください。',true);return;}}else notify('BOSSDLCはすでに有効です。カウントダウン非表示と強化演出が適用されています。');input.value='';applyDlcVisuals();};
 button.onclick=apply;input.addEventListener('keydown',e=>{if(e.key==='Enter')apply();});
}
const dlcHost=document.querySelector('#cyber-dlc-overlay .cyber-v2-content');
if(dlcHost){new MutationObserver(installCodePanel).observe(dlcHost,{childList:true});installCodePanel();}
function applyDlcVisuals(){
 const enabled=bossDlcEnabled();const timer=$('boss-timer'),big=$('bb-countdown-big');
 if(timer)timer.classList.toggle('td3-countdown-disabled',enabled);if(big)big.classList.toggle('td3-countdown-disabled',enabled);
 const view=$('view-boss-battle');if(view&&view.classList.contains('hidden'))view.classList.remove('td3-boss-cinematic');
}
const previousCheckBossEvent=window.checkBossEvent;
if(typeof previousCheckBossEvent==='function')window.checkBossEvent=function(){const r=previousCheckBossEvent.apply(this,arguments);applyDlcVisuals();return r;};
const previousStartBossBattle=window.startBossBattle;
if(typeof previousStartBossBattle==='function')window.startBossBattle=function(){const r=previousStartBossBattle.apply(this,arguments);const view=$('view-boss-battle');if(view)view.classList.toggle('td3-boss-cinematic',bossDlcEnabled());applyDlcVisuals();return r;};
const previousUpdateBossHP=window.updateBossHPUI;
if(typeof previousUpdateBossHP==='function')window.updateBossHPUI=function(){const before=$('boss-hp-text')?.textContent;const r=previousUpdateBossHP.apply(this,arguments);const after=$('boss-hp-text')?.textContent;if(bossDlcEnabled()&&before&&after!==before){const entity=$('boss-entity'),view=$('view-boss-battle');if(entity){entity.classList.remove('td3-boss-hit');void entity.offsetWidth;entity.classList.add('td3-boss-hit');setTimeout(()=>entity.classList.remove('td3-boss-hit'),250);}if(view){view.classList.remove('td3-hit');void view.offsetWidth;view.classList.add('td3-hit');setTimeout(()=>view.classList.remove('td3-hit'),220);}}return r;};

/* シネマティック背景キャンバス：BOSSDLC有効中のボス戦だけ描画 */
const bossView=$('view-boss-battle');let cinematicCanvas=null,cinematicCtx=null,cinematicDpr=1,cinematicW=0,cinematicH=0,lastCineTime=0,cineSpawn=0;const cineParticles=[];
if(bossView&&!$('td3-boss-cinematic-canvas')){cinematicCanvas=document.createElement('canvas');cinematicCanvas.id='td3-boss-cinematic-canvas';const wrap=bossView.querySelector('.bb-wrap')||bossView.children[1];bossView.insertBefore(cinematicCanvas,wrap||bossView.firstChild);cinematicCtx=cinematicCanvas.getContext('2d');}
else{cinematicCanvas=$('td3-boss-cinematic-canvas');if(cinematicCanvas)cinematicCtx=cinematicCanvas.getContext('2d');}
function cineColor(color,alpha){if(!color||color[0]!=='#')return `rgba(0,240,255,${alpha})`;let h=color.slice(1);if(h.length===3)h=h.split('').map(ch=>ch+ch).join('');const n=parseInt(h,16);if(!Number.isFinite(n))return `rgba(0,240,255,${alpha})`;return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${alpha})`; }
function cinemaFrame(ts){requestAnimationFrame(cinemaFrame);if(!cinematicCanvas||!cinematicCtx||!bossView||!bossDlcEnabled()||bossView.classList.contains('hidden'))return;
 const rect=bossView.getBoundingClientRect();if(rect.width<2||rect.height<2)return;
 cinematicDpr=Math.min(window.devicePixelRatio||1,1.6);const w=Math.floor(rect.width),h=Math.floor(rect.height);
 if(cinematicW!==w||cinematicH!==h){cinematicW=w;cinematicH=h;cinematicCanvas.width=Math.round(w*cinematicDpr);cinematicCanvas.height=Math.round(h*cinematicDpr);cinematicCanvas.style.width=w+'px';cinematicCanvas.style.height=h+'px';}
 const c=cinematicCtx;c.setTransform(cinematicDpr,0,0,cinematicDpr,0,0);c.clearRect(0,0,w,h);
 const er=$('boss-entity')?.getBoundingClientRect();const cx=er?er.left-rect.left+er.width/2:w*.5,cy=er?er.top-rect.top+er.height/2:h*.35;
 const color=bossView.style.getPropertyValue('--active-boss-color')||'#00f0ff';const t=ts/1000;
 c.save();c.globalCompositeOperation='lighter';
 const haze=c.createRadialGradient(cx,cy,5,cx,cy,Math.min(w,h)*.47);haze.addColorStop(0,cineColor(color,.12));haze.addColorStop(.45,'rgba(0,240,255,.025)');haze.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=haze;c.fillRect(0,0,w,h);
 for(let i=0;i<5;i++){const radius=62+i*24+Math.sin(t*1.4+i)*5;c.globalAlpha=.13+(Math.sin(t*1.8+i)*.035);c.strokeStyle=i%2?color:'#00f0ff';c.lineWidth=i===0?2:1;c.setLineDash(i%2?[5,9]:[2,12]);c.lineDashOffset=-t*(12+i*3)*(i%2?-1:1);c.beginPath();c.ellipse(cx,cy,radius*1.15,radius*(.58+i*.035),t*.12+i*.38,0,Math.PI*2);c.stroke();}
 c.setLineDash([]);c.globalAlpha=.13;c.strokeStyle=color;c.lineWidth=1.2;
 for(let i=0;i<8;i++){const a=t*.24+i*Math.PI/4;const r=Math.min(w,h)*.36;c.beginPath();c.moveTo(cx+Math.cos(a)*34,cy+Math.sin(a)*34);c.lineTo(cx+Math.cos(a+.09)*r,cy+Math.sin(a+.09)*r);c.stroke();}
 const dt=Math.min(.04,(ts-(lastCineTime||ts))/1000||0);lastCineTime=ts;cineSpawn+=dt;
 while(cineSpawn>.045&&cineParticles.length<150){cineSpawn-=.045;const a=Math.random()*Math.PI*2,rad=45+Math.random()*Math.min(w,h)*.31;cineParticles.push({x:cx+Math.cos(a)*rad,y:cy+Math.sin(a)*rad,vx:Math.cos(a)*(8+Math.random()*28),vy:Math.sin(a)*(8+Math.random()*28),life:.6+Math.random()*1.25,max:1.85,size:.6+Math.random()*2.0,color:Math.random()>.5?color:'#9cf8ff'});}
 for(let i=cineParticles.length-1;i>=0;i--){const p=cineParticles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0){cineParticles.splice(i,1);continue;}c.globalAlpha=Math.min(1,p.life/.35)*Math.min(.75,p.life/p.max*1.4);c.fillStyle=p.color;c.shadowColor=p.color;c.shadowBlur=8;c.beginPath();c.arc(p.x,p.y,p.size,0,Math.PI*2);c.fill();if(p.life>.4){c.globalAlpha*=.45;c.strokeStyle=p.color;c.lineWidth=.7;c.beginPath();c.moveTo(p.x-p.vx*.12,p.y-p.vy*.12);c.lineTo(p.x,p.y);c.stroke();}}
 c.restore();
}
requestAnimationFrame(cinemaFrame);

/* 初期表示・DLC状態反映 */
updateShopButton();updateActiveShopHud();applyDlcVisuals();
window.addEventListener('load',()=>{updateShopButton();updateActiveShopHud();applyDlcVisuals();});
})();
</script>

.country-world-actions button,.country-ui-btn,.country-primary-btn{border:1px solid #5cecff66;border-radius:8px;padding:9px 12px;font-weight:800;color:#eafcff;background:linear-gradient(135deg,#0c4261b8,#10182bd9);cursor:pointer;transition:filter .16s,transform .16s,border-color .16s}
.country-world-actions button:hover,.country-ui-btn:hover,.country-primary-btn:hover{filter:brightness(1.25);border-color:#5cecff;transform:translateY(-1px)}
.country-world-actions .delete{border-color:#ff627e55;color:#ff9bac;background:#50162555}
.country-main-layout{display:grid!important;grid-template-columns:minmax(0,1fr) 306px;align-items:stretch;gap:0;overflow:hidden}
.country-playfield{min-width:0;min-height:0;padding:10px!important}
.country-playfield>div{width:100%!important;max-width:100%!important;max-height:100%;aspect-ratio:2/1}
.country-side-panel{width:306px;min-width:0;min-height:0;overflow:auto;border-left:1px solid #5cecff36;background:linear-gradient(180deg,rgba(7,18,37,.98),rgba(4,9,23,.97));padding:13px;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin;scrollbar-color:#23526c #08101e}
.country-panel-card{border:1px solid #43617b66;border-radius:11px;padding:12px;background:linear-gradient(145deg,rgba(18,33,58,.8),rgba(5,11,26,.82));box-shadow:inset 0 0 18px #00ddff06}
.country-panel-title{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:900;color:#a8f6ff;letter-spacing:.05em;margin-bottom:10px}
.country-panel-title i{color:#5cecff}
.country-label{display:block;font-size:10px;color:#9bb1ce;margin-bottom:5px}
.country-input,.country-select{width:100%;min-width:0;background:#050b18;border:1px solid #4e789466;border-radius:7px;padding:9px 10px;color:#f2fbff;font-size:12px;outline:none}
.country-input:focus,.country-select:focus{border-color:#5cecff;box-shadow:0 0 0 2px #5cecff12}
.country-form-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;margin-top:8px}
.country-ui-btn{font-size:11px;padding:8px 10px;white-space:nowrap}
.country-stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.country-stat{padding:8px;border-radius:8px;border:1px solid #4c739044;background:#03091799;min-width:0}
.country-stat .label{display:block;font-size:9px;color:#8da7c8;margin-bottom:5px}
.country-stat .value{display:block;font:800 17px 'Orbitron','Noto Sans JP',sans-serif;color:#eafcff;overflow-wrap:anywhere}
.country-stat .value.green{color:#75ffc0}.country-stat .value.amber{color:#ffdf86}.country-stat .value.red{color:#ff8094}
.country-policy-note{font-size:10px;line-height:1.7;color:#94abc7;margin-top:8px}
.country-policy-chip{display:inline-flex;padding:3px 7px;border-radius:5px;background:#00e5ff12;border:1px solid #5cecff45;color:#a9f7ff;font-size:10px;font-weight:900;margin-top:7px}
.country-action-stack{display:flex;flex-direction:column;gap:7px}
.country-primary-btn{width:100%;font-size:12px;padding:11px 12px;background:linear-gradient(110deg,#114b74,#087c94);border-color:#5cecff99}
.country-primary-btn.missile{background:linear-gradient(110deg,#6f2839,#c34450);border-color:#ff8597;box-shadow:0 0 14px #ff34501c}
.country-primary-btn.active{background:linear-gradient(110deg,#853e16,#9c721d);border-color:#ffdb73;color:#fff3ce;box-shadow:0 0 16px #ffdb7330}
.country-small-note{font-size:10px;line-height:1.75;color:#93a9c8;margin-top:7px}
.country-alert{padding:8px 9px;border-radius:8px;border:1px solid #ff627e55;background:#49132255;color:#ffb5c2;font-size:11px;line-height:1.65}
.country-log{display:flex;flex-direction:column;gap:6px;max-height:112px;overflow:auto}
.country-log-line{font-size:10px;color:#91a9c9;line-height:1.6;border-left:2px solid #4a91a7;padding-left:7px}
.country-log-line.warn{border-color:#ff627e;color:#ffb6c3}.country-log-line.ok{border-color:#5dffb0;color:#9effd1}
.grid-cell.war-wasteland{background:radial-gradient(ellipse at 48% 52%,#251f21 0 12%,#13171d 26%,#080d16 73%)!important;border-color:#a66d5b!important;box-shadow:inset 0 0 8px #ff6b3a2a!important;overflow:hidden}
.grid-cell.war-wasteland::after{content:"";position:absolute;inset:12%;border:1px dashed #a867526e;border-radius:42% 55% 48% 52%;transform:rotate(-20deg);pointer-events:none;background:repeating-linear-gradient(135deg,transparent 0 7px,#aa5d3f12 7px 9px)}
.grid-cell.war-wasteland::before{content:"荒";position:absolute;right:2px;bottom:1px;font-size:7px;font-weight:900;color:#d18b6d99;z-index:1;pointer-events:none}
.grid-cell.war-wasteland .tower{opacity:.35;filter:grayscale(1)}
.grid-cell.war-wasteland:hover{cursor:not-allowed!important}
.grid-cell.war-move-source{outline:2px solid #ffdb73!important;outline-offset:-2px;box-shadow:inset 0 0 18px #ffdb7338!important}
.grid-cell.war-move-target{outline:1px dashed #75ffc0!important;outline-offset:-2px}
#war-announcement{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:41;width:min(680px,75%);text-align:center;pointer-events:none;opacity:0;padding:9px 15px;border:1px solid #ff627e7a;border-radius:10px;background:#210b16e8;color:#ffdce4;font-size:13px;font-weight:900;box-shadow:0 0 20px #ff34501b}
#war-announcement.show{animation:war-banner 3.6s ease forwards}
@keyframes war-banner{0%{opacity:0;transform:translate(-50%,-8px)}12%,70%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-5px)}}
#war-fx-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:35}
#view-game header #toggle-spawn-btn,#view-game header #debug-boss,#view-game header #boss-timer{display:none!important}
#td3-active-shop-unit{z-index:42}
@media(max-width:1040px){.country-main-layout{grid-template-columns:minmax(0,1fr) 260px}.country-side-panel{width:260px;padding:9px}.country-stat .value{font-size:14px}}
@media(max-width:760px){body{overflow:auto}#view-game{min-height:100vh;height:100vh!important}.country-main-layout{grid-template-columns:minmax(0,1fr) 220px}.country-side-panel{width:220px;padding:7px;gap:7px}.country-panel-card{padding:8px}.country-panel-title{font-size:10px}.country-input,.country-select{padding:7px;font-size:10px}.country-ui-btn{font-size:10px;padding:7px}.country-primary-btn{font-size:10px;padding:9px 7px}.country-stat .value{font-size:12px}.country-stat .label{font-size:8px}.country-playfield{padding:4px!important}.country-main-layout .game-grid{gap:1px}}
@media(max-width:560px){.country-main-layout{display:flex!important;flex-direction:column}.country-playfield{flex:0 0 auto!important;min-height:240px;height:36vh;padding:4px!important}.country-playfield>div{max-height:100%;height:100%;width:auto!important;max-width:100%!important;aspect-ratio:2/1;margin:auto}.country-side-panel{width:100%;max-height:38vh;border-left:0;border-top:1px solid #5cecff36;display:grid;grid-template-columns:1fr 1fr;overflow:auto}.country-side-panel .country-panel-card:last-child{grid-column:1/-1}#view-game footer{height:88px!important}.country-load-top{align-items:flex-start;flex-direction:column}}
</style>
<script id="country-defense-extension">
(function(){
'use strict';
const $=id=>document.getElementById(id);
const GAME_KEYS=['cyberTD2088Save','cyberTD2088ExtraV2','cyberTD2088PurchasedMachinesV3','cyberTD2088StarterKitV3'];
const WORLD_INDEX_KEY='cyberNationWorlds_v1';
const CORE_MACHINE_IDS=['machineGun','laser','plasma','missile','emp','sniper','poison'];
const BOSS_MACHINE_IDS=new Set(['bossGatling','hunterDrone','omegaBreaker','voidLancer','disasterCannon','stellarForge','singularity']);
const BOSS_MACHINE_NAMES=['ボスガトリング','ハンター・ドローン','オメガ・ブレイカー','ヴォイド・ランサー','ディザスター砲','ステラ・フォージ','シンギュラリティ'];
const FOREIGN_NATIONS=['北方連邦','東部共和国','西方同盟','南部連合','ノヴァ自治圏'];
const POLICY={
 defense:{label:'防衛重視',income:320,interval:4.7,speed:.82,enemyHp:.92,desc:'侵攻間隔が長くなり、敵部隊の速度が低下します。国家収入は安定します。'},
 economy:{label:'経済優先',income:1050,interval:2.9,speed:1.03,enemyHp:1.0,desc:'国家収入が大幅に増えますが、敵国の侵攻頻度が上がります。'},
 mobilization:{label:'総動員',income:560,interval:2.5,speed:1.13,enemyHp:1.12,desc:'侵攻部隊は強くなります。高めの収入で国境防衛を強化できます。'},
 diplomacy:{label:'外交緩和',income:690,interval:5.8,speed:.88,enemyHp:.86,desc:'外交交渉で侵攻が遅くなり、敵部隊も弱まります。収入も得られます。'}
};
let nation={name:'ピリタマ共和国',policy:'defense',wasteland:[],wave:0,warElapsed:0,missilesFired:0,log:[]};
let currentWorldId=null, gameStartedOnce=false, firstLoadDone=false, saveIntervalId=null;
let invasionClock=0,incomeClock=0,wasteland=new Set(), missileTargeting=false, moveMode=false, moveSourceId=null, selectedSourceCell=null;
let missileFlights=[], impactBursts=[], warPanel=null, warAnnouncement=null, warFxCanvas=null, warFxCtx=null;
let lastAnnouncementAt=0, lastHealth=20, lastWarUiBucket=-1, gridListenerInstalled=false;
const initialCountry=()=>({name:'ピリタマ共和国',policy:'defense',wasteland:[],wave:0,warElapsed:0,missilesFired:0,log:[]});
function readWorlds(){try{const v=JSON.parse(localStorage.getItem(WORLD_INDEX_KEY)||'[]');return Array.isArray(v)?v.filter(w=>w&&w.id):[];}catch(e){return [];}}
function writeWorlds(worlds){try{localStorage.setItem(WORLD_INDEX_KEY,JSON.stringify(worlds));return true;}catch(e){warToast('ワールド保存容量が不足しています。不要なワールドを削除してください。',true);return false;}}
function storageSnapshot(){const out={};for(const k of GAME_KEYS){try{out[k]=localStorage.getItem(k);}catch(e){out[k]=null;}}return out;}
function restoreStorage(s){for(const k of GAME_KEYS){try{if(s&&Object.prototype.hasOwnProperty.call(s,k)&&s[k]!==null)localStorage.setItem(k,s[k]);else localStorage.removeItem(k);}catch(e){}}}
function safeJson(raw,fallback){try{return raw?JSON.parse(raw):fallback;}catch(e){return fallback;}}
function serializableNation(){return {name:String(nation.name||'ピリタマ共和国').slice(0,32),policy:POLICY[nation.policy]?nation.policy:'defense',wasteland:Array.from(wasteland),wave:Number(nation.wave)||0,warElapsed:Number(nation.warElapsed)||0,missilesFired:Number(nation.missilesFired)||0,log:Array.isArray(nation.log)?nation.log.slice(-8):[]};}
function writeWorldRecord(){if(!currentWorldId)return;const worlds=readWorlds(),now=Date.now();let w=worlds.find(x=>x.id===currentWorldId);if(!w){w={id:currentWorldId,createdAt:now};worlds.push(w);}w.name=nation.name||'無名国家';w.country=serializableNation();w.storage=storageSnapshot();w.updatedAt=now;if(!w.createdAt)w.createdAt=now;writeWorlds(worlds);}
function saveCurrentWorld(){if(currentWorldId&&gameStartedOnce&&$('view-game')&&!$('view-game').classList.contains('hidden')){try{window.saveGame();}catch(e){writeWorldRecord();}}}
function ensureLegacyWorld(){let worlds=readWorlds();if(worlds.length)return;let legacy=null;try{legacy=localStorage.getItem('cyberTD2088Save');}catch(e){return;}if(!legacy)return;const id='legacy-'+Date.now().toString(36);worlds.push({id,name:'旧セーブから復元したワールド',createdAt:Date.now(),updatedAt:Date.now(),country:initialCountry(),storage:storageSnapshot()});writeWorlds(worlds);}
function clearGameStorage(){for(const k of GAME_KEYS){try{localStorage.removeItem(k);}catch(e){}}}
function makeStarterData(){
 const inv=[['machineGun',2],['laser',1],['plasma',1],['missile',1],['emp',1],['sniper',1],['poison',1]].flatMap(([type,count])=>Array.from({length:count},(_,i)=>({id:'nation-start-'+type+'-'+i+'-'+Math.random().toString(36).slice(2,7),type,x:null,y:null,level:1,dmg:Number(TOWER_TYPES[type]?.dmg)||10,range:Number(TOWER_TYPES[type]?.range)||2.5,cooldown:0})));
 const cleanExtra={inventory:inv,dlcs:{machineTuning:false,bossExpansion:false},bossRewardsClaimed:{},customStats:{}};
 try{localStorage.setItem('cyberTD2088Save',JSON.stringify({gold:350,playerHealth:20,builtTowers:[],bossGatlingUnlocked:false}));localStorage.setItem('cyberTD2088ExtraV2',JSON.stringify(cleanExtra));localStorage.setItem('cyberTD2088PurchasedMachinesV3','[]');localStorage.setItem('cyberTD2088StarterKitV3','1');}catch(e){}
}
function cleanLegacyBossData(){
 try{if(typeof bossGatlingUnlocked!=='undefined')bossGatlingUnlocked=false;}catch(e){}
 try{for(let i=builtTowers.length-1;i>=0;i--)if(BOSS_MACHINE_IDS.has(builtTowers[i]?.type))builtTowers.splice(i,1);}catch(e){}
 try{const g=safeJson(localStorage.getItem('cyberTD2088Save'),{});if(g&&typeof g==='object'){g.bossGatlingUnlocked=false;if(Array.isArray(g.builtTowers))g.builtTowers=g.builtTowers.filter(m=>m&&!BOSS_MACHINE_IDS.has(m.type));localStorage.setItem('cyberTD2088Save',JSON.stringify(g));}}catch(e){}
 try{const x=safeJson(localStorage.getItem('cyberTD2088ExtraV2'),{});x.inventory=Array.isArray(x.inventory)?x.inventory.filter(m=>m&&!BOSS_MACHINE_IDS.has(m.type)):[];x.dlcs={machineTuning:false,bossExpansion:false};x.bossRewardsClaimed={};localStorage.setItem('cyberTD2088ExtraV2',JSON.stringify(x));}catch(e){}
 try{const s=safeJson(localStorage.getItem('cyberTD2088PurchasedMachinesV3'),[]);if(Array.isArray(s))localStorage.setItem('cyberTD2088PurchasedMachinesV3',JSON.stringify(s.filter(m=>m&&!BOSS_MACHINE_IDS.has(m.type))));}catch(e){}
}
function removeBossDlcElements(){
 const ids=['view-boss-select','view-boss-battle','boss-timer','debug-boss','boss-weapon-select','boss-player-towers','boss-canvas','boss-entity','boss-hp-fill','boss-hp-text','boss-flash','bb-countdown-big','bb-result','bb-bg','bb-fx','td3-boss-cinematic-canvas','cyber-dlc-title-btn','cyber-dlc-game-btn','cyber-dlc-overlay','cyber-custom-overlay','cyber-boss-picker','cyber-boss-anytime-btn','td3-code-panel'];
 ids.forEach(id=>$(id)?.remove());
 document.querySelectorAll('[onclick*="showBossSelection"],[onclick*="startBossBattle"],[onclick*="openDlc"],[data-boss]').forEach(el=>el.remove());
 const primary=document.querySelector('#view-title button[onclick="startGame()"]');if(primary){primary.removeAttribute('onclick');primary.onclick=()=>newCountryWorld();primary.innerHTML='<i class="fa-solid fa-flag"></i> 新しいワールドを建国';}
 const footer=document.querySelector('#view-title .cyber-modal');if(footer&&!$('country-open-load-title')){const load=document.createElement('button');load.id='country-open-load-title';load.className='country-primary-btn';load.style.marginTop='-12px';load.innerHTML='<i class="fa-solid fa-folder-open"></i> ロード / ワールド選択';load.onclick=openLoadScreen;const clear=footer.querySelector('button[onclick="clearSave()"]');footer.insertBefore(load,clear||null);}
 const title=document.querySelector('#view-title h1');if(title)title.innerHTML='国家防衛シミュレーション<br><span style="font-size:.55em;letter-spacing:.15em;color:#76edff">NATION DEFENSE 2088</span>';
 const spawn=$('toggle-spawn-btn');if(spawn)spawn.remove();
}
function warToast(message,warn){if(typeof window.toast==='function'){try{window.toast(String(message),warn?'warn':'info');return;}catch(e){}}let stack=$('country-toast-stack');if(!stack){stack=document.createElement('div');stack.id='country-toast-stack';stack.style.cssText='position:fixed;top:66px;left:50%;transform:translateX(-50%);z-index:160;display:flex;flex-direction:column;align-items:center;gap:7px;pointer-events:none';document.body.appendChild(stack);}const item=document.createElement('div');item.textContent=String(message);item.style.cssText='max-width:min(700px,92vw);padding:9px 15px;border-radius:9px;background:rgba(5,15,31,.96);border:1px solid '+(warn?'#ff627e':'#5cecff')+';color:#effbff;font-size:12px;font-weight:800;box-shadow:0 0 18px '+(warn?'#ff627e26':'#5cecff20');stack.appendChild(item);setTimeout(()=>item.remove(),3100);}
function logEvent(message,kind='info'){nation.log=Array.isArray(nation.log)?nation.log:[];nation.log.unshift({message:String(message),kind,time:Date.now()});nation.log=nation.log.slice(0,8);renderWarLog();}
function showWarAnnouncement(message){if(!warAnnouncement)return;warAnnouncement.textContent=message;warAnnouncement.classList.remove('show');void warAnnouncement.offsetWidth;warAnnouncement.classList.add('show');}
function foreignNameForWave(){return FOREIGN_NATIONS[(Math.max(0,nation.wave-1)+Math.floor(Math.random()*FOREIGN_NATIONS.length))%FOREIGN_NATIONS.length];}
function policyNow(){return POLICY[nation.policy]||POLICY.defense;}
function applyNationData(data){nation=Object.assign(initialCountry(),data&&typeof data==='object'?data:{});if(!POLICY[nation.policy])nation.policy='defense';wasteland=new Set(Array.isArray(nation.wasteland)?nation.wasteland:[]);nation.log=Array.isArray(nation.log)?nation.log:[];if(nation.name)nation.name=String(nation.name).slice(0,32);else nation.name='ピリタマ共和国';}
function openLoadScreen(){ensureLegacyWorld();renderWorldList();const v=$('country-load-screen');if(v)v.hidden=false;}
function closeLoadScreen(){const v=$('country-load-screen');if(v)v.hidden=true;}
function renderWorldList(){
 const list=$('country-world-list');if(!list)return;const worlds=readWorlds().sort((a,b)=>(Number(b.updatedAt)||0)-(Number(a.updatedAt)||0));
 if(!worlds.length){list.innerHTML='<div class="country-panel-card" style="grid-column:1/-1;text-align:center;padding:28px;color:#b8cce3">保存済みのワールドはまだありません。<br>タイトルへ戻り、「新しいワールドを建国」から始めてください。</div>';return;}
 list.innerHTML=worlds.map(w=>{const c=w.country||{};const date=new Date(Number(w.updatedAt||w.createdAt)||Date.now()).toLocaleString('ja-JP');const name=(w.name||c.name||'無名国家').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));const policy=POLICY[c.policy]?.label||'防衛重視';const waves=Number(c.wave)||0;return `<article class="country-world-card"><div class="country-world-name"><i class="fa-solid fa-earth-asia" style="color:#5cecff;margin-right:7px"></i>${name}</div><div class="country-world-meta">最終プレイ：${date}<br>国家方針：${policy}　/　防衛波数：${waves}<br>ワールドID：${w.id}</div><div class="country-world-actions"><button data-load-world="${w.id}" style="flex:1"><i class="fa-solid fa-folder-open"></i> ロード</button><button class="delete" data-delete-world="${w.id}" title="このワールドを削除"><i class="fa-solid fa-trash"></i></button></div></article>`;}).join('');
 list.querySelectorAll('[data-load-world]').forEach(b=>b.onclick=()=>loadWorld(b.dataset.loadWorld));list.querySelectorAll('[data-delete-world]').forEach(b=>b.onclick=()=>deleteWorld(b.dataset.deleteWorld));
}
function deleteWorld(id){if(id===currentWorldId&&$('view-game')&&!$('view-game').classList.contains('hidden')){warToast('プレイ中のワールドは削除できません。先にタイトルへ戻ってください。',true);return;}const worlds=readWorlds().filter(w=>w.id!==id);writeWorlds(worlds);if(id===currentWorldId)currentWorldId=null;if(!worlds.length)clearGameStorage();renderWorldList();warToast('ワールドを削除しました。',false);}
function newCountryWorld(){
 ensureLegacyWorld();if(gameStartedOnce)saveCurrentWorld();const id='world-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);currentWorldId=id;applyNationData(initialCountry());nation.name='ピリタマ共和国';invasionClock=0;incomeClock=0;missileFlights=[];impactBursts=[];lastWarUiBucket=-1;clearGameStorage();makeStarterData();closeLoadScreen();
 const t=$('view-title');if(t)t.classList.add('hidden');
 if(!gameStartedOnce){window.startGame();}else{enterRunningWorld(true);}
 logEvent('新しい国家が建国されました。国境を防衛し、国家を発展させましょう。','ok');showWarAnnouncement('新国家樹立 — 国境防衛システム起動');saveCurrentWorld();
}
function loadWorld(id){
 saveCurrentWorld();const w=readWorlds().find(x=>x.id===id);if(!w){warToast('ワールドが見つかりません。',true);renderWorldList();return;}currentWorldId=id;restoreStorage(w.storage||{});applyNationData(w.country||initialCountry());invasionClock=0;incomeClock=0;missileFlights=[];impactBursts=[];lastWarUiBucket=-1;closeLoadScreen();
 if(!gameStartedOnce){const title=$('view-title');if(title)title.classList.add('hidden');window.startGame();}
 else{enterRunningWorld(true);}
 logEvent('ワールド「'+nation.name+'」をロードしました。','ok');showWarAnnouncement('ワールド読込完了 — '+nation.name);saveCurrentWorld();
}
function enterRunningWorld(alreadyLoaded){
 const title=$('view-title');if(title)title.classList.add('hidden');const game=$('view-game');if(game)game.classList.remove('hidden');
 if(alreadyLoaded&&typeof window.loadGame==='function')window.loadGame();
 cleanLegacyBossData();isSpawning=false;enemies.length=0;particles.length=0;
 if(typeof window.initGrid==='function')window.initGrid();if(typeof window.renderFooter==='function')window.renderFooter();if(typeof window.updateUI==='function')window.updateUI();if(typeof window.resizeCanvas==='function')window.resizeCanvas();

removeBossDlcElements=function(){geoBaseRemoveBossDlcElements();if(!$('view-boss-select')){const guard=document.createElement('div');guard.id='view-boss-select';guard.className='hidden';guard.setAttribute('aria-hidden','true');document.body.appendChild(guard);}if(!$('view-boss-battle')){const guard=document.createElement('div');guard.id='view-boss-battle';guard.className='hidden';guard.setAttribute('aria-hidden','true');document.body.appendChild(guard);}};
/* Make tank and economic buildings purchasable without requiring DLC/shop inventory items. */
const GEO_EXTRA_MACHINE_IDS=new Set(['tank','farm','office','factory','housing']);
const geoBaseRenderFooter=window.renderFooter;
window.renderFooter=function(){const result=typeof geoBaseRenderFooter==='function'?geoBaseRenderFooter.apply(this,arguments):undefined;const footer=$('tower-footer');if(!footer)return result;for(const id of GEO_EXTRA_MACHINE_IDS){const t=TOWER_TYPES[id];if(!t)continue;let card=footer.querySelector(`[data-geo-machine="${id}"]`);if(!card){card=document.createElement('div');card.dataset.geoMachine=id;card.className='tower-card geo-extra-machine min-w-[104px] h-20 flex flex-col items-center justify-center gap-1';card.style.borderColor='rgba(100,116,139,.3)';footer.appendChild(card);}const selected=selectedTowerType===id;card.classList.toggle('selected',selected);card.style.borderColor=selected?t.color:'rgba(100,116,139,.3)';card.style.boxShadow=selected?`0 0 16px ${t.color}55`:'';card.innerHTML=`<i class="fa-solid ${t.icon} text-2xl" style="color:${t.color}"></i><div class="text-[10px] font-bold text-white tracking-wider">${t.name}</div><div class="text-[10px]" style="color:#ffde00">¥${Number(t.cost).toLocaleString('ja-JP')} · 建設</div>`;card.title=`${t.name}を¥${Number(t.cost).toLocaleString('ja-JP')}で建設`;card.onclick=()=>{selectedTowerType=id;window.renderFooter();warToast(`${t.name}を選択しました。空きマスをクリックして建設してください。`,false);};}return result;};
const geoBaseHandleCellClick=window.handleCellClick;
window.handleCellClick=function(x,y,cell){const type=selectedTowerType,t=TOWER_TYPES[type];if(GEO_EXTRA_MACHINE_IDS.has(type)&&t){const existing=builtTowers.find(v=>v.x===x&&v.y===y);if(existing)return typeof geoBaseHandleCellClick==='function'?geoBaseHandleCellClick.apply(this,arguments):undefined;if(Number(gold)<Number(t.cost)){warToast(`資金不足です。${t.name}の建設には¥${Number(t.cost).toLocaleString('ja-JP')}必要です。`,true);return;}gold-=Number(t.cost);const unit={id:'geo-build-'+Math.random().toString(36).slice(2,11),type,x,y,level:1,dmg:Number(t.dmg)||0,range:Number(t.range)||0,cooldown:type==='missile'?1e9:0};builtTowers.push(unit);window.renderTowerDOM(cell,unit);if(typeof window.updateUI==='function')window.updateUI();if(typeof window.renderFooter==='function')window.renderFooter();try{spawnParticle(x,y,'build');}catch(e){}if(typeof window.saveGame==='function')window.saveGame();updateWarUI();logEvent(`${t.name}を建設しました。${t.income?'施設収入 +¥'+Number(t.income).toLocaleString('ja-JP')+' / 秒':'軍事力を増強しました。'}`,'ok');warToast(`${t.name}を建設しました。`,false);return;}return typeof geoBaseHandleCellClick==='function'?geoBaseHandleCellClick.apply(this,arguments):undefined;};

/* Ignore the starter placeholder written by older initialization code; only migrate a real save. */
const geoBaseEnsureLegacyWorld=ensureLegacyWorld;
ensureLegacyWorld=function(){if(readWorlds().length)return;let raw=null,state=null;try{raw=localStorage.getItem('cyberTD2088Save');state=raw?JSON.parse(raw):null;}catch(e){}const isRealSave=!!state&&typeof state==='object'&&(('gold' in state)||('playerHealth' in state)||Array.isArray(state.builtTowers));if(!isRealSave)return;return geoBaseEnsureLegacyWorld();};

function boot(){document.title='国家防衛シミュレーション 2088';removeBossDlcAndDisable();configureMachineNames();setupLoadScreen();installGridListener();const primary=document.querySelector('#view-title button[onclick="startGame()"]');if(primary){primary.removeAttribute('onclick');primary.onclick=()=>newCountryWorld();primary.innerHTML='<i class="fa-solid fa-flag"></i> 新しいワールドを建国';}const title=$('view-title');if(title){const h=title.querySelector('h1');if(h)h.innerHTML='国家防衛シミュレーション<br><span style="font-size:.55em;letter-spacing:.15em;color:#76edff">NATION DEFENSE 2088</span>';}
 const modal=$('#view-title .cyber-modal');if(modal){const clear=modal.querySelector('button[onclick="clearSave()"]');if(clear)clear.textContent='旧セーブを初期化';if(!$('country-open-load-title')){const b=document.createElement('button');b.id='country-open-load-title';b.className='country-primary-btn';b.innerHTML='<i class="fa-solid fa-folder-open"></i> ロード / ワールド選択';b.style.marginTop='-12px';b.onclick=openLoadScreen;modal.insertBefore(b,clear||null);}}
 const game=$('view-game');if(game){const main=game.querySelector(':scope > div.flex-1.flex.min-h-0.relative');if(main){main.classList.add('country-main-layout');if(main.firstElementChild)main.firstElementChild.classList.add('country-playfield');}}
 scrubShopUi();
}
// 既存機能は起動時に一度整理します。無限のDOM監視ループを避け、旧BOSS/DLC画面は公開関数側でも無効化しています。
window.addEventListener('load',()=>{boot();});boot();
})();
</script>
