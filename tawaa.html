<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER TOWER DEFENSE 2088</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#050814', neon: { blue: '#00f0ff', purple: '#b026ff', yellow: '#ffde00', pink: '#ff007f', green: '#00ff66' }
                    }, fontFamily: { cyber: ['Orbitron', 'sans-serif'], jp: ['Noto Sans JP', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        :root { --neon-blue: #00f0ff; --neon-purple: #b026ff; --neon-yellow: #ffde00; --neon-pink: #ff007f; --neon-green: #00ff66; --bg-dark: #050814; }
        body { background-color: var(--bg-dark); color: white; font-family: 'Noto Sans JP', sans-serif; overflow: hidden; user-select: none; }
        .font-cyber { font-family: 'Orbitron', sans-serif; letter-spacing: 0.05em; }
        .cyber-modal { background: rgba(10, 15, 36, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(0, 240, 255, 0.5); box-shadow: 0 0 20px rgba(0, 240, 255, 0.2), inset 0 0 20px rgba(0, 240, 255, 0.1); border-radius: 12px; }
        .text-glow-blue { text-shadow: 0 0 10px var(--neon-blue); }
        .text-glow-pink { text-shadow: 0 0 10px var(--neon-pink); }
        .text-glow-yellow { text-shadow: 0 0 10px var(--neon-yellow); }
        .btn-campaign { background: linear-gradient(90deg, #1e3a8a 0%, #00f0ff 100%); border: 1px solid rgba(255, 255, 255, 0.3); box-shadow: 0 4px 15px rgba(0, 240, 255, 0.4); transition: all 0.3s ease; }
        .btn-boss { background: linear-gradient(90deg, #8a1e1e 0%, #ff007f 100%); border: 1px solid rgba(255, 255, 255, 0.3); box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4); transition: all 0.3s ease; }
        .game-grid { display: grid; grid-template-columns: repeat(20, 1fr); grid-template-rows: repeat(10, 1fr); gap: 2px; background-color: rgba(0, 240, 255, 0.05); border: 1px solid rgba(0, 240, 255, 0.2); padding: 2px; border-radius: 8px; }
        .grid-cell { background-color: rgba(10, 15, 30, 0.8); border: 1px solid rgba(0, 240, 255, 0.1); border-radius: 4px; position: relative; }
        .grid-cell.buildable:hover { background-color: rgba(255, 255, 255, 0.1); cursor: pointer; box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.2); }
        .grid-cell.path { background-color: rgba(0, 240, 255, 0.15); border-color: rgba(0, 240, 255, 0.6); box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.4), 0 0 5px rgba(0, 240, 255, 0.4); z-index: 10; }
        .tower { position: absolute; top: 10%; left: 10%; right: 10%; bottom: 10%; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 10px currentColor; animation: pulse-glow 2s infinite alternate; }
        @keyframes pulse-glow { from { filter: brightness(1); box-shadow: 0 0 5px currentColor; } to { filter: brightness(1.3); box-shadow: 0 0 15px currentColor; } }
        .tower-card { background: rgba(20, 25, 45, 0.7); border: 2px solid rgba(100, 116, 139, 0.3); border-radius: 8px; cursor: pointer; transition: all 0.2s; }
        .tower-card:hover { border-color: rgba(255, 255, 255, 0.5); }
        .tower-card.selected { background: rgba(0, 0, 0, 0.8); transform: scale(1.05); border-width: 2px; }
        
        /* Specific selection effects injected via inline styles in JS */
        
        #game-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }
        .boss-hp-bar { transition: width 0.1s linear; }
    </style>
</head>
<body>
    <div id="view-title" class="w-full h-screen flex items-center justify-center relative z-50">
        <div class="cyber-modal w-[480px] p-8 flex flex-col gap-6 relative z-10">
            <h1 class="text-4xl text-center font-cyber font-bold text-glow-blue text-neon-blue mb-4">CYBER TD<br>2088</h1>
            <button onclick="startGame()" class="btn-campaign w-full py-4 rounded-lg font-bold text-lg flex items-center justify-center gap-2 cursor-pointer active:scale-95 hover:scale-[1.02]">
                <i class="fa-solid fa-play"></i> プレイ / ロード
            </button>
            <button onclick="clearSave()" class="text-sm text-gray-400 hover:text-white transition-colors">
                セーブデータを初期化
            </button>
        </div>
    </div>

    <div id="view-game" class="hidden w-full h-screen flex flex-col relative">
        <header class="h-14 bg-gray-950/80 border-b border-cyan-900/50 flex items-center justify-between px-6 z-20">
            <div class="flex items-center gap-6 font-cyber text-lg">
                <span class="font-bold text-neon-pink text-glow-pink"><i class="fa-solid fa-heart mr-2"></i><span id="health-display">20/20</span></span>
                <span class="font-bold text-neon-yellow text-glow-yellow"><i class="fa-solid fa-coins mr-2"></i><span id="gold-display">350</span></span>
            </div>
            <div class="flex items-center gap-4">
                <div id="boss-timer" class="font-cyber text-neon-blue text-sm mr-4">BOSS DETECT: SCANNING...</div>
                <button id="toggle-spawn-btn" onclick="toggleSpawning()" class="px-4 py-1 bg-red-900/50 text-red-400 border border-red-500 rounded font-bold cursor-pointer transition-colors shadow-[0_0_10px_rgba(255,0,0,0.3)]">敵襲来: OFF</button>
                <button onclick="showBossSelection()" class="hidden px-4 py-1 bg-purple-900/50 text-purple-400 border border-purple-500 rounded font-bold cursor-pointer transition-colors" id="debug-boss">TEST BOSS</button>
            </div>
        </header>
        
        <div class="flex-1 flex min-h-0 relative bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-blue-900/20 via-gray-950 to-gray-950">
            <div class="flex-1 flex items-center justify-center p-4 relative w-full h-full">
                <!-- Relative container for grid and canvas overlay -->
                <div class="w-full max-w-7xl aspect-[2/1] relative">
                    <div class="absolute inset-0 game-grid z-10" id="game-grid"></div>
                    <!-- SVG Path layer -->
                    <svg id="path-svg" class="absolute inset-0 w-full h-full pointer-events-none z-20"></svg>
                    <!-- Canvas for enemies and projectiles -->
                    <canvas id="game-canvas" class="absolute inset-0 w-full h-full pointer-events-none z-30"></canvas>
                </div>
            </div>
        </div>

        <footer id="tower-footer" class="h-28 bg-gray-950/95 border-t border-cyan-900/50 flex items-center justify-start gap-3 px-4 z-20 overflow-x-auto relative">
            <!-- Tower cards dynamically injected here -->
        </footer>
    </div>

    <div id="view-boss-select" class="hidden absolute inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center">
        <div class="cyber-modal w-[600px] p-8 flex flex-col gap-6 text-center border-neon-pink shadow-[0_0_30px_rgba(255,0,127,0.3)]">
            <h2 class="text-3xl font-cyber font-bold text-glow-pink text-neon-pink">WARNING: BOSS DETECTED</h2>
            <p class="text-gray-300">防衛タワーを3つ選択し、巨大ボスを迎撃せよ！</p>
            
            <div id="boss-weapon-select" class="grid grid-cols-4 gap-3">
                <!-- Selectable weapons injected here -->
            </div>
            
            <div class="text-sm text-cyan-400">選択済み: <span id="boss-select-count" class="font-bold text-white">0</span> / 3</div>
            
            <button id="btn-start-boss" onclick="startBossBattle()" disabled class="btn-boss w-full py-4 rounded-lg font-bold text-lg flex items-center justify-center gap-2 cursor-pointer disabled:opacity-50 disabled:grayscale disabled:cursor-not-allowed">
                <i class="fa-solid fa-skull"></i> 迎撃開始
            </button>
        </div>
    </div>

    <div id="view-boss-battle" class="hidden w-full h-screen flex flex-col relative bg-gray-950 items-center justify-center bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]">
        <div class="absolute inset-0 bg-gradient-to-b from-red-900/20 to-black pointer-events-none"></div>
        
        <div class="w-full max-w-4xl flex flex-col gap-8 z-10 p-8">
            <!-- Boss Area -->
            <div class="flex flex-col items-center gap-4">
                <h3 class="font-cyber text-2xl text-neon-pink text-glow-pink animate-pulse">CYBER TITAN "OMEGA"</h3>
                <div class="w-full h-8 bg-gray-900 border-2 border-red-500/50 rounded-full overflow-hidden relative">
                    <div id="boss-hp-fill" class="h-full bg-gradient-to-r from-red-600 to-neon-pink boss-hp-bar w-full"></div>
                    <div id="boss-hp-text" class="absolute inset-0 flex items-center justify-center font-bold font-cyber text-sm">5000 / 5000</div>
                </div>
                <!-- Boss Sprite -->
                <div id="boss-entity" class="w-32 h-32 bg-gray-800 border-4 border-neon-pink rounded-xl flex items-center justify-center shadow-[0_0_30px_rgba(255,0,127,0.5)] mt-4 relative">
                    <i class="fa-solid fa-robot text-6xl text-neon-pink"></i>
                    <!-- Hit flashes overlay -->
                    <div id="boss-flash" class="absolute inset-0 bg-white opacity-0 rounded-lg pointer-events-none transition-opacity duration-100"></div>
                </div>
            </div>

            <!-- VS Divider -->
            <div class="text-center font-cyber text-gray-500 font-bold text-xl my-4">VS</div>

            <!-- Player Selected Towers Area -->
            <div id="boss-player-towers" class="flex justify-center gap-12">
                <!-- Injected selected towers -->
            </div>
            
            <div class="text-center mt-8">
                <canvas id="boss-canvas" class="absolute inset-0 w-full h-full pointer-events-none z-0"></canvas>
            </div>
        </div>
    </div>

    <script>
        // --- GAME CONSTANTS & STATE ---
        const GRID_W = 20;
        const GRID_H = 10;
        
        // 1. Dynamic Longer Path
        const pathCoords = [
            {x:0, y:1}, {x:1, y:1}, {x:2, y:1}, {x:3, y:1}, {x:4, y:1}, {x:5, y:1}, {x:6, y:1}, {x:7, y:1}, {x:8, y:1}, {x:9, y:1},
            {x:9, y:2}, {x:9, y:3}, {x:9, y:4}, {x:8, y:4}, {x:7, y:4}, {x:6, y:4}, {x:5, y:4}, {x:4, y:4}, {x:3, y:4}, {x:2, y:4},
            {x:2, y:5}, {x:2, y:6}, {x:2, y:7}, {x:3, y:7}, {x:4, y:7}, {x:5, y:7}, {x:6, y:7}, {x:7, y:7}, {x:8, y:7}, {x:9, y:7},
            {x:10, y:7}, {x:11, y:7}, {x:12, y:7}, {x:13, y:7}, {x:14, y:7}, {x:15, y:7}, {x:16, y:7}, {x:16, y:6}, {x:16, y:5},
            {x:16, y:4}, {x:16, y:3}, {x:16, y:2}, {x:17, y:2}, {x:18, y:2}, {x:19, y:2}
        ];

        // 3. More Weapons (Sniper, Poison added. BossGatling hidden initially)
        const TOWER_TYPES = {
            machineGun: { id:'machineGun', name:'マシンガン', cost: 50, dmg: 10, range: 2.5, rate: 20, color: '#00ff66', icon: 'fa-crosshairs' },
            laser:      { id:'laser', name:'レーザー', cost: 100, dmg: 25, range: 3.5, rate: 40, color: '#00f0ff', icon: 'fa-bolt' },
            plasma:     { id:'plasma', name:'プラズマ', cost: 150, dmg: 50, range: 3, rate: 60, color: '#ffde00', icon: 'fa-sun' },
            missile:    { id:'missile', name:'ミサイル', cost: 200, dmg: 120, range: 4.5, rate: 100, color: '#ff007f', icon: 'fa-rocket' },
            emp:        { id:'emp', name:'EMP', cost: 250, dmg: 5, range: 3.5, rate: 50, color: '#b026ff', icon: 'fa-satellite-dish', effect: 'slow' },
            sniper:     { id:'sniper', name:'スナイパー', cost: 300, dmg: 200, range: 8, rate: 150, color: '#ffffff', icon: 'fa-crosshairs' },
            poison:     { id:'poison', name:'ポイズン', cost: 120, dmg: 5, range: 2.5, rate: 30, color: '#a3e635', icon: 'fa-biohazard', effect: 'poison' },
            bossGatling:{ id:'bossGatling', name:'ボスガトリング', cost: 800, dmg: 80, range: 5, rate: 10, color: '#ff4500', icon: 'fa-fire', secret: true }
        };

        // State variables
        let gold = 350;
        let playerHealth = 20;
        let builtTowers = [];
        let enemies = [];
        let particles = [];
        
        let selectedTowerType = 'machineGun';
        let isSpawning = false; // 4. Manual Spawning
        let bossGatlingUnlocked = false;
        
        // Loop controls
        let gameLoopId;
        let lastTime = 0;
        let spawnTimer = 0;
        
        // Boss State
        let lastBossMinute = -1;
        let selectedBossWeapons = [];
        let bossData = { hp: 5000, maxHp: 5000 };
        let bossBattleInterval = null;

        // --- DOM Elements ---
        const uiGold = document.getElementById('gold-display');
        const uiHealth = document.getElementById('health-display');
        const gridEl = document.getElementById('game-grid');
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const btnSpawn = document.getElementById('toggle-spawn-btn');

        // 2. Auto-Save via localStorage
        function saveGame() {
            const state = {
                gold, playerHealth, builtTowers, bossGatlingUnlocked
            };
            localStorage.setItem('cyberTD2088Save', JSON.stringify(state));
            
            // Show brief flash on gold text to indicate save
            uiGold.classList.add('text-white');
            setTimeout(() => uiGold.classList.remove('text-white'), 300);
        }

        function loadGame() {
            const saved = localStorage.getItem('cyberTD2088Save');
            if (saved) {
                try {
                    const state = JSON.parse(saved);
                    gold = state.gold ?? 350;
                    playerHealth = state.playerHealth ?? 20;
                    builtTowers = state.builtTowers ?? [];
                    bossGatlingUnlocked = state.bossGatlingUnlocked ?? false;
                } catch (e) {
                    console.error("Save load failed", e);
                }
            }
        }

        function clearSave() {
            localStorage.removeItem('cyberTD2088Save');
            // Flash red UI briefly
            document.querySelector('.cyber-modal').style.borderColor = 'red';
            setTimeout(() => { document.querySelector('.cyber-modal').style.borderColor = 'rgba(0, 240, 255, 0.5)'; }, 500);
        }

        function startGame() {
            document.getElementById('view-title').classList.add('hidden');
            document.getElementById('view-game').classList.remove('hidden');
            
            loadGame();
            initGrid();
            renderFooter();
            updateUI();
            
            // Resize canvas to fit grid
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            
            // Auto save every 10 seconds
            setInterval(saveGame, 10000);
            
            // Start main loop
            requestAnimationFrame(gameLoop);
        }

        function resizeCanvas() {
            canvas.width = gridEl.clientWidth;
            canvas.height = gridEl.clientHeight;
        }

        function initGrid() {
            gridEl.innerHTML = '';
            drawContinuousPathLine(gridEl);

            for (let y = 0; y < GRID_H; y++) {
                for (let x = 0; x < GRID_W; x++) {
                    const cell = document.createElement('div');
                    const isPath = pathCoords.some(p => p.x === x && p.y === y);
                    cell.className = `grid-cell ${isPath ? 'path' : 'buildable'} flex items-center justify-center`;
                    
                    if (!isPath) {
                        cell.onclick = () => handleCellClick(x, y, cell);
                    }
                    gridEl.appendChild(cell);

                    // Re-render towers if loaded
                    const existingTower = builtTowers.find(t => t.x === x && t.y === y);
                    if (existingTower) {
                        renderTowerDOM(cell, existingTower);
                    }
                }
            }
        }

        // 1. Dynamic SVG Path drawing
        function drawContinuousPathLine(container) {
            const svg = document.getElementById('path-svg');
            svg.innerHTML = '';
            let d = '';
            
            pathCoords.forEach((p, i) => {
                // Calculate percentage positions based on grid structure
                const cx = (p.x + 0.5) * (100 / GRID_W);
                const cy = (p.y + 0.5) * (100 / GRID_H);
                if(i === 0) d += `M ${cx}% ${cy}% `;
                else d += `L ${cx}% ${cy}% `;
            });
            
            const pathNode = document.createElementNS("http://www.w3.org/2000/svg", "path");
            pathNode.setAttribute('d', d);
            pathNode.setAttribute('stroke', 'rgba(0, 240, 255, 0.4)');
            pathNode.setAttribute('stroke-width', '8');
            pathNode.setAttribute('stroke-linecap', 'round');
            pathNode.setAttribute('stroke-linejoin', 'round');
            pathNode.setAttribute('fill', 'none');
            pathNode.style.filter = "drop-shadow(0 0 8px rgba(0, 240, 255, 0.8))";
            
            // Add animated dashed stroke for cyber feel
            pathNode.setAttribute('stroke-dasharray', '10 15');
            
            const animate = document.createElementNS("http://www.w3.org/2000/svg", "animate");
            animate.setAttribute('attributeName', 'stroke-dashoffset');
            animate.setAttribute('values', '100;0');
            animate.setAttribute('dur', '2s');
            animate.setAttribute('repeatCount', 'indefinite');
            pathNode.appendChild(animate);
            
            svg.appendChild(pathNode);
        }

        function renderFooter() {
            const footer = document.getElementById('tower-footer');
            footer.innerHTML = '';
            
            Object.values(TOWER_TYPES).forEach(t => {
                if (t.secret && !bossGatlingUnlocked) return;
                
                const card = document.createElement('div');
                const isSel = selectedTowerType === t.id;
                card.className = `tower-card min-w-[90px] h-20 flex flex-col items-center justify-center gap-1 ${isSel ? 'selected' : ''}`;
                card.style.borderColor = isSel ? t.color : 'rgba(100,116,139,0.3)';
                if (isSel) card.style.boxShadow = `0 0 15px ${t.color}66`;
                
                card.innerHTML = `
                    <i class="fa-solid ${t.icon} text-2xl" style="color:${t.color}"></i>
                    <div class="text-[10px] font-bold text-white tracking-wider">${t.name}</div>
                    <div class="text-xs text-yellow-400 font-cyber">¥${t.cost}</div>
                `;
                card.onclick = () => {
                    selectedTowerType = t.id;
                    renderFooter();
                };
                footer.appendChild(card);
            });
        }

        function updateUI() {
            uiGold.innerText = Math.floor(gold);
            uiHealth.innerText = `${playerHealth}/20`;
        }

        // 4. Toggle Manual Spawning
        function toggleSpawning() {
            isSpawning = !isSpawning;
            if (isSpawning) {
                btnSpawn.innerText = "敵襲来: ON";
                btnSpawn.className = "px-4 py-1 bg-green-900/50 text-green-400 border border-green-500 rounded font-bold cursor-pointer transition-colors shadow-[0_0_10px_rgba(0,255,0,0.3)]";
            } else {
                btnSpawn.innerText = "敵襲来: OFF";
                btnSpawn.className = "px-4 py-1 bg-red-900/50 text-red-400 border border-red-500 rounded font-bold cursor-pointer transition-colors shadow-[0_0_10px_rgba(255,0,0,0.3)]";
            }
        }

        // 5. Tower Placement and Upgrades
        function handleCellClick(x, y, cellElement) {
            const existingTower = builtTowers.find(t => t.x === x && t.y === y);
            
            if (existingTower) {
                // Upgrade Logic
                const tBase = TOWER_TYPES[existingTower.type];
                const upgradeCost = tBase.cost * existingTower.level;
                
                if (gold >= upgradeCost) {
                    gold -= upgradeCost;
                    existingTower.level++;
                    existingTower.dmg = tBase.dmg * existingTower.level * 1.2; // slight damage scalar
                    existingTower.range = tBase.range + (existingTower.level * 0.2);
                    
                    updateUI();
                    renderTowerDOM(cellElement, existingTower); // Refresh DOM to show Lv
                    saveGame();
                    spawnParticle(x, y, 'upgrade');
                } else {
                    // Custom non-alert error via DOM effect
                    cellElement.style.backgroundColor = 'rgba(255,0,0,0.3)';
                    setTimeout(() => cellElement.style.backgroundColor = '', 200);
                }
            } else {
                // Build Logic
                const tBase = TOWER_TYPES[selectedTowerType];
                if (gold >= tBase.cost) {
                    gold -= tBase.cost;
                    
                    const tower = {
                        id: Math.random().toString(36).substr(2, 9),
                        type: selectedTowerType,
                        x: x, y: y,
                        level: 1,
                        dmg: tBase.dmg,
                        range: tBase.range,
                        cooldown: 0
                    };
                    
                    builtTowers.push(tower);
                    renderTowerDOM(cellElement, tower);
                    updateUI();
                    saveGame();
                    spawnParticle(x, y, 'build');
                }
            }
        }

        function renderTowerDOM(cell, tower) {
            const tBase = TOWER_TYPES[tower.type];
            cell.innerHTML = '';
            const tEl = document.createElement('div');
            tEl.className = 'tower';
            tEl.style.color = tBase.color;
            tEl.innerHTML = `
                <i class="fa-solid ${tBase.icon} text-lg"></i>
                <div class="absolute -bottom-2 -right-2 text-[9px] bg-gray-900 text-white px-1 border rounded font-cyber" style="border-color:${tBase.color};">Lv${tower.level}</div>
            `;
            cell.appendChild(tEl);
        }

        function spawnEnemy() {
            const hp = 50 + (Math.random() * 100);
            enemies.push({
                hp: hp,
                maxHp: hp,
                speed: 1.5 + Math.random(), // units per second
                progress: 0, // index in pathCoords
                poison: 0
            });
        }

        // Utility: grid coord to canvas pixels
        function getPixelPos(gx, gy) {
            const cellW = canvas.width / GRID_W;
            const cellH = canvas.height / GRID_H;
            return {
                x: (gx + 0.5) * cellW,
                y: (gy + 0.5) * cellH
            };
        }

        function spawnParticle(gx, gy, type) {
            // simplified particle handling
            const pos = getPixelPos(gx, gy);
            particles.push({
                x: pos.x, y: pos.y, 
                type: type, 
                life: 1.0,
                vx: (Math.random() - 0.5) * 50,
                vy: (Math.random() - 0.5) * 50
            });
        }

        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            // 6. Boss 5-min Check
            checkBossEvent();

            // Only update main logic if view-game is active (not in boss battle)
            if (!document.getElementById('view-game').classList.contains('hidden')) {
                updateGame(dt);
                drawGame();
            }

            requestAnimationFrame(gameLoop);
        }

        function updateGame(dt) {
            if (isSpawning) {
                spawnTimer += dt;
                if (spawnTimer > 1.5) {
                    spawnEnemy();
                    spawnTimer = 0;
                }
            }

            // Update enemies
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                
                // Poison effect
                if (e.poison > 0) {
                    e.hp -= e.poison * dt * 10;
                    e.poison -= dt;
                }

                e.progress += (e.speed * dt);
                const pathIdx = Math.floor(e.progress);
                
                if (pathIdx >= pathCoords.length - 1) {
                    // Reached end
                    playerHealth = Math.max(0, playerHealth - 1);
                    updateUI();
                    enemies.splice(i, 1);
                    if (playerHealth <= 0) {
                        alert("GAME OVER!"); // standard native alert for hard fail ok, but user requested no alert. 
                        // Let's just reset instead
                        playerHealth = 20; gold = 350; builtTowers = []; saveGame(); location.reload();
                    }
                    continue;
                }

                if (e.hp <= 0) {
                    gold += 10;
                    updateUI();
                    const cp = pathCoords[pathIdx];
                    spawnParticle(cp.x, cp.y, 'explosion');
                    enemies.splice(i, 1);
                }
            }

            // Update towers
            builtTowers.forEach(tower => {
                const tBase = TOWER_TYPES[tower.type];
                if (tower.cooldown > 0) {
                    tower.cooldown -= dt * 60; // normalize to ~frames
                } else {
                    // Find target
                    const tPos = getPixelPos(tower.x, tower.y);
                    const cellW = canvas.width / GRID_W;
                    const pixelRange = tower.range * cellW;
                    
                    let target = null;
                    let targetDist = Infinity;
                    
                    // Simple logic: target closest to tower
                    for (let e of enemies) {
                        const pathIdx = Math.floor(e.progress);
                        if (pathIdx >= pathCoords.length) continue;
                        const p1 = pathCoords[pathIdx];
                        const p2 = pathCoords[Math.min(pathIdx+1, pathCoords.length-1)];
                        const fract = e.progress - pathIdx;
                        
                        const ex = p1.x + (p2.x - p1.x) * fract;
                        const ey = p1.y + (p2.y - p1.y) * fract;
                        
                        const ep = getPixelPos(ex, ey);
                        const dist = Math.hypot(ep.x - tPos.x, ep.y - tPos.y);
                        
                        if (dist <= pixelRange && dist < targetDist) {
                            target = e;
                            targetDist = dist;
                            // Attach pixel coords for drawing laser
                            target.px = ep.x; target.py = ep.y;
                        }
                    }

                    if (target) {
                        target.hp -= tower.dmg;
                        if (tBase.effect === 'poison') target.poison = 3;
                        if (tBase.effect === 'slow') target.speed = Math.max(0.5, target.speed - 0.5);
                        
                        tower.cooldown = tBase.rate;
                        
                        // Draw shot line via particles system trick
                        particles.push({
                            x: tPos.x, y: tPos.y,
                            tx: target.px, ty: target.py,
                            type: 'laser',
                            color: tBase.color,
                            life: 0.2
                        });
                    }
                }
            });
            
            // Update particles
            particles.forEach(p => {
                p.life -= dt * 2;
                if(p.type === 'explosion' || p.type === 'upgrade' || p.type === 'build') {
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                }
            });
            particles = particles.filter(p => p.life > 0);
        }

        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw Enemies
            enemies.forEach(e => {
                const pathIdx = Math.floor(e.progress);
                if (pathIdx >= pathCoords.length) return;
                const p1 = pathCoords[pathIdx];
                const p2 = pathCoords[Math.min(pathIdx+1, pathCoords.length-1)];
                const fract = e.progress - pathIdx;
                
                const ex = p1.x + (p2.x - p1.x) * fract;
                const ey = p1.y + (p2.y - p1.y) * fract;
                const pos = getPixelPos(ex, ey);
                
                ctx.fillStyle = e.poison > 0 ? '#a3e635' : '#ff0055';
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 6, 0, Math.PI*2);
                ctx.fill();
                ctx.shadowColor = ctx.fillStyle;
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.shadowBlur = 0; // reset
                
                // HP bar
                ctx.fillStyle = 'black';
                ctx.fillRect(pos.x - 10, pos.y - 12, 20, 3);
                ctx.fillStyle = '#00ff66';
                ctx.fillRect(pos.x - 10, pos.y - 12, 20 * (e.hp / e.maxHp), 3);
            });
            
            // Draw Lasers/Particles
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                if (p.type === 'laser') {
                    ctx.strokeStyle = p.color;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(p.tx, p.ty);
                    ctx.stroke();
                } else {
                    ctx.fillStyle = p.type === 'upgrade' ? '#00f0ff' : '#ffde00';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
                    ctx.fill();
                }
            });
            ctx.globalAlpha = 1.0;
        }

        function checkBossEvent() {
            const jstDate = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Tokyo' }));
            const min = jstDate.getMinutes();
            
            // Update UI Tracker
            const nextBoss = 5 - (min % 5);
            document.getElementById('boss-timer').innerText = `NEXT BOSS: ${nextBoss} MIN`;
            
            if (min % 5 === 0 && lastBossMinute !== min) {
                lastBossMinute = min;
                showBossSelection();
            }
        }

        function showBossSelection() {
            // Pause spawning
            isSpawning = false;
            toggleSpawning(); // update UI to OFF
            
            document.getElementById('view-boss-select').classList.remove('hidden');
            
            const container = document.getElementById('boss-weapon-select');
            container.innerHTML = '';
            selectedBossWeapons = [];
            
            Object.values(TOWER_TYPES).forEach(t => {
                if (t.secret && !bossGatlingUnlocked) return;
                
                const btn = document.createElement('div');
                btn.className = 'p-3 border border-gray-600 rounded cursor-pointer hover:border-cyan-400 transition-all flex flex-col items-center justify-center';
                btn.innerHTML = `<i class="fa-solid ${t.icon} text-2xl mb-2" style="color:${t.color}"></i><span class="text-xs font-bold text-gray-300">${t.name}</span>`;
                
                btn.onclick = () => {
                    const idx = selectedBossWeapons.indexOf(t);
                    if (idx > -1) {
                        selectedBossWeapons.splice(idx, 1);
                        btn.classList.remove('border-neon-pink', 'bg-pink-900/30', 'shadow-[0_0_10px_rgba(255,0,127,0.3)]');
                    } else if (selectedBossWeapons.length < 3) {
                        selectedBossWeapons.push(t);
                        btn.classList.add('border-neon-pink', 'bg-pink-900/30', 'shadow-[0_0_10px_rgba(255,0,127,0.3)]');
                    }
                    
                    document.getElementById('boss-select-count').innerText = selectedBossWeapons.length;
                    document.getElementById('btn-start-boss').disabled = selectedBossWeapons.length !== 3;
                };
                
                container.appendChild(btn);
            });
        }

        function startBossBattle() {
            document.getElementById('view-boss-select').classList.add('hidden');
            document.getElementById('view-game').classList.add('hidden');
            document.getElementById('view-boss-battle').classList.remove('hidden');
            
            // Setup boss data
            bossData.hp = 5000;
            bossData.maxHp = 5000;
            updateBossHPUI();
            
            // Render player towers
            const pContainer = document.getElementById('boss-player-towers');
            pContainer.innerHTML = '';
            selectedBossWeapons.forEach(t => {
                const el = document.createElement('div');
                el.className = 'w-16 h-16 rounded-full border-2 flex items-center justify-center bg-gray-900 shadow-[0_0_15px_currentColor] relative';
                el.style.color = t.color;
                el.style.borderColor = t.color;
                el.innerHTML = `<i class="fa-solid ${t.icon} text-2xl"></i>`;
                
                // Add firing animation element
                const beam = document.createElement('div');
                beam.className = 'absolute bottom-full left-1/2 w-1 -translate-x-1/2 origin-bottom transition-all duration-100 opacity-0 bg-white shadow-[0_0_10px_currentColor]';
                beam.style.height = '150px';
                beam.style.color = t.color;
                el.appendChild(beam);
                
                // Attach reference for loop
                t.domElement = el;
                t.beamElement = beam;
                t.currentCooldown = 0;
                
                pContainer.appendChild(el);
            });
            
            // Start auto-battle loop (runs at 60fps independent of main game)
            if(bossBattleInterval) clearInterval(bossBattleInterval);
            bossBattleInterval = setInterval(updateBossBattle, 1000/60);
        }

        function updateBossBattle() {
            const dt = 1/60;
            let totalDmgThisFrame = 0;
            
            selectedBossWeapons.forEach(t => {
                if (t.currentCooldown > 0) {
                    t.currentCooldown -= dt * 60;
                    t.beamElement.style.opacity = '0';
                } else {
                    // Fire!
                    totalDmgThisFrame += t.dmg;
                    t.currentCooldown = t.rate; // reuse rate from normal game
                    
                    // Visual beam effect
                    t.beamElement.style.opacity = '1';
                    t.beamElement.style.height = (100 + Math.random()*100) + 'px';
                }
            });
            
            if (totalDmgThisFrame > 0) {
                bossData.hp -= totalDmgThisFrame;
                updateBossHPUI();
                
                // Flash boss
                const flash = document.getElementById('boss-flash');
                flash.style.opacity = '0.5';
                setTimeout(() => flash.style.opacity = '0', 50);
            }
            
            if (bossData.hp <= 0) {
                endBossBattle(true);
            }
        }

        function updateBossHPUI() {
            const pct = Math.max(0, (bossData.hp / bossData.maxHp) * 100);
            document.getElementById('boss-hp-fill').style.width = `${pct}%`;
            document.getElementById('boss-hp-text').innerText = `${Math.floor(Math.max(0, bossData.hp))} / ${bossData.maxHp}`;
        }

        function endBossBattle(won) {
            clearInterval(bossBattleInterval);
            
            if (won) {
                // Reward UI (simple inline overlay for brevity without using alerts)
                gold += 1000;
                if (!bossGatlingUnlocked) {
                    bossGatlingUnlocked = true;
                    // Custom message
                    const msg = document.createElement('div');
                    msg.className = "fixed inset-0 flex items-center justify-center z-50 bg-black/80 font-cyber text-4xl text-neon-yellow text-glow-yellow animate-pulse";
                    msg.innerHTML = "BOSS DEFEATED<br>+1000 G<br>BOSS GATLING UNLOCKED!";
                    document.body.appendChild(msg);
                    setTimeout(() => msg.remove(), 3000);
                }
                updateUI();
                renderFooter();
                saveGame();
            }
            
            // Return to main game
            setTimeout(() => {
                document.getElementById('view-boss-battle').classList.add('hidden');
                document.getElementById('view-game').classList.remove('hidden');
            }, won ? 3000 : 1000);
        }

    </script>
