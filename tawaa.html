</style>
    <script id="ext-script">
/* =========================================================
   追加機能スクリプト
   既存スクリプトの関数を「包む／差し替える」形で拡張しており、
   既存コード自体には一切手を加えていません。
   ========================================================= */
(function () {
    'use strict';

    /* ---------- 調整用の設定値 ---------- */
    const CFG = {
        extraSpawnInterval: 1.0,   // 追加で湧く敵の間隔(秒)  ※元の1.5秒間隔に上乗せ
        waveInterval: 25,          // 大群ウェーブの間隔(秒)
        waveSize: 6,               // 大群の数
        waveStagger: 0.22,         // 大群の出現間隔(秒)
        baseMaxHp: 20,             // 基地の最大体力
        repairSeconds: 6,          // 基地破壊後の修復時間(秒)
        bossSlotMs: 5 * 60 * 1000, // ボス出現周期
        bossMaxPick: 3,            // ボス戦に連れていける台数
        unitHpBase: 400,           // マシーン体力(Lv1)
        unitHpPerLevel: 150,       // レベルごとの体力加算
        bossAttackInterval: 2.4,   // ボスの攻撃間隔(秒)
        boltDmg: 45, pulseDmg: 25, laserDmg: 120,
        rewardGold: 1000
    };

    /* ---------- ユーティリティ ---------- */
    const $ = (id) => document.getElementById(id);
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const rand = (a, b) => a + Math.random() * (b - a);
    const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
    const fmt = (n) => Math.floor(n).toLocaleString('ja-JP');
    const fmtCost = (n) => (n >= 10000 ? (n / 10000).toFixed(1).replace(/\.0$/, '') + '万' : String(Math.floor(n)));
    const fmtNum1 = (n) => String(Math.round(n * 10) / 10);
    const easeOut = (k) => 1 - Math.pow(1 - k, 3);

    const toastBox = document.createElement('div');
    toastBox.id = 'bb-toasts';
    document.body.appendChild(toastBox);
    function toast(msg, kind) {
        while (toastBox.children.length >= 3) toastBox.firstChild.remove();
        const el = document.createElement('div');
        el.className = 'bb-toast' + (kind ? ' ' + kind : '');
        el.textContent = msg;
        toastBox.appendChild(el);
        setTimeout(() => el.classList.add('out'), 2600);
        setTimeout(() => el.remove(), 3100);
    }

    /* =====================================================
     *  1. 日本語化
     * ===================================================== */
    function localize() {
        document.title = 'サイバー・タワーディフェンス 2088';
        TOWER_TYPES.emp.name = '電磁パルス';
        const h1 = document.querySelector('#view-title h1');
        if (h1) h1.innerHTML = 'サイバー・タワー<br>ディフェンス 2088';
        const dbg = $('debug-boss'); if (dbg) dbg.textContent = 'ボステスト';
        const timer = $('boss-timer'); if (timer) timer.textContent = '次のボスまで --分--秒';
        const h2 = document.querySelector('#view-boss-select h2'); if (h2) h2.textContent = '警告：巨大ボス出現';
        const bn = document.querySelector('#view-boss-battle h3'); if (bn) bn.textContent = 'サイバータイタン「オメガ」';
        document.querySelectorAll('#view-boss-battle div').forEach((d) => {
            if (d.children.length === 0 && d.textContent.trim() === 'VS') { d.textContent = '― 対 決 ―'; d.classList.add('bb-vs'); }
        });
    }
    localize();

    /* =====================================================
     *  状態
     * ===================================================== */
    let baseLocked = false;     // 基地修復中（襲来ロック）
    let inBattle = false;       // ボス戦中
    let confirmOpen = false;    // 「行く/行かない」表示中
    let extraTimer = 0, waveTimer = 0, waveLeft = 0, waveGap = 0;
    let lastSlot = null;

    const isSelectOpen = () => !$('view-boss-select').classList.contains('hidden');
    const isGameVisible = () => !$('view-game').classList.contains('hidden');

    /* =====================================================
     *  2. アップグレード費用の表示（バッジ＋ツールチップ）
     * ===================================================== */
    const upgradeCost = (tower) => TOWER_TYPES[tower.type].cost * tower.level;

    function updateBadgeState(b, tower) {
        b.classList.toggle('can', gold >= upgradeCost(tower));
    }
    function attachUpgradeBadge(cell, tower) {
        const old = cell.querySelector('.upg-badge');
        if (old) old.remove();
        const b = document.createElement('div');
        b.className = 'upg-badge';
        b.innerHTML = `<i class="fa-solid fa-arrow-up"></i>¥${fmtCost(upgradeCost(tower))}`;
        cell.appendChild(b);
        updateBadgeState(b, tower);
    }
    function refreshBadges() {
        document.querySelectorAll('.grid-cell .upg-badge').forEach((b) => {
            const cell = b.parentElement;
            if (cell && cell._tower) updateBadgeState(b, cell._tower);
        });
    }

    const origRenderTowerDOM = window.renderTowerDOM;
    window.renderTowerDOM = function (cell, tower) {
        origRenderTowerDOM(cell, tower);
        cell._tower = tower;
        attachUpgradeBadge(cell, tower);
    };

    const origUpdateUI = window.updateUI;
    window.updateUI = function () {
        origUpdateUI();
        refreshBadges();
    };

    const origHandleCellClick = window.handleCellClick;
    window.handleCellClick = function (x, y, cell) {
        const ex = builtTowers.find((t) => t.x === x && t.y === y);
        if (ex) {
            const cost = upgradeCost(ex);
            if (gold < cost) toast(`資金が足りません！ アップグレードには ¥${fmt(cost)} 必要（あと ¥${fmt(Math.ceil(cost - gold))}）`, 'warn');
        } else {
            const base = TOWER_TYPES[selectedTowerType];
            if (gold < base.cost) toast(`資金が足りません！ ${base.name}の設置には ¥${fmt(base.cost)} 必要（あと ¥${fmt(Math.ceil(base.cost - gold))}）`, 'warn');
        }
        return origHandleCellClick(x, y, cell);
    };

    // ツールチップ
    const tip = document.createElement('div');
    tip.id = 'tower-tip';
    document.body.appendChild(tip);
    gridEl.addEventListener('mousemove', (e) => {
        const cell = e.target.closest ? e.target.closest('.grid-cell') : null;
        if (!cell || !cell._tower) { tip.style.display = 'none'; return; }
        const t = cell._tower, base = TOWER_TYPES[t.type];
        const cost = upgradeCost(t);
        const nDmg = base.dmg * (t.level + 1) * 1.2;
        const nRange = base.range + (t.level + 1) * 0.2;
        const can = gold >= cost;
        tip.innerHTML = `
            <div class="tt-head"><i class="fa-solid ${base.icon}" style="color:${base.color}"></i>${base.name}<span class="tt-lv">Lv ${t.level}</span></div>
            <div class="tt-row"><span>攻撃力</span><b>${fmtNum1(t.dmg)}</b></div>
            <div class="tt-row"><span>射程</span><b>${fmtNum1(t.range)} マス</b></div>
            <div class="tt-row"><span>発射間隔</span><b>${(base.rate / 60).toFixed(2)} 秒</b></div>
            <div class="tt-up">
                <div class="tt-row"><span>アップグレード費用</span><b class="${can ? 'ok' : 'ng'}">¥${fmt(cost)}</b></div>
                <div class="tt-row"><span>Lv ${t.level + 1} 攻撃力</span><b>${fmtNum1(nDmg)}</b></div>
                <div class="tt-row"><span>Lv ${t.level + 1} 射程</span><b>${fmtNum1(nRange)} マス</b></div>
                <div class="${can ? 'ok' : 'ng'}">${can ? 'クリックで強化できます' : `資金不足（あと ¥${fmt(Math.ceil(cost - gold))}）`}</div>
            </div>`;
        tip.style.display = 'block';
        const w = tip.offsetWidth, h = tip.offsetHeight;
        let x = e.clientX + 16, y = e.clientY + 16;
        if (x + w > window.innerWidth - 8) x = e.clientX - w - 16;
        if (y + h > window.innerHeight - 8) y = e.clientY - h - 16;
        tip.style.left = Math.max(8, x) + 'px';
        tip.style.top = Math.max(8, y) + 'px';
    });
    gridEl.addEventListener('mouseleave', () => { tip.style.display = 'none'; });

    /* =====================================================
     *  3. 襲来ON/OFF の制御
     * ===================================================== */
    const origToggleSpawning = window.toggleSpawning;
    function setSpawning(on) {          // 状態を確実に on にする
        isSpawning = !on;
        origToggleSpawning();
    }
    window.toggleSpawning = function () {
        if (baseLocked) { toast('基地を修復中です。しばらくお待ちください', 'warn'); return; }
        origToggleSpawning();
    };

    /* =====================================================
     *  4. 敵の増量
     * ===================================================== */
    function startWave() {
        waveLeft = CFG.waveSize;
        waveGap = 0;
        toast('⚠ 敵の大群が接近中！', 'warn');
    }
    function processWave(dt) {
        if (waveLeft <= 0) return;
        waveGap -= dt;
        if (waveGap <= 0) { spawnEnemy(); waveLeft--; waveGap = CFG.waveStagger; }
    }

    /* =====================================================
     *  5. 基地の体力が尽きたら襲来を強制終了
     * ===================================================== */
    const alertEl = document.createElement('div');
    alertEl.id = 'bb-base-alert';
    alertEl.innerHTML = '<div class="card"><div class="t">基地の体力が尽きた！</div><div class="s">敵の襲来を強制終了しました。基地を修復します…</div></div>';
    document.body.appendChild(alertEl);

    function baseDestroyed() {
        if (baseLocked) return;
        baseLocked = true;
        setSpawning(false);
        enemies.forEach((e) => {
            const cp = pathCoords[Math.min(Math.floor(e.progress), pathCoords.length - 1)];
            if (cp) spawnParticle(cp.x, cp.y, 'explosion');
        });
        enemies.length = 0;
        waveLeft = 0; waveTimer = 0; extraTimer = 0;
        alertEl.classList.remove('show'); void alertEl.offsetWidth; alertEl.classList.add('show');

        let remain = CFG.repairSeconds;
        const setLabel = () => {
            btnSpawn.textContent = `基地修復中… ${remain}`;
            btnSpawn.className = 'bb-spawn-locked';
        };
        setLabel();
        const iv = setInterval(() => {
            remain--;
            if (remain > 0) { setLabel(); return; }
            clearInterval(iv);
            baseLocked = false;
            playerHealth = CFG.baseMaxHp;
            setSpawning(false);        // ボタン表示を「敵襲来: OFF」に戻す
            updateUI();
            saveGame();
            toast('基地の修復が完了しました', 'info');
        }, 1000);
    }

    /* =====================================================
     *  6. updateGame を包む（敵増量・基地破壊・一時停止）
     * ===================================================== */
    const origUpdateGame = window.updateGame;
    window.updateGame = function (dt) {
        dt = Math.min(dt, 0.1);
        if (inBattle || confirmOpen || isSelectOpen()) return;   // ボス関連の画面中は一時停止

        if (!baseLocked && playerHealth <= 0) { playerHealth = CFG.baseMaxHp; updateUI(); }  // セーブ読込時の保険

        // 基地に到達する敵を先に処理（元の「ゲームオーバー→リセット」に到達させない）
        const limit = pathCoords.length - 1;
        let leaked = false, destroyed = false;
        for (let i = enemies.length - 1; i >= 0; i--) {
            const e = enemies[i];
            if (Math.floor(e.progress + e.speed * dt) >= limit) {
                enemies.splice(i, 1);
                playerHealth = Math.max(0, playerHealth - 1);
                leaked = true;
                if (playerHealth <= 0) { destroyed = true; break; }
            }
        }
        if (leaked) updateUI();
        if (destroyed) { baseDestroyed(); return; }

        // 追加スポーン
        if (isSpawning && !baseLocked) {
            extraTimer += dt;
            while (extraTimer >= CFG.extraSpawnInterval) { extraTimer -= CFG.extraSpawnInterval; spawnEnemy(); }
            waveTimer += dt;
            if (waveTimer >= CFG.waveInterval) { waveTimer = 0; startWave(); }
            processWave(dt);
        } else {
            extraTimer = 0; waveTimer = 0; waveLeft = 0;
        }

        origUpdateGame(dt);
    };

    /* =====================================================
     *  7. ボスまでのカウントダウン（秒まで表示）
     * ===================================================== */
    const timerEl = $('boss-timer');
    const bigCd = document.createElement('div');
    bigCd.id = 'bb-countdown-big';
    bigCd.innerHTML = '<div class="num"></div><div class="lbl">ボス出現まで</div>';
    document.body.appendChild(bigCd);
    let lastTimerText = '', lastBig = -1;

    function canPrompt() {
        return isGameVisible() && !inBattle && !confirmOpen && !isSelectOpen();
    }

    window.checkBossEvent = function () {
        const now = Date.now();
        const slot = Math.floor(now / CFG.bossSlotMs);
        const remain = CFG.bossSlotMs - (now % CFG.bossSlotMs);
        const sec = Math.ceil(remain / 1000);
        const mm = String(Math.floor(sec / 60)).padStart(2, '0');
        const ss = String(sec % 60).padStart(2, '0');
        const html = `<i class="fa-solid fa-skull"></i> 次のボスまで <span class="bb-cd">${mm}</span>分<span class="bb-cd">${ss}</span>秒`;
        if (html !== lastTimerText) {
            timerEl.innerHTML = html;
            lastTimerText = html;
            timerEl.classList.toggle('bb-urgent', sec <= 10);
        }
        // 残り10秒の大型カウントダウン
        const big = (sec <= 10 && canPrompt()) ? sec : -1;
        if (big !== lastBig) {
            lastBig = big;
            if (big > 0) {
                bigCd.querySelector('.num').textContent = big;
                bigCd.style.display = 'block';
            } else bigCd.style.display = 'none';
        }

        if (lastSlot === null) lastSlot = slot;
        if (slot !== lastSlot) {
            lastSlot = slot;
            if (canPrompt()) openBossConfirm();
        }
    };

    /* =====================================================
     *  8. 「行く / 行かない」確認ダイアログ
     * ===================================================== */
    const confirmEl = document.createElement('div');
    confirmEl.id = 'bb-confirm';
    confirmEl.className = 'bb-overlay bb-hide';
    confirmEl.innerHTML = `
        <div class="cyber-modal bb-dialog">
            <div class="bb-stripe"></div>
            <h2>警告：巨大ボス出現！</h2>
            <p>サイバータイタン「オメガ」が基地に接近しています。<br>ボス戦に向かいますか？</p>
            <div class="bb-note">※ボス戦では設置済みのマシーンを最大${CFG.bossMaxPick}台連れていけます。<br>ボスの攻撃でマシーンの体力が0になると戦闘不能になります。</div>
            <div class="bb-btn-row">
                <button id="bb-go" class="btn-boss bb-btn"><i class="fa-solid fa-skull"></i> 行く</button>
                <button id="bb-nogo" class="bb-btn bb-btn-ghost">行かない</button>
            </div>
        </div>`;
    document.body.appendChild(confirmEl);

    function openBossConfirm() {
        confirmOpen = true;
        bigCd.style.display = 'none'; lastBig = -1;
        confirmEl.classList.remove('bb-hide');
    }
    $('bb-go').onclick = () => { showBossSelection(); };
    $('bb-nogo').onclick = () => {
        confirmOpen = false;
        confirmEl.classList.add('bb-hide');
        toast('ボス戦を見送りました。次のボスは5分後です');
    };

    /* =====================================================
     *  9. ボス戦に連れていくマシーンの選択（設置済みのみ／Lv・攻撃力表示）
     * ===================================================== */
    const unitMaxHp = (lv) => Math.round(CFG.unitHpBase + CFG.unitHpPerLevel * (lv - 1));

    function makeUnit(t) {
        const base = TOWER_TYPES[t.type];
        const maxHp = unitMaxHp(t.level);
        return {
            tower: t, type: t.type, name: base.name, icon: base.icon, color: base.color,
            level: t.level, dmg: t.dmg, rate: base.rate, period: base.rate / 60,
            maxHp, hp: maxHp, alive: true, cd: 0, aim: null, aimEnt: null
        };
    }

    window.showBossSelection = function () {
        confirmOpen = false;
        confirmEl.classList.add('bb-hide');
        const modal = $('view-boss-select');
        modal.classList.remove('hidden');

        const towers = builtTowers.slice().sort((a, b) => b.dmg - a.dmg);
        const need = Math.min(CFG.bossMaxPick, towers.length);
        selectedBossWeapons = [];

        modal.querySelector('p').textContent = towers.length
            ? `設置済みのマシーンから${need}台を選んで、巨大ボスを迎撃せよ！（レベルと攻撃力を確認して選ぼう）`
            : '設置済みのマシーンがありません。マシーンを設置してからボスに挑もう！';
        $('boss-select-count').parentElement.innerHTML =
            `選択済み: <span id="boss-select-count" class="font-bold text-white">0</span> / ${need}`;

        const startBtn = $('btn-start-boss');
        startBtn.disabled = true;

        let cancel = $('btn-cancel-boss');
        if (!cancel) {
            cancel = document.createElement('button');
            cancel.id = 'btn-cancel-boss';
            cancel.className = 'bb-btn bb-btn-ghost';
            cancel.textContent = '戻る（ボス戦に行かない）';
            startBtn.parentElement.appendChild(cancel);
        }
        cancel.onclick = () => {
            modal.classList.add('hidden');
            toast('ボス戦を見送りました。次のボスは5分後です');
        };

        const cont = $('boss-weapon-select');
        cont.innerHTML = '';
        if (!towers.length) {
            cont.innerHTML = '<div class="bs-empty">マシーンが1台も設置されていません</div>';
            return;
        }
        const cards = [];
        const refresh = () => {
            cards.forEach(({ card, unit }) => {
                const i = selectedBossWeapons.indexOf(unit);
                card.classList.toggle('sel', i > -1);
                card.querySelector('.bs-order').textContent = i > -1 ? i + 1 : '';
            });
            $('boss-select-count').textContent = selectedBossWeapons.length;
            startBtn.disabled = selectedBossWeapons.length !== need;
        };
        towers.forEach((t) => {
            const unit = makeUnit(t);
            const card = document.createElement('div');
            card.className = 'bs-card';
            card.innerHTML = `
                <div class="bs-order"></div>
                <i class="fa-solid ${unit.icon} bs-icon" style="color:${unit.color}"></i>
                <div class="bs-name">${unit.name}</div>
                <div class="bs-lv">Lv ${unit.level}</div>
                <div class="bs-atk">攻撃力 ${fmtNum1(unit.dmg)}</div>
                <div class="bs-sub">体力 ${unit.maxHp}</div>`;
            card.onclick = () => {
                const i = selectedBossWeapons.indexOf(unit);
                if (i > -1) selectedBossWeapons.splice(i, 1);
                else if (selectedBossWeapons.length < need) selectedBossWeapons.push(unit);
                else {
                    card.classList.remove('deny'); void card.offsetWidth; card.classList.add('deny');
                    return;
                }
                refresh();
            };
            cards.push({ card, unit });
            cont.appendChild(card);
        });
    };

    /* =====================================================
     *  10. ボス戦（体力付きマシーン＋高品質アタックアニメーション）
     * ===================================================== */
    let B = null;
    let fxCv = null, fxC = null, bgCv = null, bgC = null, bbWrap = null;
    let VW = 800, VH = 600, DPR = 1;

    /* ---------- スプライト（グロー） ---------- */
    const spriteCache = {};
    function hexRgb(h) {
        h = h.replace('#', '');
        if (h.length === 3) h = h.split('').map((x) => x + x).join('');
        const n = parseInt(h, 16);
        return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }
    function sprite(color) {
        if (spriteCache[color]) return spriteCache[color];
        const s = document.createElement('canvas');
        s.width = s.height = 64;
        const g = s.getContext('2d');
        const [r, gg, b] = hexRgb(color);
        const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
        gr.addColorStop(0, `rgba(${r},${gg},${b},1)`);
        gr.addColorStop(0.35, `rgba(${r},${gg},${b},.55)`);
        gr.addColorStop(1, `rgba(${r},${gg},${b},0)`);
        g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
        return (spriteCache[color] = s);
    }
    function G(c, x, y, r, color, a) {
        c.globalAlpha = a === undefined ? 1 : a;
        c.drawImage(sprite(color), x - r, y - r, r * 2, r * 2);
    }

    /* ---------- DOM準備（初回のみ） ---------- */
    function prepBattleDOM() {
        if (fxCv) return;
        const view = $('view-boss-battle');
        bbWrap = view.querySelector(':scope > .z-10') || view.children[1];
        bbWrap.classList.add('bb-wrap');
        const cv0 = $('boss-canvas');
        if (cv0 && cv0.parentElement) cv0.parentElement.classList.add('bb-holder');

        bgCv = document.createElement('canvas'); bgCv.id = 'bb-bg';
        view.insertBefore(bgCv, view.firstChild); bgC = bgCv.getContext('2d');
        fxCv = document.createElement('canvas'); fxCv.id = 'bb-fx';
        view.appendChild(fxCv); fxC = fxCv.getContext('2d');

        const bn = document.createElement('div'); bn.id = 'bb-banner'; bn.className = 'bb-banner'; view.appendChild(bn);
        const rs = document.createElement('div'); rs.id = 'bb-result'; rs.className = 'bb-hide'; view.appendChild(rs);

        const fill = $('boss-hp-fill');
        const gh = document.createElement('div'); gh.id = 'bb-hp-ghost';
        fill.parentElement.insertBefore(gh, fill);

        window.addEventListener('resize', () => { if (B) measure(); });
    }

    function banner(text, kind) {
        const el = $('bb-banner');
        el.textContent = text;
        el.className = 'bb-banner ' + (kind || 'info');
        void el.offsetWidth;
        el.classList.add('show');
    }

    function measure() {
        const view = $('view-boss-battle');
        const vr = view.getBoundingClientRect();
        VW = Math.max(1, vr.width); VH = Math.max(1, vr.height);
        DPR = Math.min(window.devicePixelRatio || 1, 2);
        [bgCv, fxCv].forEach((cv) => {
            cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
            cv.style.width = VW + 'px'; cv.style.height = VH + 'px';
        });
        if (!B) return;
        const be = $('boss-entity').getBoundingClientRect();
        const b = B.boss;
        b.ax = be.left - vr.left + be.width / 2;
        b.ay = be.top - vr.top + be.height / 2;
        b.size = Math.max(120, Math.min(be.width, be.height));
        b.S = b.size / 230; b.rx = b.size * 0.30; b.ry = b.size * 0.34;
        B.units.forEach((u) => {
            const r = u.circle.getBoundingClientRect();
            u.cx = r.left - vr.left + r.width / 2;
            u.cy = r.top - vr.top + r.height / 2;
            u.mx = u.cx; u.my = u.cy - r.height * 0.55;
        });
        B.stars = [];
        for (let i = 0; i < 70; i++) B.stars.push({ x: rand(0, VW), y: rand(0, VH), v: rand(.1, .6), s: rand(.8, 2.2), p: rand(0, 6) });
    }

    /* ---------- 開始 ---------- */
    window.startBossBattle = function () {
        if (!selectedBossWeapons.length) return;
        inBattle = true; confirmOpen = false;
        setSpawning(false);
        bigCd.style.display = 'none'; lastBig = -1;
        $('view-boss-select').classList.add('hidden');
        $('view-game').classList.add('hidden');
        const view = $('view-boss-battle');
        view.classList.remove('hidden');
        view.classList.add('bb-active');
        prepBattleDOM();

        bossData.hp = 5000; bossData.maxHp = 5000;
        updateBossHPUI();
        $('bb-hp-ghost').style.width = '100%';

        // マシーンDOM
        const box = $('boss-player-towers');
        box.innerHTML = '';
        selectedBossWeapons.forEach((u) => {
            u.hp = u.maxHp; u.alive = true; u.cd = 0; u.aim = null; u.aimEnt = null;
            const el = document.createElement('div');
            el.className = 'bb-unit';
            el.style.color = u.color;
            el.innerHTML = `
                <div class="bb-unit-circle"><i class="fa-solid ${u.icon}"></i><span class="bb-unit-lv">Lv${u.level}</span></div>
                <div class="bb-unit-name">${u.name}</div>
                <div class="bb-unit-hp"><div class="ghost"></div><div class="fill"></div><span class="txt"></span></div>
                <div class="bb-unit-atk">攻撃力 ${fmtNum1(u.dmg)}</div>
                <div class="bb-down-tag">戦闘不能</div>`;
            u.el = el; u.circle = el.querySelector('.bb-unit-circle');
            u.fill = el.querySelector('.fill'); u.ghost = el.querySelector('.ghost'); u.txt = el.querySelector('.txt');
            setUnitHP(u);
            box.appendChild(el);
        });

        B = {
            t: 0, last: performance.now(), raf: 0, phase: 'intro', introT: 0,
            units: selectedBossWeapons, ents: [], parts: [], nums: [], timers: [], stars: [],
            shake: 0, sx: 0, sy: 0, flashW: 0, flashR: 0, bgPulse: 0, hitStop: 0, autoLeave: 0, dyT: 0, dyNext: 0,
            boss: {
                ax: 0, ay: 0, px: 0, py: 0, size: 200, S: 1, rx: 60, ry: 70, bob: 0, flash: 0, kick: 0, shx: 0, shy: 0,
                charge: 0, chargeCol: '#ff4fa3', mode: 'idle', timer: 1.4, tt: 0, teleDur: 1, type: 'bolt', target: null,
                count: 0, enraged: false, hand: [0, 0], handSide: 0, poisonT: 0, visible: true, alpha: 1,
                lookX: 0, lookY: 0, introK: 0
            }
        };
        measure();
        B.last = performance.now();
        B.raf = requestAnimationFrame(tick);
    };

    function setUnitHP(u) {
        const pct = clamp(u.hp / u.maxHp, 0, 1) * 100;
        u.fill.style.width = pct + '%';
        u.ghost.style.width = pct + '%';
        u.fill.style.background = pct > 50 ? 'linear-gradient(90deg,#16a34a,#4ade80)' : pct > 25 ? 'linear-gradient(90deg,#ca8a04,#facc15)' : 'linear-gradient(90deg,#b91c1c,#f87171)';
        u.txt.textContent = `${Math.ceil(u.hp)} / ${u.maxHp}`;
        u.el.classList.toggle('low', pct <= 25 && pct > 0);
    }

    /* ---------- メインループ ---------- */
    function tick(now) {
        if (!B) return;
        const dt = clamp((now - B.last) / 1000, 0.001, 0.05);
        B.last = now;
        update(dt);
        render();
        if (B) B.raf = requestAnimationFrame(tick);
    }

    function after(d, fn) { B.timers.push({ t: d, fn }); }
    function addEnt(e) { e.t = 0; B.ents.push(e); return e; }
    function addP(p) { if (B.parts.length < 900) { p.t = 0; B.parts.push(p); } }
    function shake(n) { B.shake = Math.min(14, Math.max(B.shake, n)); }

    function update(dt) {
        B.t += dt;
        for (let i = B.timers.length - 1; i >= 0; i--) {
            const tm = B.timers[i];
            tm.t -= dt;
            if (tm.t <= 0) { B.timers.splice(i, 1); tm.fn(); if (!B) return; }
        }
        B.hitStop = Math.max(0, B.hitStop - dt);
        const b = B.boss;
        const bdt = B.hitStop > 0 ? 0 : dt;
        b.bob += bdt;
        b.kick = Math.max(0, b.kick - dt * 4);
        b.flash = Math.max(0, b.flash - dt * 5);
        b.shx = rand(-1, 1) * b.kick * 7; b.shy = rand(-1, 1) * b.kick * 7;
        const intro = 1 - easeOut(b.introK);
        b.px = b.ax;
        b.py = b.ay + Math.sin(b.bob * 1.5) * 6 * b.S - intro * (b.ay + b.size);

        B.shake = Math.max(0, B.shake - dt * 28);
        B.flashW = Math.max(0, B.flashW - dt * 1.3);
        B.flashR = Math.max(0, B.flashR - dt * 1.4);
        B.bgPulse = Math.max(0, B.bgPulse - dt * 1.6);

        if (B.phase === 'intro') updateIntro(dt);
        else if (B.phase === 'fight') updateFight(dt, bdt);
        else if (B.phase === 'dying') updateDying(dt);
        else if (B.phase === 'lost') {
            B.lostT = (B.lostT || 0) + dt;
            if (B.lostT > 1.6 && !B.resultShown) showResult(false);
        }
        updateEnts(dt); updateParts(dt); updateNums(dt);
        B.stars.forEach((s) => { s.y -= s.v * 60 * dt; if (s.y < -4) { s.y = VH + 4; s.x = rand(0, VW); } });
    }

    function updateIntro(dt) {
        const b = B.boss;
        B.introT += dt;
        if (!B.introWarn) { B.introWarn = true; banner('警告！ 巨大ボス接近中…', 'warn'); B.bgPulse = 1; }
        b.introK = clamp(B.introT / 2.0, 0, 1);
        if (b.introK < 1 && Math.random() < dt * 60) {
            addP({ type: 'glow', x: b.px + rand(-40, 40) * b.S, y: b.py + 10 * b.S, vx: 0, vy: -rand(40, 160), life: .5, size: rand(8, 18), color: '#ff4fa3', grow: 0 });
        }
        if (b.introK >= 1) {
            B.phase = 'fight';
            shake(9);
            ringEnt(b.px, b.py + 70 * b.S, '#ff4fa3', 240 * b.S, .8, 6);
            ringEnt(b.px, b.py + 70 * b.S, '#ffffff', 160 * b.S, .6, 3);
            banner('戦闘開始！', 'info');
            B.units.forEach((u) => { u.cd = rand(.25, .8); });
        }
    }

    function updateFight(dt, bdt) {
        B.units.forEach((u) => updateUnit(u, dt));
        updateBossAI(bdt);
        const b = B.boss, pct = bossData.hp / bossData.maxHp;
        if (pct < .5 && Math.random() < dt * (pct < .25 ? 14 : 6)) {
            const s = Math.random() < .5 ? -1 : 1;
            puff(b.px + s * 70 * b.S, b.py - 20 * b.S, '#3a3f5c', 14 * b.S, 1.0, rand(-10, 10), rand(-70, -35));
            if (pct < .25) glowP(b.px + s * 70 * b.S, b.py - 15 * b.S, '#ff7a1a', 16 * b.S, .3);
        }
        if (b.poisonT > 0 && Math.random() < dt * 16) {
            puff(b.px + rand(-1, 1) * b.rx, b.py + rand(-.3, 1) * b.ry, '#a3e635', 16 * b.S, 1.1, rand(-8, 8), rand(-40, -15), false, .32);
        }
    }

    function updateDying(dt) {
        const b = B.boss;
        B.dyT += dt;
        b.kick = 1; b.charge = 0;
        B.dyNext -= dt;
        if (B.dyNext <= 0 && B.dyT < 2.5) {
            B.dyNext = Math.max(.05, .22 - B.dyT * .07);
            const x = b.px + rand(-1, 1) * b.rx, y = b.py + rand(-1, 1) * b.ry;
            explosion(x, y, { scale: rand(.35, .7) });
            shake(5); b.flash = 1;
        }
        if (!B.dyBoom && B.dyT >= 2.6) { B.dyBoom = true; megaBoom(); }
        if (B.dyT >= 4.0 && !B.resultShown) showResult(true);
    }

    /* ---------- パーティクル／演出ヘルパー ---------- */
    function spark(x, y, color, n, speed, life, size) {
        for (let i = 0; i < n; i++) {
            const a = rand(0, Math.PI * 2), s = rand(.3, 1) * speed;
            addP({ type: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(.6, 1) * life, size: size || 2, color, drag: 2.5, grav: 220 });
        }
    }
    function puff(x, y, color, size, life, vx, vy, add, a) {
        addP({ type: 'puff', x, y, vx, vy, life, size, color, add: !!add, a: a === undefined ? .5 : a, drag: .6 });
    }
    function glowP(x, y, color, size, life, grow) {
        addP({ type: 'glow', x, y, vx: 0, vy: 0, life, size, color, grow: grow || 0 });
    }
    function debris(x, y, color, n, spd) {
        for (let i = 0; i < n; i++) {
            const a = rand(0, Math.PI * 2), s = rand(.3, 1) * (spd || 300);
            addP({ type: 'debris', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 80, grav: 800, rot: rand(0, 6), vr: rand(-12, 12), size: rand(3, 7), color, life: rand(.6, 1.1) });
        }
    }
    function casing(u, col) {
        addP({ type: 'debris', x: u.mx + rand(-4, 4), y: u.my + 14, vx: rand(-120, 120), vy: rand(-220, -90), grav: 900, rot: rand(0, 6), vr: rand(-14, 14), size: 4, color: col || '#ffd86b', life: .7 });
    }
    function ringEnt(x, y, col, maxR, life, w) {
        return addEnt({
            life, draw(c, k) {
                const r = maxR * easeOut(k);
                c.globalCompositeOperation = 'lighter'; c.globalAlpha = 1 - k;
                c.strokeStyle = col; c.lineWidth = Math.max(.6, (w || 3) * (1 - k));
                c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.stroke();
            }
        });
    }
    function explosion(x, y, o) {
        o = o || {};
        const s = o.scale || 1;
        glowP(x, y, '#ffffff', 60 * s, .14);
        glowP(x, y, '#ffb347', 100 * s, .35);
        glowP(x, y, '#ff3b00', 140 * s, .55);
        ringEnt(x, y, '#ffd9a0', 130 * s, .45, 6);
        ringEnt(x, y, '#ff6a2b', 90 * s, .35, 4);
        spark(x, y, '#ffcf66', Math.round(22 * s), 520 * s, .7, 2.2);
        spark(x, y, '#ff5522', Math.round(14 * s), 360 * s, .8, 2);
        for (let i = 0; i < 6; i++) puff(x + rand(-14, 14), y + rand(-14, 14), '#3a3f5c', 18 * s, rand(.7, 1.1), rand(-60, 60), rand(-90, -20));
        debris(x, y, '#4a5075', 8, 380 * s);
    }
    function megaBoom() {
        const b = B.boss, x = b.px, y = b.py;
        b.visible = false;
        B.flashW = 1; shake(14);
        explosion(x, y, { scale: 2.8 });
        const R = Math.max(VW, VH);
        ringEnt(x, y, '#ffffff', R * .7, 1.0, 10);
        after(.12, () => ringEnt(x, y, '#ff4fa3', R * .6, 1.1, 8));
        after(.28, () => ringEnt(x, y, '#ffde00', R * .5, 1.2, 6));
        spark(x, y, '#ffffff', 60, 900, 1.1, 2.4);
        spark(x, y, '#ff4fa3', 50, 700, 1.2, 2.2);
        spark(x, y, '#ffb347', 40, 560, 1.3, 2.4);
        for (let i = 0; i < 26; i++) {
            addP({ type: 'debris', x: x + rand(-30, 30), y: y + rand(-30, 30), vx: rand(-520, 520), vy: rand(-620, 200), grav: 700, rot: rand(0, 6), vr: rand(-10, 10), size: rand(6, 16), color: pick(['#3b4478', '#ff4fa3', '#222a52', '#ffb347']), life: rand(1.2, 2) });
        }
    }

    /* ---------- エンティティ / パーティクルの更新と描画 ---------- */
    function updateEnts(dt) {
        for (let i = B.ents.length - 1; i >= 0; i--) {
            const e = B.ents[i];
            e.t += dt;
            if (e.update) e.update(dt, e);
            if (e.t >= e.life || e.dead) { B.ents.splice(i, 1); if (e.end) e.end(e); if (!B) return; }
        }
    }
    function updateParts(dt) {
        const a = B.parts;
        for (let i = a.length - 1; i >= 0; i--) {
            const p = a[i];
            p.t += dt;
            if (p.t >= p.life) { a.splice(i, 1); continue; }
            if (p.drag) { const f = Math.max(0, 1 - p.drag * dt); p.vx *= f; p.vy *= f; }
            if (p.grav) p.vy += p.grav * dt;
            p.x += p.vx * dt; p.y += p.vy * dt;
            if (p.vr) p.rot += p.vr * dt;
        }
    }
    function drawEnts(c) {
        for (const e of B.ents) {
            if (!e.draw) continue;
            c.save();
            e.draw(c, e.t / e.life, e);
            c.restore();
        }
    }
    function drawParts(c) {
        for (const p of B.parts) {
            const k = p.t / p.life;
            switch (p.type) {
                case 'spark':
                    c.globalCompositeOperation = 'lighter'; c.globalAlpha = 1 - k;
                    c.strokeStyle = p.color; c.lineWidth = p.size * (1 - k * .5);
                    c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x - p.vx * .04, p.y - p.vy * .04); c.stroke();
                    break;
                case 'glow': {
                    const r = Math.max(1, p.size * (p.grow ? (1 + k * p.grow) : (1 - k * .6)));
                    c.globalCompositeOperation = 'lighter';
                    G(c, p.x, p.y, r, p.color, 1 - k);
                    break;
                }
                case 'puff': {
                    const r = p.size * (1 + k * 1.4);
                    c.globalCompositeOperation = p.add ? 'lighter' : 'source-over';
                    G(c, p.x, p.y, r, p.color, (1 - k) * p.a);
                    break;
                }
                case 'debris':
                    c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1 - k * k;
                    c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.fillStyle = p.color;
                    c.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); c.restore();
                    break;
                case 'drop':
                    c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1 - k * k; c.fillStyle = p.color;
                    c.beginPath(); c.arc(p.x, p.y, Math.max(.5, p.size * (1 - k * .4)), 0, Math.PI * 2); c.fill();
                    break;
            }
        }
        c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
    }

    /* ---------- ダメージ数字 ---------- */
    function addNum(x, y, val, color, scale) {
        if (B.nums.length > 60) B.nums.shift();
        B.nums.push({ x, y, val: String(val), color, scale: scale || 1, t: 0, life: .9, vx: rand(-20, 20) });
    }
    function updateNums(dt) {
        for (let i = B.nums.length - 1; i >= 0; i--) {
            const n = B.nums[i];
            n.t += dt;
            if (n.t >= n.life) { B.nums.splice(i, 1); continue; }
            n.y -= (70 * (1 - n.t / n.life) + 20) * dt; n.x += n.vx * dt;
        }
    }
    function drawNums(c) {
        c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
        for (const n of B.nums) {
            const k = n.t / n.life;
            const pop = k < .12 ? 1 + (1 - k / .12) * .7 : 1;
            c.globalAlpha = k > .65 ? 1 - (k - .65) / .35 : 1;
            c.font = `900 ${Math.round(20 * n.scale * pop)}px Orbitron, 'Noto Sans JP', sans-serif`;
            c.lineWidth = 4; c.strokeStyle = 'rgba(0,0,0,.85)';
            c.strokeText(n.val, n.x, n.y);
            c.fillStyle = n.color; c.fillText(n.val, n.x, n.y);
        }
        c.globalAlpha = 1;
    }

    /* ---------- ビーム／稲妻 ---------- */
    function beam(c, x1, y1, x2, y2, col, w, a) {
        c.globalCompositeOperation = 'lighter'; c.lineCap = 'round';
        const line = () => { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); };
        c.strokeStyle = col; c.globalAlpha = a * .22; c.lineWidth = w * 3.4; line();
        c.globalAlpha = a * .7; c.lineWidth = w * 1.5; line();
        c.strokeStyle = '#ffffff'; c.globalAlpha = a; c.lineWidth = Math.max(1, w * .5); line();
    }
    function jag(x1, y1, x2, y2, off) {
        let pts = [[x1, y1], [x2, y2]];
        let o = off;
        for (let pass = 0; pass < 5; pass++) {
            const next = [];
            for (let i = 0; i < pts.length - 1; i++) {
                const [ax, ay] = pts[i], [bx, by] = pts[i + 1];
                const dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy) || 1;
                const d = rand(-o, o);
                next.push(pts[i], [(ax + bx) / 2 + (-dy / len) * d, (ay + by) / 2 + (dx / len) * d]);
            }
            next.push(pts[pts.length - 1]);
            pts = next; o *= .55;
        }
        return pts;
    }
    function polyline(c, pts, col, a) {
        c.globalCompositeOperation = 'lighter'; c.lineCap = 'round'; c.lineJoin = 'round';
        const path = () => { c.beginPath(); pts.forEach((p, i) => (i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]))); c.stroke(); };
        c.strokeStyle = col; c.globalAlpha = a * .28; c.lineWidth = 7; path();
        c.globalAlpha = a * .9; c.lineWidth = 2.6; path();
        c.strokeStyle = '#ffffff'; c.globalAlpha = a; c.lineWidth = 1; path();
    }

    /* ---------- ボスへの命中処理 ---------- */
    function tgt(fx, fy) {
        const b = B.boss, dx = fx * b.rx, dy = fy * b.ry;
        return { get x() { return B.boss.px + dx; }, get y() { return B.boss.py + dy; } };
    }
    const rndT = (w, h) => tgt(rand(-w, w), rand(-h, h));

    function hitBoss(dmg, x, y, o) {
        o = o || {};
        const b = B.boss;
        b.flash = Math.min(1, b.flash + (o.flash === undefined ? .3 : o.flash));
        b.kick = Math.min(1, b.kick + dmg / 300);
        if (B.phase !== 'fight' || dmg <= 0) return;
        bossData.hp = Math.max(0, bossData.hp - dmg);
        updateBossHPUI();
        $('bb-hp-ghost').style.width = Math.max(0, bossData.hp / bossData.maxHp * 100) + '%';
        addNum(x + rand(-12, 12), y - 10, Math.round(dmg), o.color || '#ffffff', dmg >= 100 ? 1.35 : 1);
        if (!b.enraged && bossData.hp > 0 && bossData.hp / bossData.maxHp < .3) enrage();
        if (bossData.hp <= 0) startDying();
    }
    function enrage() {
        const b = B.boss;
        b.enraged = true;
        banner('オメガが激昂した！ 攻撃が激しくなる…', 'warn');
        B.flashR = .6; shake(8);
        ringEnt(b.px, b.py, '#ff2a2a', 260 * b.S, .8, 6);
    }
    function startDying() {
        if (B.phase !== 'fight') return;
        B.phase = 'dying'; B.dyT = 0; B.dyNext = 0;
        B.boss.mode = 'idle'; B.boss.charge = 0;
        B.units.forEach((u) => { if (u.aimEnt) u.aimEnt.dead = true; });
        banner('とどめだ！', 'info');
    }

    /* ---------- 武器ごとの攻撃アニメーション ---------- */
    function muzzleFlash(u, col, size, ox) {
        const x = u.mx + (ox || 0), y = u.my;
        addEnt({
            life: .09, draw(c, k) {
                c.globalCompositeOperation = 'lighter';
                G(c, x, y, 28 * size, col, 1 - k);
                G(c, x, y, 12 * size, '#ffffff', 1 - k);
                c.globalAlpha = 1 - k; c.strokeStyle = '#ffffff'; c.lineWidth = 2; c.beginPath();
                for (let i = 0; i < 3; i++) {
                    const a = -Math.PI / 2 + (i - 1) * .5, L = 34 * size * (1 - k * .4);
                    c.moveTo(x, y); c.lineTo(x + Math.cos(a) * L, y + Math.sin(a) * L);
                }
                c.stroke();
            }
        });
    }
    function recoil(u) {
        try {
            u.circle.animate([
                { transform: 'translateY(0) scale(1)', filter: 'brightness(1)' },
                { transform: 'translateY(5px) scale(.94)', filter: 'brightness(1.9)', offset: .25 },
                { transform: 'translateY(0) scale(1)', filter: 'brightness(1)' }
            ], { duration: 160, easing: 'ease-out' });
        } catch (e) { /* noop */ }
    }

    function tracer(x, y, T, color, speed, dmg, o) {
        o = o || {};
        addEnt({
            life: 3, x, y, trav: 0, ang: 0,
            update(dt, e) {
                const dx = T.x - e.x, dy = T.y - e.y, d = Math.hypot(dx, dy), step = speed * dt;
                e.ang = Math.atan2(dy, dx);
                if (d <= step) {
                    e.x = T.x; e.y = T.y; e.dead = true;
                    if (dmg > 0) hitBoss(dmg, e.x, e.y, { color: o.numColor || '#ffffff', flash: o.flash || .3 });
                    else B.boss.flash = Math.min(1, B.boss.flash + .08);
                    if (o.onHit) o.onHit(e.x, e.y);
                    else { spark(e.x, e.y, color, o.spark || 6, 300, .35, 2); glowP(e.x, e.y, color, 24, .12); }
                } else { e.x += dx / d * step; e.y += dy / d * step; e.trav += step; }
            },
            draw(c, k, e) {
                const L = Math.min(o.len || 70, e.trav + 6);
                const tx = e.x - Math.cos(e.ang) * L, ty = e.y - Math.sin(e.ang) * L;
                const g = c.createLinearGradient(tx, ty, e.x, e.y);
                g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.6, color); g.addColorStop(1, '#ffffff');
                c.globalCompositeOperation = 'lighter'; c.lineCap = 'round';
                c.strokeStyle = g; c.lineWidth = o.w || 2.4;
                c.beginPath(); c.moveTo(tx, ty); c.lineTo(e.x, e.y); c.stroke();
                G(c, e.x, e.y, 9, color, .9);
            }
        });
    }

    function impactBurst(x, y, col, o) {
        const g = o.glow || 40;
        glowP(x, y, '#ffffff', g * .7, .12);
        glowP(x, y, col, g * 1.4, .28);
        for (let i = 0; i < (o.rings || 0); i++) ringEnt(x, y, col, g * (1.6 + i * .8), .35 + i * .1, 3);
        spark(x, y, col, o.sparks || 8, o.speed || 320, .5, 2);
    }

    const WEAPON = {};

    function missileBoom(x, y, dmg) {

    WEAPON.missile = (u) => {
        const T = rndT(.3, .35);
        muzzleFlash(u, '#ffb347', 1.5);
        const a0 = -Math.PI / 2 + rand(-1.1, 1.1);
        addEnt({
            life: 3, x: u.mx, y: u.my, vx: Math.cos(a0) * 320, vy: Math.sin(a0) * 320, spd: 320, ang: a0,
            update(dt, e) {
                const want = Math.atan2(T.y - e.y, T.x - e.x);
                let cur = Math.atan2(e.vy, e.vx);
                const diff = Math.atan2(Math.sin(want - cur), Math.cos(want - cur));
                const turn = (3.2 + e.t * 6) * dt;
                cur += clamp(diff, -turn, turn);
                e.spd = Math.min(1050, e.spd + 900 * dt);
                e.vx = Math.cos(cur) * e.spd; e.vy = Math.sin(cur) * e.spd; e.ang = cur;
                e.x += e.vx * dt; e.y += e.vy * dt;
                puff(e.x - Math.cos(cur) * 12, e.y - Math.sin(cur) * 12, '#9aa0b8', 7, .7, rand(-14, 14), rand(-14, 14), false, .45);
                glowP(e.x - Math.cos(cur) * 10, e.y - Math.sin(cur) * 10, '#ff9a3c', 11, .18);
                if (Math.hypot(T.x - e.x, T.y - e.y) < 26 || e.t > 2.6) { e.dead = true; missileBoom(e.x, e.y, u.dmg); }
            },
            draw(c, k, e) {
                c.translate(e.x, e.y); c.rotate(e.ang);
                c.globalCompositeOperation = 'lighter';
                G(c, -14, 0, 14 + Math.random() * 4, '#ff9a3c', .9);

                c.fillStyle = '#ff007f'; c.beginPath(); c.moveTo(9, -3); c.lineTo(16, 0); c.lineTo(9, 3); c.closePath(); c.fill();
                c.fillStyle = '#9ca3af'; c.beginPath(); c.moveTo(-9, -3); c.lineTo(-13, -8); c.lineTo(-5, -3); c.closePath(); c.fill();
                c.beginPath(); c.moveTo(-9, 3); c.lineTo(-13, 8); c.lineTo(-5, 3); c.closePath(); c.fill();
            }

    };

    WEAPON.emp = (u) => {

    function beginAim(u) {

            life: 1.2,

                c.beginPath(); c.moveTo(u.mx, u.my); c.lineTo(x, y); c.stroke();
                c.translate(x, y); c.rotate(B.t * 1.5);
                const r = 30 - 14 * a;
                c.globalAlpha = .4 + .5 * a; c.strokeStyle = '#ffffff'; c.lineWidth = 1.6;

                for (let i = 0; i < 4; i++) {

    WEAPON.sniper = (u) => {

                const ang = Math.atan2(T.y - sy, T.x - sx);

                for (let i = 1; i <= 6; i++) {

                    c.globalAlpha = a * .5; c.beginPath(); c.ellipse(0, 0, r * .25, r, 0, 0, Math.PI * 2); c.stroke(); c.restore();

    WEAPON.poison = (u) => {

            draw(c, k, e) {

                c.fillStyle = 'rgba(255,255,255,.7)'; c.beginPath(); c.arc(e.x - 2.5, e.y - 3, 2.4, 0, Math.PI * 2); c.fill();

                for (let i = 0; i < 6; i++) puff(T.x + rand(-16, 16), T.y + rand(-12, 12), '#a3e635', 20, 1.5, rand(-14, 14), rand(-45, -15), false, .35);
            }

    WEAPON.bossGatling = (u) => {

        muzzleFlash(u, '#ffb347', 1.5, side * 9);
        casing(u, '#ffcf66'); casing(u, '#ffcf66');
        tracer(u.mx + side * 9, u.my, rndT(.7, .75), '#ff7a1a', 3400, u.dmg, {

    /* ---------- マシーンの更新・発射 ---------- */
    function updateUnit(u, dt) {
        if (!u.alive) return;
        u.cd -= dt;
        if (u.type === 'sniper' && !u.aim && u.cd < .6 && u.cd > 0) beginAim(u);
        if (u.cd <= 0) {
            u.cd = Math.max(u.cd + u.period, .05);
            recoil(u);
            (WEAPON[u.type] || WEAPON.machineGun)(u);
        }
    }

    /* ---------- ボスのAIと攻撃 ---------- */
    function startAttack() {
        const b = B.boss;
        const alive = B.units.filter((u) => u.alive);
        if (!alive.length) return;
        b.count++;
        let type = 'bolt';
        if (b.count % 6 === 0) type = 'laser';
        else if (b.count % 4 === 0) type = 'pulse';
        b.type = type; b.mode = 'tele'; b.tt = 0;
        b.teleDur = type === 'bolt' ? .6 : type === 'pulse' ? 1.0 : 1.35;
        b.chargeCol = type === 'laser' ? '#ff2a2a' : type === 'pulse' ? '#ffde00' : '#ff4fa3';
        b.target = type === 'laser' ? alive.reduce((a, u) => (u.dmg > a.dmg ? u : a)) : pick(alive);
        if (type === 'pulse') banner('パルスウェーブ！', 'warn');
        if (type === 'laser') banner('ギガレーザー！ 照準ロック', 'warn');
    }

    function updateBossAI(dt) {
        const b = B.boss;
        b.hand[0] = Math.max(0, b.hand[0] - dt * 3);
        b.hand[1] = Math.max(0, b.hand[1] - dt * 3);
        b.poisonT = Math.max(0, b.poisonT - dt);
        if (b.mode === 'idle') {
            b.timer -= dt;
            b.charge = Math.max(0, b.charge - dt * 3);
            b.lookX *= 1 - Math.min(1, dt * 4); b.lookY *= 1 - Math.min(1, dt * 4);
            if (b.timer <= 0) startAttack();
            return;
        }
        b.tt += dt;
        b.charge = clamp(b.tt / b.teleDur, 0, 1);
        if (Math.random() < dt * 50) {
            const a = rand(0, Math.PI * 2), R = rand(60, 110) * b.S;
            addP({ type: 'spark', x: b.px + Math.cos(a) * R, y: b.py + 4 * b.S + Math.sin(a) * R, vx: -Math.cos(a) * R * 3, vy: -Math.sin(a) * R * 3, life: .33, size: 2, color: b.chargeCol, drag: 0, grav: 0 });
        }
        if (b.target && b.target.alive) {
            const dx = b.target.cx - b.px, dy = b.target.cy - b.py, L = Math.hypot(dx, dy) || 1;
            b.lookX += (dx / L * 3 - b.lookX) * Math.min(1, dt * 6);
            b.lookY += (dy / L * 3 - b.lookY) * Math.min(1, dt * 6);
        }
        if (b.tt >= b.teleDur) {
            executeAttack();
            if (!B) return;
            b.mode = 'idle'; b.charge = 0;
            b.timer = CFG.bossAttackInterval * (b.enraged ? .68 : 1) * rand(.85, 1.15);
        }
    }

    function handPos(side) {
        const b = B.boss;
        return { x: b.px + (side ? 1 : -1) * 94 * b.S, y: b.py + (40 + Math.sin(b.bob * 1.7 + (side ? Math.PI : 0)) * 5) * b.S };
    }

    function executeAttack() {
        const b = B.boss, k = b.enraged ? 1.2 : 1;
        let target = b.target;
        if (!target || !target.alive) target = pick(B.units.filter((u) => u.alive));
        if (!target) return;
        B.bgPulse = 1;
        if (b.type === 'bolt') bossBolt(target, Math.round(CFG.boltDmg * k * rand(.9, 1.1)));
        else if (b.type === 'pulse') bossPulse(Math.round(CFG.pulseDmg * k * rand(.9, 1.1)));
        else bossLaser(target, Math.round(CFG.laserDmg * k * rand(.9, 1.1)));
    }

    function bossBolt(u, dmg) {
        const b = B.boss;
        b.handSide ^= 1;
        b.hand[b.handSide] = 1;
        const h = handPos(b.handSide);
        addEnt({
            life: 2, x: h.x, y: h.y, trav: 0, ph: rand(0, 6),
            update(dt, e) {
                const dx = u.cx - e.x, dy = u.cy - e.y, d = Math.hypot(dx, dy), step = 1000 * dt;
                glowP(e.x, e.y, '#ff4fa3', 14, .3);
                if (Math.random() < dt * 60) spark(e.x, e.y, '#ffb3d9', 1, 80, .3, 1.6);
                if (d <= step) { e.dead = true; damageUnit(u, dmg, '#ff4fa3'); }
                else { e.x += dx / d * step; e.y += dy / d * step; }
            },
            draw(c, k, e) {
                c.globalCompositeOperation = 'lighter';
                G(c, e.x, e.y, 30, '#ff4fa3', .6);
                G(c, e.x, e.y, 13, '#ffffff', 1);
                c.save(); c.translate(e.x, e.y); c.rotate(e.t * 9); c.strokeStyle = '#ffb3d9'; c.lineWidth = 1.6; c.globalAlpha = .9;
                c.strokeRect(-9, -9, 18, 18); c.restore();
            }
        });
    }

    function bossPulse(dmg) {
        const b = B.boss, cx = b.px, cy = b.py + 4 * b.S, SPD = 820;
        let maxD = 0;
        B.units.forEach((u) => {
            if (!u.alive) return;
            const d = Math.hypot(u.cx - cx, u.cy - cy);
            maxD = Math.max(maxD, d);
            after(d / SPD, () => damageUnit(u, dmg, '#ffde00'));
        });
        shake(5);
        addEnt({
            life: Math.max(1.0, maxD / SPD + .25),
            draw(c, k, e) {
                const r = SPD * e.t, a = clamp(1 - e.t / (maxD / SPD + .25), 0, 1);
                c.globalCompositeOperation = 'lighter';
                c.strokeStyle = '#ffde00'; c.globalAlpha = a * .35; c.lineWidth = 26;
                c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2); c.stroke();
                c.strokeStyle = '#ff4fa3'; c.globalAlpha = a * .9; c.lineWidth = 8;
                c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2); c.stroke();
                c.strokeStyle = '#ffffff'; c.globalAlpha = a; c.lineWidth = 2.5;
                c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2); c.stroke();
            }
        });
        glowP(cx, cy, '#ffde00', 120 * b.S, .4);
    }

    function bossLaser(u, dmg) {
        const b = B.boss, sx = b.px, sy = b.py - 54 * b.S;
        shake(6);
        addEnt({
            life: .8, did: false,
            update(dt, e) {
                if (!e.did && e.t > .1) {
                    e.did = true;
                    damageUnit(u, dmg, '#ff2a2a');
                    shake(11);
                    ringEnt(u.cx, u.cy, '#ff2a2a', 110, .5, 5);
                }
                if (e.t > .1 && e.t < .6 && Math.random() < dt * 60) spark(u.cx, u.cy, '#ffb3b3', 2, 340, .35, 2);
            },
            draw(c, k, e) {
                const grow = clamp(e.t / .1, 0, 1), fade = 1 - clamp((e.t - .5) / .3, 0, 1);
                const w = 16 * grow * fade * (1 + .1 * Math.sin(e.t * 80));
                if (w > .3) beam(c, sx, sy, u.cx, u.cy, '#ff2a2a', w, fade);
                c.globalCompositeOperation = 'lighter';
                G(c, u.cx, u.cy, 60 * grow * fade, '#ff5a5a', .7);
            }
        });
    }

    function damageUnit(u, dmg, col) {
        if (!u.alive || B.phase !== 'fight') return;
        u.hp = Math.max(0, u.hp - dmg);
        setUnitHP(u);
        addNum(u.cx + rand(-10, 10), u.cy - 42, dmg, '#ff6b81', 1.15);
        spark(u.cx, u.cy, col, 12, 320, .45, 2);
        glowP(u.cx, u.cy, col, 60, .2);
        ringEnt(u.cx, u.cy, col, 70, .3, 3);
        shake(3 + dmg / 40);
        try {
            u.el.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-9px)' }, { transform: 'translateX(8px)' }, { transform: 'translateX(-5px)' }, { transform: 'translateX(0)' }], { duration: 320 });
            u.circle.animate([{ filter: 'brightness(2.4) saturate(2)' }, { filter: 'none' }], { duration: 320 });
        } catch (e) { /* noop */ }
        if (u.hp <= 0) unitDown(u);
    }

    function unitDown(u) {
        u.alive = false;
        u.el.classList.add('down'); u.el.classList.remove('low');
        if (u.aimEnt) u.aimEnt.dead = true;
        explosion(u.cx, u.cy, { scale: .8 });
        shake(8);
        banner(`${u.name} 戦闘不能！`, 'warn');
        addEnt({
            life: 3.2,
            update(dt) {
                if (Math.random() < dt * 14) puff(u.cx + rand(-12, 12), u.cy - 10, '#3a3f5c', 14, 1.1, rand(-12, 12), rand(-60, -30));
                if (Math.random() < dt * 4) spark(u.cx, u.cy, '#ffb347', 2, 200, .4, 1.6);
            }
        });
        if (B.phase === 'fight' && B.units.every((x) => !x.alive)) {
            B.phase = 'lost'; B.lostT = 0;
            B.boss.mode = 'idle'; B.boss.charge = 0;
        }
    }

    /* ---------- 描画 ---------- */
    function drawBg(t) {
        const c = bgC;
        c.setTransform(DPR, 0, 0, DPR, 0, 0);
        c.clearRect(0, 0, VW, VH);
        const b = B.boss, enr = b.enraged, hy = VH * .6;
        let g = c.createLinearGradient(0, 0, 0, VH);
        g.addColorStop(0, '#16061f'); g.addColorStop(.6, '#0b0a1d'); g.addColorStop(1, '#04050d');
        c.fillStyle = g; c.fillRect(0, 0, VW, VH);
        const rg = c.createRadialGradient(b.ax, b.ay, 10, b.ax, b.ay, Math.max(VW, VH) * .55);
        rg.addColorStop(0, enr ? 'rgba(255,40,40,.30)' : 'rgba(255,0,127,.26)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
        c.fillStyle = rg; c.fillRect(0, 0, VW, VH);

        c.save();
        c.beginPath(); c.rect(0, hy, VW, VH - hy); c.clip();
        c.strokeStyle = enr ? 'rgba(255,80,80,.22)' : 'rgba(0,240,255,.18)'; c.lineWidth = 1;
        const n = 14, off = (t * .35) % 1;
        for (let i = 0; i <= n; i++) {
            const k = (i + off) / n, y = hy + (VH - hy) * k * k;
            c.beginPath(); c.moveTo(0, y); c.lineTo(VW, y); c.stroke();
        }
        const cx = VW / 2;
        for (let j = -14; j <= 14; j++) { c.beginPath(); c.moveTo(cx + j * 10, hy); c.lineTo(cx + j * VW * .12, VH); c.stroke(); }
        c.restore();

        g = c.createLinearGradient(0, 0, VW, 0);
        g.addColorStop(0, 'rgba(255,0,127,0)'); g.addColorStop(.5, enr ? 'rgba(255,80,80,.7)' : 'rgba(0,240,255,.6)'); g.addColorStop(1, 'rgba(255,0,127,0)');
        c.fillStyle = g; c.fillRect(0, hy - 1, VW, 2);

        c.fillStyle = '#ffffff';
        B.stars.forEach((s) => { c.globalAlpha = .25 + .25 * Math.sin(t * 2 + s.p); c.fillRect(s.x, s.y, s.s, s.s); });
        c.globalAlpha = 1;
        if (B.bgPulse > 0) { c.fillStyle = `rgba(255,0,80,${B.bgPulse * .14})`; c.fillRect(0, 0, VW, VH); }
        g = c.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * .35, VW / 2, VH / 2, Math.max(VW, VH) * .75);
        g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.65)');
        c.fillStyle = g; c.fillRect(0, 0, VW, VH);
    }

    const P = (pts) => {
        const p = new Path2D();
        p.moveTo(pts[0][0], pts[0][1]);
        for (let i = 1; i < pts.length; i++) p.lineTo(pts[i][0], pts[i][1]);
        p.closePath();
        return p;
    };
    const mirror = (pts) => pts.map(([x, y]) => [-x, y]).reverse();
    const lg = (c, x0, y0, x1, y1, stops) => {
        const g = c.createLinearGradient(x0, y0, x1, y1);
        stops.forEach(([o, col]) => g.addColorStop(o, col));
        return g;
    };

    function drawBoss(c) {
        const b = B.boss;
        if (!b.visible) return;
        const t = B.t, S = b.S;
        const eyeCol = b.enraged ? '#ff2a2a' : '#ff4fa3';
        const flashList = [];
        c.save();
        c.translate(b.px + b.shx, b.py + b.shy);
        c.scale(S, S);
        c.globalAlpha = b.alpha;

        const part = (pts, fill, edge, lw, glow) => {
            const p = P(pts);
            c.fillStyle = fill; c.fill(p);
            c.shadowColor = edge; c.shadowBlur = glow === undefined ? 10 : glow;
            c.strokeStyle = edge; c.lineWidth = lw || 2; c.lineJoin = 'round'; c.stroke(p);
            c.shadowBlur = 0;
            flashList.push(p);
        };
        const steel = (y0, y1) => lg(c, 0, y0, 0, y1, [[0, '#3b4478'], [.5, '#222a52'], [1, '#10142c']]);

        // スラスター
        const fl = 1 + Math.sin(t * 30) * .12;
        c.globalCompositeOperation = 'lighter';
        G(c, 0, 92, 46 * fl, '#ff007f', .55); G(c, -22, 76, 18 * fl, '#ff9ad0', .6); G(c, 22, 76, 18 * fl, '#ff9ad0', .6);
        if (b.poisonT > 0) G(c, 0, 0, 125, '#a3e635', .25 * Math.min(1, b.poisonT));
        c.globalCompositeOperation = 'source-over';

        // ハロー
        c.save();
        c.translate(0, -4);
        for (let i = 0; i < 3; i++) {
            const a = t * .9 + i * Math.PI * 2 / 3;
            c.save(); c.translate(Math.cos(a) * 100, Math.sin(a) * 100); c.rotate(a);
            c.fillStyle = eyeCol; c.shadowColor = eyeCol; c.shadowBlur = 10; c.fillRect(-4, -4, 8, 8); c.restore();
        }
        c.rotate(t * .35);
        c.strokeStyle = 'rgba(255,79,163,.6)'; c.lineWidth = 3; c.setLineDash([46, 20, 12, 20]);
        c.shadowColor = '#ff4fa3'; c.shadowBlur = 14;
        c.beginPath(); c.arc(0, 0, 100, 0, Math.PI * 2); c.stroke();
        c.rotate(-t * 1.25);
        c.lineWidth = 1.6; c.setLineDash([3, 9]); c.strokeStyle = 'rgba(124,200,255,.55)'; c.shadowColor = '#7cc8ff';
        c.beginPath(); c.arc(0, 0, 88, 0, Math.PI * 2); c.stroke();
        c.setLineDash([]); c.shadowBlur = 0;
        c.restore();

        // 翼
        const wing = [[-34, -30], [-84, -78], [-112, -60], [-78, -8], [-46, 0]];
        const wf = lg(c, -100, -70, -40, 0, [[0, '#4b1e7a'], [1, '#170a2e']]);
        part(wing, wf, '#b026ff', 2, 8);
        part(mirror(wing), lg(c, 100, -70, 40, 0, [[0, '#4b1e7a'], [1, '#170a2e']]), '#b026ff', 2, 8);

        // 腕のエネルギーライン
        c.strokeStyle = 'rgba(255,79,163,.4)'; c.lineWidth = 2; c.setLineDash([4, 5]);
        [-1, 1].forEach((s, i) => {
            const hy = 40 + Math.sin(t * 1.7 + i * Math.PI) * 5;
            c.beginPath(); c.moveTo(s * 70, -6); c.lineTo(s * 94, hy); c.stroke();
        });
        c.setLineDash([]);

        // 肩
        const sh = [[-46, -40], [-88, -34], [-104, -8], [-86, 14], [-46, 4]];
        part(sh, steel(-40, 14), eyeCol, 2.2, 10);
        part(mirror(sh), steel(-40, 14), eyeCol, 2.2, 10);
        c.fillStyle = 'rgba(255,79,163,.85)';
        [-1, 1].forEach((s) => { c.fillRect(s * 74 - 8, -14, 16, 3); c.fillRect(s * 74 - 8, -8, 16, 3); });

        // 胴体
        const torso = [[-46, -36], [46, -36], [42, 36], [24, 60], [-24, 60], [-42, 36]];
        part(torso, steel(-36, 60), eyeCol, 2.5, 12);
        c.strokeStyle = 'rgba(255,255,255,.14)'; c.lineWidth = 1.4; c.beginPath();
        c.moveTo(-30, -26); c.lineTo(-24, 40); c.moveTo(30, -26); c.lineTo(24, 40); c.moveTo(-34, 22); c.lineTo(34, 22); c.stroke();
        part([[-18, 60], [18, 60], [10, 74], [-10, 74]], steel(60, 74), eyeCol, 1.8, 6);

        // コア
        const cp = 1 + Math.sin(t * 4) * .08 + b.charge * .5;
        const cc = b.mode === 'tele' ? b.chargeCol : eyeCol;
        c.globalCompositeOperation = 'lighter';
        G(c, 0, 4, 40 * cp + b.charge * 60, cc, .55 + b.charge * .4);
        c.globalCompositeOperation = 'source-over';
        const cg = c.createRadialGradient(0, 4, 0, 0, 4, 18 * cp);
        cg.addColorStop(0, '#ffffff'); cg.addColorStop(.45, '#ff7ac0'); cg.addColorStop(1, '#8a0f52');
        c.fillStyle = cg; c.beginPath(); c.arc(0, 4, 16 * cp, 0, Math.PI * 2); c.fill();
        c.strokeStyle = '#ffd0ea'; c.lineWidth = 2.2; c.shadowColor = cc; c.shadowBlur = 10;
        c.beginPath(); c.arc(0, 4, 22, 0, Math.PI * 2); c.stroke(); c.shadowBlur = 0;
        if (b.charge > 0) {
            c.strokeStyle = cc; c.globalAlpha = b.charge; c.lineWidth = 2;
            c.beginPath(); c.arc(0, 4, 70 * (1 - b.charge) + 24, 0, Math.PI * 2); c.stroke(); c.globalAlpha = b.alpha;
        }
        c.save(); c.translate(0, 4); c.rotate(t * 1.5); c.fillStyle = 'rgba(255,255,255,.65)';
        c.beginPath(); for (let i = 0; i < 3; i++) { const a = i * Math.PI * 2 / 3; c.lineTo(Math.cos(a) * 9, Math.sin(a) * 9); } c.closePath(); c.fill(); c.restore();

        // 頭
        const horn = [[-24, -66], [-40, -92], [-18, -70]];
        part(horn, '#2a1740', eyeCol, 1.8, 6); part(mirror(horn), '#2a1740', eyeCol, 1.8, 6);
        part([[-7, -72], [0, -100], [7, -72]], '#2a1740', eyeCol, 1.8, 6);
        const head = [[-24, -72], [24, -72], [32, -52], [22, -38], [-22, -38], [-32, -52]];
        part(head, lg(c, 0, -72, 0, -38, [[0, '#454f8c'], [1, '#1b2147']]), eyeCol, 2.4, 12);
        c.fillStyle = '#07040f'; c.beginPath();
        c.moveTo(-22, -60); c.lineTo(22, -60); c.lineTo(18, -47); c.lineTo(-18, -47); c.closePath(); c.fill();
        const ex = b.lookX, ey = b.lookY * .6;
        c.globalCompositeOperation = 'lighter';
        G(c, -10 + ex, -54 + ey, 18, eyeCol, .8); G(c, 10 + ex, -54 + ey, 18, eyeCol, .8);
        c.globalCompositeOperation = 'source-over';
        c.fillStyle = eyeCol; c.shadowColor = eyeCol; c.shadowBlur = 10;
        c.fillRect(-17 + ex, -56 + ey, 12, 5); c.fillRect(5 + ex, -56 + ey, 12, 5);
        c.shadowBlur = 0;
        c.fillStyle = '#fff'; c.fillRect(-13 + ex, -55 + ey, 4, 3); c.fillRect(9 + ex, -55 + ey, 4, 3);

        // 浮遊する拳
        [-1, 1].forEach((s, i) => {
            const hy = 40 + Math.sin(t * 1.7 + i * Math.PI) * 5;
            const hex = [];
            for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3 + Math.PI / 6; hex.push([s * 94 + Math.cos(a) * 19, hy + Math.sin(a) * 19]); }
            part(hex, steel(hy - 19, hy + 19), eyeCol, 2.2, 10);
            c.globalCompositeOperation = 'lighter';
            G(c, s * 94, hy + 6, 14 + b.hand[i] * 26, '#ff7ac0', .6 + .4 * b.hand[i]);
            c.globalCompositeOperation = 'source-over';
        });

        if (b.flash > .02) {
            c.fillStyle = `rgba(255,255,255,${Math.min(.5, b.flash * .6)})`;
            flashList.forEach((p) => c.fill(p));
        }
        c.restore();
    }

    function drawTelegraph(c) {
        const b = B.boss;
        if (b.mode !== 'tele' || !b.target || !b.target.alive || B.phase !== 'fight') return;
        const k = b.tt / b.teleDur, u = b.target;
        if (b.type === 'pulse') return;
        const col = b.type === 'laser' ? '#ff2a2a' : '#ff4fa3';
        c.save();
        c.globalCompositeOperation = 'lighter';
        if (b.type === 'laser') {
            c.strokeStyle = col; c.globalAlpha = (.2 + .5 * k) * (.6 + .4 * Math.sin(B.t * 40)); c.lineWidth = 1.5;
            c.beginPath(); c.moveTo(b.px, b.py - 54 * b.S); c.lineTo(u.cx, u.cy); c.stroke();
        }
        c.translate(u.cx, u.cy); c.rotate(B.t * 2.2);
        const r = 56 - 22 * k;
        c.strokeStyle = col; c.lineWidth = 2; c.globalAlpha = .55 + .35 * Math.sin(B.t * 18);
        c.setLineDash([10, 8]); c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.stroke(); c.setLineDash([]);
        for (let i = 0; i < 4; i++) { c.rotate(Math.PI / 2); c.beginPath(); c.moveTo(r - 6, 0); c.lineTo(r + 8, 0); c.stroke(); }
        c.restore();
    }

    function render() {
        drawBg(B.t);
        const c = fxC;
        c.setTransform(DPR, 0, 0, DPR, 0, 0);
        c.clearRect(0, 0, VW, VH);
        if (B.shake > .05) { B.sx = rand(-1, 1) * B.shake; B.sy = rand(-1, 1) * B.shake; } else { B.sx = 0; B.sy = 0; }
        c.save();
        c.translate(B.sx, B.sy);
        drawBoss(c); drawTelegraph(c); drawEnts(c); drawParts(c); drawNums(c);
        c.restore();
        bbWrap.style.transform = (B.sx || B.sy) ? `translate(${B.sx}px, ${B.sy}px)` : '';
        c.globalCompositeOperation = 'source-over';
        if (B.flashW > .01) { c.globalAlpha = Math.min(1, B.flashW); c.fillStyle = '#ffffff'; c.fillRect(0, 0, VW, VH); }
        if (B.flashR > .01) { c.globalAlpha = B.flashR * .35; c.fillStyle = '#ff1a1a'; c.fillRect(0, 0, VW, VH); }
        c.globalAlpha = 1;
    }

    /* ---------- 結果表示・基地へ戻る ---------- */
    function showResult(won) {
        if (B.resultShown) return;
        B.resultShown = true;
        B.phase = won ? 'won' : 'lost';
        const total = B.units.length, alive = B.units.filter((u) => u.alive).length;
        let html;
        if (won) {
            gold += CFG.rewardGold;
            const unlocked = !bossGatlingUnlocked;
            if (unlocked) bossGatlingUnlocked = true;
            updateUI(); renderFooter(); saveGame();
            html = `<div class="bb-result-card win">
                <div class="bb-result-title">ボス撃破！</div>
                <div class="bb-result-sub">サイバータイタン「オメガ」を撃破した！</div>
                <div class="bb-result-reward"><i class="fa-solid fa-coins"></i> 報酬 +¥${fmt(CFG.rewardGold)}</div>
                ${unlocked ? '<div class="bb-result-unlock"><i class="fa-solid fa-fire"></i> 新兵器「ボスガトリング」が解放された！</div>' : ''}
                <div class="bb-result-stat">生存マシーン ${alive} / ${total}</div>
                <button id="bb-result-btn" class="btn-campaign bb-btn">基地に戻る</button></div>`;
        } else {
            const dealt = Math.floor(bossData.maxHp - bossData.hp);
            html = `<div class="bb-result-card lose">
                <div class="bb-result-title">全機戦闘不能…</div>
                <div class="bb-result-sub">ボスを倒せなかった。マシーンを強化して再挑戦しよう！</div>
                <div class="bb-result-stat">与えたダメージ ${fmt(dealt)} / ${fmt(bossData.maxHp)}</div>
                <button id="bb-result-btn" class="btn-boss bb-btn">基地に戻る</button></div>`;
        }
        const rs = $('bb-result');
        rs.innerHTML = html;
        rs.classList.remove('bb-hide');
        $('bb-result-btn').onclick = leaveBattle;
        B.autoLeave = setTimeout(leaveBattle, won ? 9000 : 7000);
    }

    function leaveBattle() {
        if (!B) return;
        clearTimeout(B.autoLeave);
        cancelAnimationFrame(B.raf);
        B = null;
        inBattle = false;
        const rs = $('bb-result');
        rs.classList.add('bb-hide'); rs.innerHTML = '';
        const view = $('view-boss-battle');
        view.classList.add('hidden'); view.classList.remove('bb-active');
        bbWrap.style.transform = '';
        $('view-game').classList.remove('hidden');
        resizeCanvas();   // ボス戦中のリサイズでキャンバスが潰れるのを防ぐ
        updateUI();
    }

    // 旧実装との互換用（呼ばれても安全なように差し替え）
    window.updateBossBattle = function () { /* 新しいループに置き換え済み */ };
    window.endBossBattle = function () { leaveBattle(); };
})();
</script>

const clamp = (n,lo,hi)=>Math.max(lo,Math.min(hi,n));

const normalMachineIds = ['machineGun','laser','plasma','missile','emp','sniper','poison'];

/* ボス撃破で獲得できる限定マシーン。元のTOWER_TYPESを消さずに追加します。 */
const specialMachines = [
 {id:'hunterDrone',name:'ハンター・ドローン',cost:500,color:'#64f5ff',icon:'fa-crosshairs',dmg:72,range:5.2,rate:14,secret:true},

 {id:'voidLancer',name:'ヴォイド・ランサー',cost:900,color:'#a78bfa',icon:'fa-meteor',dmg:185,range:6.0,rate:42,secret:true},
 {id:'disasterCannon',name:'ディザスター砲',cost:1200,color:'#ff7a3d',icon:'fa-radiation',dmg:310,range:5.5,rate:58,secret:true},
 {id:'stellarForge',name:'ステラ・フォージ',cost:1500,color:'#ffde70',icon:'fa-sun',dmg:440,range:7.0,rate:66,secret:true},
 {id:'singularity',name:'シンギュラリティ',cost:2000,color:'#ce8bff',icon:'fa-atom',dmg:680,range:8.0,rate:78,secret:true}
];
specialMachines.forEach(t=>{if(!TOWER_TYPES[t.id])TOWER_TYPES[t.id]=t;});
const defaultStats = {};
Object.values(TOWER_TYPES).forEach(t=>{defaultStats[t.id]={dmg:Number(t.dmg)||1,range:Number(t.range)||1,rateSeconds:(Number(t.rate)||30)/60};});
let customStats = JSON.parse(JSON.stringify(defaultStats));
let dlcs = {machineTuning:false,bossExpansion:false};
let inventory = [];
let bossRewardsClaimed = {};
let pickedBoss = null;
let activeBattleBoss = null;
let pendingBossReward = false;
let hasExtraSave = false;
let nextBossAt = Date.now()+60000;
let selectedFromInventory = 'machineGun';

const bossSpecs = [
 {id:'hunter',name:'ナノ・ハンター',rank:1,baseHp:2800,attack:0.72,machineDmg:1.05,color:'#00f0ff',hue:145,icon:'fa-crosshairs',desc:'高速連射と追尾弾を使う偵察型ボス。',machine:'hunterDrone'},
 {id:'omega',name:'サイバータイタン・オメガ',rank:2,baseHp:5200,attack:1.00,machineDmg:1.12,color:'#ff007f',hue:0,icon:'fa-robot',desc:'レーザーとパルスを操る標準型の巨大ボス。',machine:'omegaBreaker'},
 {id:'leviathan',name:'ヴォイド・リヴァイアサン',rank:3,baseHp:8500,attack:1.48,machineDmg:1.20,color:'#9b87ff',hue:245,icon:'fa-dragon',desc:'広範囲パルスで部隊全体を追い詰める。',machine:'voidLancer'},
 {id:'disaster',name:'ディザスター・コア',rank:4,baseHp:14000,attack:1.95,machineDmg:1.28,color:'#ff733d',hue:35,icon:'fa-radiation',desc:'高火力レーザーを連発する災厄級ボス。',machine:'disasterCannon'},
 {id:'stellar',name:'ステラ・エンペラー',rank:5,baseHp:22000,attack:2.3,machineDmg:1.35,color:'#ffe16b',hue:65,icon:'fa-sun',desc:'星核をチャージし、苛烈な連続攻撃を放つ。',machine:'stellarForge',dlc:true},
 {id:'singularity',name:'シンギュラリティ神',rank:6,baseHp:34000,attack:2.7,machineDmg:1.45,color:'#d18bff',hue:275,icon:'fa-atom',desc:'空間そのものを歪ませる最上位の最終ボス。',machine:'singularity',dlc:true}
];
function bossSpecsForInventory(){return bossSpecs;}
const standardIds = new Set(normalMachineIds);
const baseOwnedIds = new Set([...normalMachineIds,'bossGatling']);
function hasInInventory(type){return inventory.some(m=>m.type===type);}
function hasPlaced(type){return builtTowers.some(m=>m.type===type);}
function ownedSpecial(type){return !!bossRewardsClaimed[type] || hasInInventory(type) || hasPlaced(type);}
function machineName(type){return TOWER_TYPES[type]?.name || type;}
function machineColor(type){return TOWER_TYPES[type]?.color || '#00f0ff';}
function machineIcon(type){return TOWER_TYPES[type]?.icon || 'fa-microchip';}
function makeMachine(type, level){
 const t=TOWER_TYPES[type]; if(!t)return null;
 return {id:uid(),type,x:null,y:null,level:Math.max(1,Number(level)||1),dmg:t.dmg,range:t.range,cooldown:0};
}
function machineExists(type){return hasInInventory(type)||hasPlaced(type);}
function syncMachineStats(m){
 const t=TOWER_TYPES[m.type];if(!t)return;
 const lv=Math.max(1,Number(m.level)||1);
 m.level=lv;
 m.dmg=Number((t.dmg*(lv===1?1:lv*1.2)).toFixed(2));
 m.range=Number((t.range+(lv===1?0:lv*.2)).toFixed(2));
 if(!Number.isFinite(m.cooldown))m.cooldown=0;
}
function applyCurrentStats(){
 Object.values(TOWER_TYPES).forEach(t=>{
  const base=defaultStats[t.id]||{dmg:t.dmg,range:t.range,rateSeconds:t.rate/60};
  const custom=customStats[t.id]||base;
  const use=dlcs.machineTuning?custom:base;
  t.dmg=clamp(Number(use.dmg)||base.dmg,1,1000000);
  t.range=clamp(Number(use.range)||base.range,.2,30);
  t.rate=Math.round(clamp(Number(use.rateSeconds)||base.rateSeconds,.03,30)*60);
 });
 builtTowers.forEach(syncMachineStats); inventory.forEach(syncMachineStats);
}
function createStarterInventory(){
 const inv=[];
 normalMachineIds.forEach(id=>{if(!hasPlaced(id))inv.push(makeMachine(id,1));});
 if(bossGatlingUnlocked && !hasPlaced('bossGatling'))inv.push(makeMachine('bossGatling',1));
 bossSpecsForInventory().forEach(b=>{if(bossRewardsClaimed[b.id]&&!hasPlaced(b.machine))inv.push(makeMachine(b.machine,1));});
 return inv.filter(Boolean);
}
function normalizeInventory(data){
 if(!Array.isArray(data))return createStarterInventory();
 return data.map(m=>{
  if(!m||!TOWER_TYPES[m.type])return null;
  return {id:m.id||uid(),type:m.type,x:null,y:null,level:Math.max(1,Number(m.level)||1),dmg:Number(m.dmg)||TOWER_TYPES[m.type].dmg,range:Number(m.range)||TOWER_TYPES[m.type].range,cooldown:0};
 }).filter(Boolean);
}
function readExtraSave(){
 hasExtraSave=false;
 try{
  const raw=localStorage.getItem(EXTRA_SAVE_KEY);
  if(raw){
   const data=JSON.parse(raw);
   if(data&&typeof data==='object'){
    hasExtraSave=Array.isArray(data.inventory);
    dlcs={machineTuning:data.dlcs?.machineTuning===true,bossExpansion:data.dlcs?.bossExpansion===true};
    bossRewardsClaimed=(data.bossRewardsClaimed&&typeof data.bossRewardsClaimed==='object')?data.bossRewardsClaimed:{};
    const loaded=data.customStats&&typeof data.customStats==='object'?data.customStats:{};
    customStats=JSON.parse(JSON.stringify(defaultStats));
    Object.keys(customStats).forEach(id=>{const v=loaded[id];if(v){customStats[id]={dmg:clamp(Number(v.dmg)||defaultStats[id].dmg,1,1000000),range:clamp(Number(v.range)||defaultStats[id].range,.2,30),rateSeconds:clamp(Number(v.rateSeconds)||defaultStats[id].rateSeconds,.03,30)};}});
    inventory=normalizeInventory(data.inventory);
   }
  }
 }catch(e){console.warn('追加セーブデータの読み込みに失敗しました',e);}
 if(!hasExtraSave)inventory=createStarterInventory();
 // 旧バージョンのセーブでボスガトリングが解放済みなら、設置可能な1台を補完します。
 if(bossGatlingUnlocked&&!machineExists('bossGatling'))inventory.push(makeMachine('bossGatling',1));
 bossSpecsForInventory().forEach(b=>{if(bossRewardsClaimed[b.id]&&!machineExists(b.machine))inventory.push(makeMachine(b.machine,1));});
 applyCurrentStats();
}
const previousLoadGame=window.loadGame;
window.loadGame=function(){previousLoadGame();readExtraSave();};
const previousSaveGame=window.saveGame;
window.saveGame=function(){
 try{previousSaveGame();}catch(e){console.warn('標準セーブを保存できませんでした',e);}
 try{localStorage.setItem(EXTRA_SAVE_KEY,JSON.stringify({inventory,dlcs,customStats,bossRewardsClaimed}));}catch(e){console.warn('追加セーブを保存できませんでした',e);}
};
const previousClearSave=window.clearSave;
window.clearSave=function(){
 try{localStorage.removeItem(EXTRA_SAVE_KEY);}catch(e){}
 dlcs={machineTuning:false,bossExpansion:false};bossRewardsClaimed={};inventory=[];customStats=JSON.parse(JSON.stringify(defaultStats));
 previousClearSave();
};

 <div class="cyber-v2-footnote"><i class="fa-solid fa-floppy-disk"></i> DLCの有効・無効と性能設定はこのブラウザのセーブデータに保存されます。</div>`;
 $('cyber-toggle-tuning').onclick=()=>toggleDlc('machineTuning');

}

 window.saveGame();
